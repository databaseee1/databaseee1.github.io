const login = JSON.parse(loginRaw);

}







async function checkUserStatus() {
  try {

    const snap = await get(ref(db, "Statusakun_host/" + login.userId));

    if (!snap.exists()) return;

    const data = snap.val();
    const status = data.status;

    if (status === "banned" || status === "suspend") {

      // hapus session
      localStorage.removeItem("user");
      sessionStorage.clear();

      // redirect paksa
      window.location.replace("status_akun.html");
    }

  } catch (err) {
    console.log("status check error:", err);
  }
}

// jalankan sekali saat halaman dibuka

// OPTIONAL 🔥 auto cek tiap 5 detik (biar realtime)
setInterval(checkUserStatus, 5000);


















let fakeStream = null;

/* START CAMERA */
async function startFakeCamera(){

  try{

    if(fakeStream) return;

    const video =
      document.getElementById(
        "fakeCallCamera"
      );

    if(!video) return;

    fakeStream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user"
        },
        audio:false
      });

    video.srcObject =
      fakeStream;

  }catch(err){

    console.log(
      "Camera gagal:",
      err
    );

  }
}

/* STOP CAMERA */
function stopFakeCamera(){

  if(fakeStream){

    fakeStream
      .getTracks()
      .forEach(track=>{
        track.stop();
      });

    fakeStream = null;
  }

  const video =
    document.getElementById(
      "fakeCallCamera"
    );

  if(video){
    video.srcObject = null;
  }
}

const CREDIT_RATE = 171.1;

function formatSaldo(saldoRupiah){

  saldoRupiah = Number(saldoRupiah || 0);

  // 🔥 jika sudah 1 juta → M
  if(saldoRupiah >= 1000000){

    const juta = saldoRupiah / 1000000;

    return Number.isInteger(juta)
      ? juta + "M"
      : juta.toFixed(1) + "M";
  }

  // 🔥 jika masih kecil → credits (DESIMAL)
  const credits = saldoRupiah / CREDIT_RATE;

  return credits.toFixed(1);
}
setText(
  "saldo",
  formatSaldo(foundUser.saldo)
);

    const genderIcon = document.getElementById("genderIcon");
    if (genderIcon && foundUser.jk) {
      genderIcon.src = foundUser.jk.toLowerCase().includes("laki")
        ? "assets/images/male_icon_new_3.png"
        : "assets/images/female_icon_new_3.png";

    /* ================= STATUS ================= */
    const icon = document.getElementById("statusIcon");
    const text = document.getElementById("statusVerifikasi");

    }

document.addEventListener("DOMContentLoaded", () => {

  const items = document.querySelectorAll("#bottomNav .nav-item");

  let mine = null;

  items.forEach(item => {
    if (item.getAttribute("onclick")?.includes("my_akun.html")) {
      mine = item;
    }
  });

  if (!mine) mine = items[items.length - 1];

  if (mine) {
    mine.classList.add("active");

    const img = mine.querySelector(".nav-icon");
    if (img) img.src = img.dataset.active;
  }
});
