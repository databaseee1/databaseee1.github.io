<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Daftar Blokir</title>

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>


    

* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  outline: none !important;
}

/* hilangkan highlight saat klik/focus */
button, a, div, span, img {
  outline: none !important;
}


img {

  -webkit-user-drag: none;
  user-select: none;
}



* {
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}



body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#fff;
  color:#000;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  height:55px;
  background:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-weight:bold;
  font-size:16px;

  z-index:1000;
}

/* BACK ICON */
.back{
  position:absolute;
  left:15px;
  font-size:18px;
  cursor:pointer;
  color:#000;
}

/* CONTENT */
.container{
  padding-top:70px;
  text-align:center;
  padding-left:20px;
  padding-right:20px;
}

.box{

  padding:20px;
  border-radius:12px;
  display:inline-block;
}

.empty{
  font-size:14px;
  color:#555;
}
</style>
</head>

<body>

<div class="header">

  <div class="back" onclick="history.back()">
    <i class="fa fa-chevron-left"></i>
  </div>

  Daftar Blokir
</div>

<div class="container">

  <div class="box">
    <div class="empty">
      Tidak ada daftar blokir
    </div>
  </div>

</div>

<script>
/* ================= LOGIN CHECK ================= */
const login = JSON.parse(localStorage.getItem("user"));

if(!login || !login.userId){
  alert("Silakan login terlebih dahulu");
  window.location.href = "Login.html";
}

if(!login.userId){
  localStorage.clear();
  window.location.href = "Login.html";
}






</script>

</body>
</html>
