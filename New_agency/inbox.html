function formatTime(timestamp) {
  const now = new Date();
  const date = new Date(timestamp);

  const diff = Math.floor((now - date) / (1000 * 60 * 60 * 24));

  if (diff === 0) {
    const h = String(date.getHours()).padStart(2, '0');
    const m = String(date.getMinutes()).padStart(2, '0');
    return `${h}.${m}`;
  }

  if (diff === 1) return "Kemarin";

  const d = String(date.getDate()).padStart(2, '0');
  const m = String(date.getMonth() + 1).padStart(2, '0');
  return `${d}-${m}`;
}

      `fithnerchats/customer_service/${emailNode}`
    );

    /* ================= READ NODE LAMA ================= */
    get(oldNode).then((snap) => {
      if (snap.exists()) {
        snap.forEach(child => {
          update(
            ref(db, `fithnerchats/customer_service/${userId}/${child.key}`),
            {
              read: true,
              readAdmin: true
            }
          );
        });
      }
    });

    /* ================= READ NODE BARU (ADMIN CHAT + FOTO) ================= */
    get(newNode).then((snap) => {
      if (snap.exists()) {
        snap.forEach(child => {
          update(
            ref(db, `fithnerchats/customer_service/${emailNode}/${child.key}`),
            {
              read: true
            }
          );
        });
      }
    });

  }
  /* ================= PENGUNJUNG ================= */
  else if (id === "pengunjung") {

    const refPengunjung = ref(db, `fithnerchats/pengunjung/${userId}`);

    get(refPengunjung).then((snap) => {

      if (snap.exists()) {

        snap.forEach(child => {
          update(
            ref(db, `fithnerchats/pengunjung/${userId}/${child.key}`),
            { read: true }
          );
        });

      }

    });
  }

  /* ================= NOTIFIKASI ================= */
else if (id === "notifikasi") {

  const userId = login.userId;

  // ================= STATUS AKUN =================
  const refNotif = ref(db, "fithnerchats/notifikasi");

  get(refNotif).then((snap) => {

    if (snap.exists()) {

      snap.forEach(child => {

        const data = child.val();

        if (data.userId === userId) {

          update(
            ref(db, `fithnerchats/notifikasi/${child.key}`),
            { read: true }
          );

        }

      });

    }

  });

  // ================= WITHDRAW (FIX PATH) =================
  const refWithdraw = ref(db, `fithnerchats/notifikasi/${userId}/withdraw`);

  get(refWithdraw).then((snap) => {

    if (snap.exists()) {

      snap.forEach(child => {

        update(
          ref(db, `fithnerchats/notifikasi/${userId}/withdraw/${child.key}`),
          { read: true }
        );

      });

    }

  });

}
  window.location.href = "pesan_lengkap.html";
};



/* ================= LOAD ISI CHAT ================= */
document.addEventListener("DOMContentLoaded", () => {

  function cleanId(id) {
    return (id || "").toString().toLowerCase();
  }

  const chatList = document.getElementById("chatList");

  const chatsRef = ref(db, "chats");

  function loadInbox() {

    if (!chatList) return;

    onValue(chatsRef, async (snap) => {

      chatList.innerHTML = "";

      const usersSnap = await get(ref(db, "users1"));

      const users = {};

      usersSnap.forEach(u => {
        const d = u.val();

        if (d.userId) {
          users[d.userId] = d;
        }
      });

      const myEmailKey = (login.email || "")
        .toLowerCase()
        .replace(/@/g, "_")
        .replace(/\./g, "_");

      const chatArray = [];

      snap.forEach((child) => {

        const chatId = child.key;

        // hanya chat milik user login
        if (!chatId.startsWith(myEmailKey + "_")) {
          return;
        }

        const data = child.val() || {};
        const history = data.history || {};

        const msgs = Object.values(history).filter(Boolean);

        if (!msgs.length) return;

        const lastMsg = msgs.reduce((max, m) => {
          return (m.time || 0) > (max.time || 0)
            ? m
            : max;
        }, msgs[0]);

        chatArray.push({
          chatId,
          msgs,
          lastMsg,
          lastTime: lastMsg.time || 0
        });

      });

      chatArray.sort((a, b) => b.lastTime - a.lastTime);

      chatArray.forEach(({ chatId, msgs, lastMsg, lastTime }) => {

        let unreadCount = 0;

        msgs.forEach(msg => {

          const sender = msg.senderId || "";

          const isFromOther =
            sender !== lastMsg.senderId;

          const isUnread =
            msg.read === false;

          if (isFromOther && isUnread) {
            unreadCount++;
          }

        });

        const otherId =
          chatId.replace(myEmailKey + "_", "");

        const otherUser =
          users[otherId];

        const otherName =
          otherUser?.nama ||
          lastMsg.senderName ||
          "Unknown User";

        const otherFoto =
          otherUser?.foto?.[0] ||
          lastMsg.senderFoto ||
          "default.png";

        const otherStatus =
          otherUser?.statush || "";

const lastText =
  lastMsg.gift
    ? `<img src="${lastMsg.giftImg}" style="width:20px;height:20px;vertical-align:middle;"> ${lastMsg.giftName}`
    : lastMsg.foto
      ? "📷 Foto"
      : shortText(lastMsg.text || "", 30);

        chatList.innerHTML += `
          <div class="chat-item"
            onclick="openChat('${chatId}','${otherName}','${otherFoto}')">

            <img class="chat-img" src="${otherFoto}">

            <div class="chat-content">

              <div class="chat-top">

                <div class="chat-name">
                  ${otherName}
                  ${otherStatus
                    ? `<span class="status-tag">${otherStatus}</span>`
                    : ""}
                </div>

              <div class="chat-time"
  style="display:flex;flex-direction:column;align-items:flex-end;gap:2px;padding-top:2px;">

  <div style="font-size:12px;opacity:.7;">
    ${formatTime(lastTime)}
  </div>

  ${unreadCount > 0
    ? `<div class="badge">${unreadCount}</div>`
    : `<div style="height:16px;"></div>`
  }



                </div>

              </div>

              <div class="chat-msg"
                style="margin-top:-12px;line-height:1.3;">
                ${lastText}
              </div>

            </div>

          </div>
        `;
      });

    });

  }

  function shortText(text, max = 30) {
    if (!text) return "";
    return text.length > max
      ? text.substring(0, max) + "..."
      : text;
  }

  loadInbox();

});

/* ================= OPEN CHAT ================= */
window.openChat = function(chatId, nama, foto){

  localStorage.setItem("chatId", chatId);
  localStorage.setItem("chatNama", nama);
  localStorage.setItem("chatFoto", foto);

  const historyRef =
    ref(db, `chats/${chatId}/history`);

  get(historyRef).then(snap => {

    snap.forEach(child => {

      const msg = child.val();

if (
  msg.senderId !== login.userId &&
  msg.read === false
) {
  update(
    ref(db, `chats/${chatId}/history/${child.key}`),
    {
      read: true
    }
  );
}
    });

    window.location.href = "isi-chat.html";

  });

};











window.goNav = function(el, url) {

  document.querySelectorAll("#bottomNav .nav-item").forEach(item => {
    item.classList.remove("active");

    const img = item.querySelector(".nav-icon");
    if (img) {
      img.src = img.dataset.default;
    }
  });

  el.classList.add("active");

  const img = el.querySelector(".nav-icon");
  if (img) {
    img.src = img.dataset.active;
  }

  setTimeout(() => {
    window.location.href = url;
  }, 150);
};
