<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengaturan Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  font-family: Arial;
  background:#f5f5f5;
  margin:0;
  padding:15px;
  padding-top: 65px;
}

/* HEADER */
.header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 55px;
  background: white;
  display: flex;
  align-items: center;
  gap:10px;
  padding: 0 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  z-index: 999;
}

.back {
  font-size: 18px;
  cursor: pointer;
  width: 40px;
}

.title {
  font-size: 16px;
  font-weight: bold;
}

/* CARD MENU */
.card {
  background: #fff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
  transition: 0.2s;
}

.card:hover{
  transform: scale(1.01);
}

.card i{
  font-size: 20px;
  color: #3498db;
  width: 30px;
  text-align: center;
}

.card span{
  font-size: 14px;
  font-weight: 500;
}

/* NOTIF */
.notif{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  display:none;
  font-size:13px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back" onclick="history.back()">
    <i class="fa fa-chevron-left"></i>
  </div>
  <div class="title">Pengaturan</div>
</div>

<!-- MENU 10 CARD -->
<div class="card" onclick="go('setting_gift.html')">
  <i class="fa-solid fa-gift"></i><span>Setting gift</span>
</div>

<div class="card" onclick="go('tambah_gift.html')">
  <i class="fa-solid fa-hand-holding-heart"></i><span>Gift Host</span>
</div>


<div class="card" onclick="go('setting_bank.html')">
  <i class="fa-solid fa-building-columns"></i><span>Setting Bank</span>
</div>


<div class="card" onclick="go('admin_add_logo.html')">
  <i class="fa-brands fa-battle-net"></i><span>Logo Home</span>
</div>

<div class="card" onclick="go('admin_banner.html')">
 <i class="fa-solid fa-rectangle-ad"></i><span>Banner Home</span>
</div>



<div class="card" onclick="go('my_postingan.html')">
  <i class="fa-solid fa-newspaper"></i><span>MY POSTINGAN</span>
</div>



<div class="card" onclick="go('contact_footer.html')">
  <i class="fa-solid fa-address-card"></i><span>Contect footer</span>
</div>



<div class="card" onclick="go('template_chat.html')">
  <i class="fa fa-credit-card"></i><span>Template Chat</span>
</div>

<div class="card" onclick="go('defoul.html')">
  <i class="fa fa-shield"></i><span>Privasi</span>
</div>

<div class="card" onclick="go('defoul.html')">
  <i class="fa fa-sliders"></i><span>Pengaturan Sistem</span>
</div>

<!-- NOTIF -->
<div class="notif" id="notif"></div>

<script>
/* ================= LOGIN CHECK ================= */
const adminData = JSON.parse(localStorage.getItem("adminLogin") || "{}");

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}

/* ================= NAV ================= */
function go(url){
  window.location.href = url;
}

/* ================= NOTIF ================= */
function showNotif(msg){
  const n = document.getElementById("notif");
  n.innerText = msg;
  n.style.display = "block";

  setTimeout(()=>{
    n.style.display = "none";
  },2000);
}
</script>

</body>
</html>
