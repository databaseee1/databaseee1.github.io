<script type="module">

import {
initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
onValue,
push,
set,
update,
remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/*=====================================
FIREBASE
=====================================*/

const firebaseConfig={

apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",

authDomain:"users-96dc5.firebaseapp.com",

databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"users-96dc5"

};

const app=initializeApp(firebaseConfig);

const db=getDatabase(app);



/*=====================================
DOM
=====================================*/

const list=
document.getElementById("bannermin327List");

const loading=
document.getElementById("bannermin327Loading");

const totalBanner=
document.getElementById("bannermin327TotalBanner");

const lastUpdate=
document.getElementById("bannermin327LastUpdate");

const cari=
document.getElementById("bannermin327Cari");



let semuaBanner={};

let editKey=null;



/*=====================================
FORMAT
=====================================*/

function formatTanggal(ms){

if(!ms) return "-";

const d=new Date(ms);

return d.toLocaleString("id-ID");

}



/*=====================================
TOAST
=====================================*/

function bannermin327Toast(teks){

const toast=
document.getElementById("bannermin327Toast");

document.getElementById(
"bannermin327ToastText"
).textContent=teks;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},2500);

}



/*=====================================
RENDER
=====================================*/

function renderBanner(data){

list.innerHTML="";

let jumlah=0;

Object.keys(data)
.reverse()
.forEach(key=>{

const item=data[key];

jumlah++;

const card=document.createElement("div");

card.className="bannermin327Card";

card.dataset.key=key;

card.innerHTML=`

<div class="bannermin327Image">

<img
src="${item.Bannermini}"
loading="lazy">

</div>

<div class="bannermin327Content">

<div class="bannermin327Title">

Banner Mini

</div>

<div class="bannermin327Row">

<span>Link</span>

<span>

${item["Link tujuan"]||"-"}

</span>

</div>

<div class="bannermin327Row">

<span>Update</span>

<span>

${item["Diperbaharui oleh"]||"-"}

</span>

</div>

<div class="bannermin327Row">

<span>Dibuat</span>

<span>

${formatTanggal(item.dibuatPada)}

</span>

</div>

<div class="bannermin327Actions">

<button

class="bannermin327Btn bannermin327Edit"

data-edit="${key}"

>

Edit

</button>

<button

class="bannermin327Btn bannermin327Delete"

data-delete="${key}"

>

Hapus

</button>

</div>

</div>

`;

list.appendChild(card);

});

totalBanner.textContent=jumlah;

}

/*=====================================
LOAD REALTIME
=====================================*/

const bannermin327Ref = ref(db,"Bannermini33");

onValue(bannermin327Ref,(snapshot)=>{

loading.style.display="none";

semuaBanner={};

if(!snapshot.exists()){

list.innerHTML=`

<div class="bannermin327Empty">

Belum ada banner.

</div>

`;

totalBanner.textContent="0";

lastUpdate.textContent="-";

return;

}

semuaBanner=snapshot.val();

renderBanner(semuaBanner);

const arr=Object.values(semuaBanner);

arr.sort((a,b)=>

(b.dibuatPada||0)-(a.dibuatPada||0)

);

if(arr.length){

lastUpdate.textContent=

formatTanggal(

arr[0].dibuatPada

);

}

});


/*=====================================
SEARCH
=====================================*/

cari.oninput=()=>{

const key=cari.value
.toLowerCase()
.trim();

if(!key){

renderBanner(semuaBanner);

return;

}

const hasil={};

Object.keys(semuaBanner)
.forEach(id=>{

const item=semuaBanner[id];

const teks=(

(item.Bannermini||"")+" "+

(item["Link tujuan"]||"")+" "+

(item["Diperbaharui oleh"]||"")

).toLowerCase();

if(teks.includes(key)){

hasil[id]=item;

}

});

renderBanner(hasil);

};



/*=====================================
REFRESH
=====================================*/

document

.getElementById(

"bannermin327Refresh"

)

.onclick=()=>{

loading.style.display="block";

setTimeout(()=>{

loading.style.display="none";

renderBanner(semuaBanner);

bannermin327Toast(

"Data berhasil diperbarui"

);

},600);

};



/*=====================================
CLICK CARD
=====================================*/

list.onclick=(e)=>{

const edit=

e.target.dataset.edit;

const hapus=

e.target.dataset.delete;

if(edit){

editKey=edit;

console.log(

"Edit :",

editKey

);

/* Part berikutnya
akan membuka modal */

}

if(hapus){

editKey=hapus;

console.log(

"Hapus :",

editKey

);

/* Part berikutnya
akan membuka confirm */

}

};


/*=====================================
TAMBAH BANNER
=====================================*/

const inputBanner=
document.getElementById(
"bannermin327InputBanner"
);

const inputLink=
document.getElementById(
"bannermin327InputLink"
);

const inputUpdate=
document.getElementById(
"bannermin327InputUpdate"
);

const btnTambah=
document.getElementById(
"bannermin327TambahBtn"
);

const fullLoading=
document.getElementById(
"bannermin327FullLoading"
);

btnTambah.onclick=async()=>{

const banner=
inputBanner.value.trim();

const link=
inputLink.value.trim();

const updateOleh=
inputUpdate.value.trim();

if(!banner){

bannermin327Toast(
"URL Banner wajib diisi."
);

inputBanner.focus();

return;

}

if(!link){

bannermin327Toast(
"Link tujuan wajib diisi."
);

inputLink.focus();

return;

}

fullLoading.style.display="flex";

try{

const newRef=

push(

ref(db,"Bannermini33")

);

await set(newRef,{

Bannermini:banner,

"Link tujuan":link,

"Diperbaharui oleh":

updateOleh||

"Tigo.app",

dibuatPada:

Date.now()

});

inputBanner.value="";

inputLink.value="";

inputUpdate.value="Tigo.app";

bannermin327Toast(

"Banner berhasil ditambahkan."

);

}catch(err){

console.log(err);

bannermin327Toast(

"Gagal menambahkan banner."

);

}

fullLoading.style.display="none";

};


/*=====================================
BUKA MODAL EDIT
=====================================*/


const editBanner=
document.getElementById(
"bannermin327EditBanner"
);

const editLink=
document.getElementById(
"bannermin327EditLink"
);

const editUpdate=
document.getElementById(
"bannermin327EditUpdate"
);


const modalEdit =
document.getElementById("bannermin327EditModal");

const btnCancel =
document.getElementById("bannermin327Cancel");

btnCancel.addEventListener("click",()=>{

modalEdit.style.display="none";

});





list.addEventListener("click",(e)=>{

if(!e.target.dataset.edit)return;

editKey=e.target.dataset.edit;

const item=
semuaBanner[editKey];

editBanner.value=
item.Bannermini||"";

editLink.value=
item["Link tujuan"]||"";

editUpdate.value=
item["Diperbaharui oleh"]||"";

modalEdit.style.display="flex";

});








/*=====================================
SIMPAN EDIT
=====================================*/

document
.getElementById("bannermin327Save")
.onclick=async()=>{

if(!editKey)return;

const banner=
editBanner.value.trim();

const link=
editLink.value.trim();

const updateOleh=
editUpdate.value.trim();

if(!banner){

bannermin327Toast(
"URL Banner tidak boleh kosong."
);

return;

}

fullLoading.style.display="flex";

try{

await update(

ref(
db,
"Bannermini33/"+editKey
),

{

Bannermini:banner,

"Link tujuan":link,

"Diperbaharui oleh":

updateOleh||

"Tigo.app"

}

);

modalEdit.style.display="none";

bannermin327Toast(

"Banner berhasil diperbarui."

);

}catch(e){

console.log(e);

bannermin327Toast(

"Gagal memperbarui banner."

);

}

fullLoading.style.display="none";

};



/*=====================================
CUSTOM CONFIRM
=====================================*/

const confirmBox=

document.getElementById(
"bannermin327Confirm"
);

const btnYes=

document.getElementById(
"bannermin327Yes"
);

const btnNo=

document.getElementById(
"bannermin327No"
);



list.addEventListener("click",(e)=>{

if(!e.target.dataset.delete)return;

editKey=

e.target.dataset.delete;

confirmBox.style.display="flex";

});

btnNo.onclick=()=>{

confirmBox.style.display="none";

};










/*=====================================
HAPUS
=====================================*/

btnYes.onclick=async()=>{

if(!editKey)return;

confirmBox.style.display="none";

fullLoading.style.display="flex";

try{

await remove(

ref(

db,

"Bannermini33/"+editKey

)

);

bannermin327Toast(

"Banner berhasil dihapus."

);

}catch(err){

console.log(err);

bannermin327Toast(

"Gagal menghapus banner."

);

}

fullLoading.style.display="none";

};



/*=====================================
TUTUP MODAL
=====================================*/

window.onclick=(e)=>{

if(

e.target===modalEdit

){

modalEdit.style.display="none";

}

if(

e.target===confirmBox

){

confirmBox.style.display="none";

}

};












</script>
