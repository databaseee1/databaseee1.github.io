


<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Referral</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">



<style> 



body{
  font-family:Arial;
  background:#111;
  color:#fff;
  margin:20px;
}

#dropZone{
  border:3px dashed #666;
  border-radius:15px;
  padding:40px;
  text-align:center;
  cursor:pointer;
  transition:.3s;
}

#dropZone.drag{
  border-color:#00ff88;
  background:#1b1b1b;
}

#fileInput{
  display:none;
}

#gallery{
  margin-top:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
}

.card{
  background:#1d1d1d;
  border-radius:12px;
  overflow:hidden;
  padding:10px;
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:10px;
}

.linkBox{
  margin-top:10px;
  display:flex;
  gap:5px;
}

.linkBox input{
  flex:1;
  padding:8px;
  border:none;
  border-radius:5px;
}

.copyBtn{
  width:45px;
  cursor:pointer;
}

#toast{
  position:fixed;
  top:20px;
  left:50%;
  transform:translateX(-50%);
  background:#00c853;
  color:white;
  padding:12px 20px;
  border-radius:10px;
  opacity:0;
  transition:.3s;
  z-index:99999;
}

#toast.show{
  opacity:1;
}

#resetBtn{
  position:fixed;
  right:20px;
  bottom:20px;
  width:60px;
  height:60px;
  border:none;
  border-radius:50%;
  background:red;
  color:white;
  font-size:25px;
  cursor:pointer;
}

.allLinksBox{
  margin-top:20px;
  display:flex;
  gap:10px;
}

#allLinks{
  flex:1;
  min-height:120px;
  resize:none;
  border:none;
  border-radius:10px;
  padding:15px;
  font-size:14px;
}

#copyAllBtn{
  width:60px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:20px;
}


</style>





<div id="toast"></div>

<div id="dropZone">
  <h2>Drop Gambar Disini</h2>
  <p>atau klik untuk pilih gambar</p>
  <input type="file" id="fileInput" multiple accept="image/*">
</div>

<div id="gallery"></div>




<div id="allLinksBox" class="allLinksBox">

  <textarea
    id="allLinks"
    readonly
    placeholder="Link Cloudinary akan muncul disini..."
  ></textarea>

  <button id="copyAllBtn">
    <i class="fa-solid fa-copy"></i>
  </button>

</div>




<button id="resetBtn">↻</button>









<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  push,
  set,
  get,
  update,
  onValue,
  remove,
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";




/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const realtimeDb = getDatabase(app);


let uploadedLinks = [];

const dropZone = document.getElementById("dropZone");
const fileInput = document.getElementById("fileInput");
const gallery = document.getElementById("gallery");

dropZone.onclick = () => fileInput.click();

fileInput.addEventListener("change",(e)=>{
  uploadFiles(e.target.files);
});

dropZone.addEventListener("dragover",(e)=>{
  e.preventDefault();
  dropZone.classList.add("drag");
});

dropZone.addEventListener("dragleave",()=>{
  dropZone.classList.remove("drag");
});

dropZone.addEventListener("drop",(e)=>{
  e.preventDefault();

  dropZone.classList.remove("drag");

  const files = e.dataTransfer.files;

  if(files.length){
    uploadFiles(files);
  }
});

async function uploadFiles(files){

  for(const file of files){

    await uploadSingle(file);

  }

}

async function uploadSingle(file){

  const formData = new FormData();

  formData.append("file", file);
  formData.append("upload_preset", "fotousershost");

  try{

    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dowoq4a0i/image/upload",
      {
        method:"POST",
        body:formData
      }
    );

    const data = await res.json();

    uploadedLinks.push(data.secure_url);

renderImage(data.secure_url);

updateCombinedLinks();



  }catch(err){

    console.log(err);

  }
}



function updateCombinedLinks(){

  const textarea =
    document.getElementById("allLinks");

  textarea.value =
    uploadedLinks.join(", ");

}




document
.getElementById("copyAllBtn")
.addEventListener("click", async ()=>{

  const text =
    document.getElementById("allLinks").value;

  if(!text) return;

  await navigator.clipboard.writeText(text);

  const toast =
    document.getElementById("toast");

  toast.innerText =
    "Berhasil disalin";

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },1000);

});





function renderImage(url){

  gallery.insertAdjacentHTML(
    "beforeend",
    `
    <div class="card">

      <img src="${url}">

      <div class="linkBox">

        <input
          value="${url}"
          readonly
        >

        <button
          class="copyBtn"
          onclick="copyLink('${url}')"
        >
          📋
        </button>

      </div>

    </div>
    `
  );

}

window.copyLink = async(url)=>{

  await navigator.clipboard.writeText(url);

  const toast = document.getElementById("toast");

  toast.innerText = "Berhasil disalin";

  toast.classList.add("show");

  setTimeout(()=>{

    toast.classList.remove("show");

  },1000);

};

document.getElementById("resetBtn")
.addEventListener("click",()=>{

  if(confirm("Hapus semua tampilan?")){

    gallery.innerHTML = "";

uploadedLinks = [];

document.getElementById(
  "allLinks"
).value = "";

  }

});


</script>
