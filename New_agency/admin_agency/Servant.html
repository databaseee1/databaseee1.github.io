<script type="module">
import {
  initializeApp

  onValue,
  push,

} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ================= FIREBASE CONFIG ================= */
/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ================= CEK LOGIN ================= */

const adminData = JSON.parse(localStorage.getItem("adminLogin"));

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}












/* ================= GLOBAL ================= */
let selectedUser = null;

/* ================= LOAD USERS (cs_inbox) ================= */
const userList = document.getElementById("userList");

onValue(ref(db, "cs_inbox"), (snap) => {

  let users = [];

  snap.forEach(child => {
    users.push({
      id: child.key,
      ...child.val()
    });
  });
  // 🔥 SORT: yang terbaru / belum chat di atas
  users.sort((a, b) => {
    return (b.lastTime || 0) - (a.lastTime || 0);
  });

  userList.innerHTML = "";

  users.forEach(d => {

    const div = document.createElement("div");
    div.className = "user-item";

    div.onclick = () =>
      openChat(d.id, d.nama || "Pengguna");

    div.innerHTML = `
      <img src="${d.profil || 'https://via.placeholder.com/40'}">
      <div>
        <div><b>${d.nama || "Pengguna"}</b></div>
        <div style="font-size:12px;color:#666;">
          ${d.lastMessage || ""}
        </div>
      </div>
    `;

    userList.appendChild(div);
  });

});

/* ================= OPEN CHAT ================= */
function openChat(userId, nama) {

  document.getElementById(
    "chatHeader"
  ).textContent = nama;

if(window.innerWidth < 900){
  document
    .getElementById("userList")
    .classList.add("hidden");
}


  selectedUser = userId;
const header =
  document.getElementById("chatHeader");
  const messagesBox = document.getElementById("messages");
  messagesBox.innerHTML = "";

  const chatRef = ref(db, `fithnerchats/customer_service/${userId}`);

onValue(chatRef, (snap) => {

  const messagesBox = document.getElementById("messages");
  messagesBox.innerHTML = "";

  const messages = [];

snap.forEach(child => {
  const m = child.val();

  // 🔥 ONLY VALID CHAT MESSAGE
  if (!m.time) return;

  messages.push(m);
});

  messages.sort((a,b)=> (a.time||0)-(b.time||0));

  messages.forEach(m => {

    const div = document.createElement("div");
    div.className = "msg " + (m.sender === "admin" ? "me" : "them");

    div.innerHTML = `
      ${m.foto ? `
        <img src="${m.foto}"
          style="
            width:180px;
            max-width:100%;
            border-radius:12px;
            display:block;
            margin-bottom:6px;
          ">
      ` : ""}

      ${m.text ? `<div>${m.text}</div>` : ""}
    `;

    messagesBox.appendChild(div);
  });

  messagesBox.scrollTop = messagesBox.scrollHeight;
});

}











/* ================= SEND REPLY ================= */
window.sendReply = async function() {

  const input = document.getElementById("msgInput");
  const text = input.value.trim();

  if (!text || !selectedUser) return;

  const msgRef = push(
    ref(db, `fithnerchats/customer_service/${selectedUser}`)
  );

  await set(msgRef, {
    text: text,
    sender: "admin",
    time: Date.now(),
    read: false
  });

  // UPDATE INBOX USER
  await update(
    ref(db, `cs_inbox/${selectedUser}`),
    {
      lastMessage: text,
      lastTime: Date.now(),
      unread: true
    }
  );

  input.value = "";
};






const CLOUD_NAME = "dowoq4a0i";
const UPLOAD_PRESET = "fotousershost";


window.pickImage = function(){

  const input = document.createElement("input");

  input.type = "file";
  input.accept = "image/*";

  input.onchange = async(e)=>{

    const file = e.target.files[0];

    if(!file) return;

    const formData = new FormData();

    formData.append("file",file);
    formData.append("upload_preset",UPLOAD_PRESET);


    const upload = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      {

    if(!data.secure_url){

      return;
    }


    const login = JSON.parse(
      localStorage.getItem("user")
    );


    const userId = login.userId;


    const snap = await get(

    );


    const userData = snap.exists()
      ? snap.val()
      : {};


await set(

  {
    text:"",

  }
);


await update(

    unread: true
  }
);




    console.log("gambar terkirim");
  };
  input.click();

}









function renderSuggestions(list){
  const box = document.getElementById("suggestBox");
  if (!box) return;

  box.style.display = "block";

  box.innerHTML = list.map(t => `
    <div class="suggest-item" data-text="${t.text}">
      <b>${t.code}</b> - ${t.text
        .replace(/\n/g, " ")
        .slice(0, 60)}
    </div>
  `).join("");

  // klik item
  box.querySelectorAll(".suggest-item").forEach(el => {
    el.onclick = function (e) {
      e.stopPropagation();
      applyTemplate(el.dataset.text);
    };
  });
}

function hideSuggestion(){
  const box = document.getElementById("suggestBox");
  if (box) box.style.display = "none";
}

window.applyTemplate = function(text){
  document.getElementById("msgInput").value = text;
  hideSuggestion();
};


/* ================= CLICK OUTSIDE ================= */
document.addEventListener("click", function (e) {
  const box = document.getElementById("suggestBox");
  const input = document.getElementById("msgInput");

  if (!box || !input) return;

  if (box.contains(e.target) || input.contains(e.target)) return;

  hideSuggestion();
});


/* ================= FIREBASE ================= */
let templates = [];

onValue(ref(db, "templates"), (snap) => {
  templates = [];

  snap.forEach(child => {
    templates.push({
      id: child.key,
      ...child.val()
    });
  });

  const input = document.getElementById("msgInput");

  input.oninput = () => {
  const val = input.value.trim().toLowerCase();

  // ======================
  // 1. "/" → semua list
  // ======================
  if (val === "/") {
    renderSuggestions(templates);
    return;
  }

  // ======================
  // 2. "1/" atau "2/" → match code EXACT
  // ======================
  if (val.endsWith("/")) {
    const filtered = templates.filter(t =>
      t.code.toLowerCase() === val
    );

    if (filtered.length > 0) {
      renderSuggestions(filtered);
    } else {
      hideSuggestion();
    }
    return;
  }

  // ======================
  // 3. selain itu hide
  // ======================
  hideSuggestion();
};
});

========================= */


/* =========================

========================= */
document.getElementById("adminBusyCheck_918273")
.addEventListener("change", async (e) => {

  const isBusy = e.target.checked;

  await set(adminBusyRef, {

    updatedAt: Date.now()

});


</script>
