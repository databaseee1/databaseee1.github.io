<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Foto Global</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link
  href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#f5f7fb;
  color:#1f2937;
  font-family:"Poppins",sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
}

.header{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:12px;
}

.header-icon{
  width:45px;
  height:45px;
  border-radius:12px;
  background:#4f46e5;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;
}

.header h1{
  margin:0;
  font-size:18px;
}

.header p{
  margin:3px 0 0;
  color:#6b7280;
  font-size:11px;
}

.box{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:16px;
  padding:18px;
  margin-bottom:18px;
}

.box-title{
  display:flex;
  align-items:center;
  gap:9px;

  margin-bottom:15px;
}

.box-title i{
  color:#4f46e5;
}

.box-title h3{
  margin:0;
  font-size:14px;
}

.upload-area{
  border:2px dashed #d1d5db;
  border-radius:13px;
  padding:22px;

  text-align:center;
  background:#fafafa;

  transition:.2s;
}

.upload-area:hover{
  border-color:#6366f1;
  background:#f8f8ff;
}

.upload-icon{
  width:50px;
  height:50px;
  margin:0 auto 10px;

  border-radius:50%;
  background:#eef2ff;
  color:#4f46e5;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
}

.upload-area h4{
  margin:0;
  font-size:13px;
}

.upload-area p{
  margin:5px 0 15px;
  color:#9ca3af;
  font-size:10px;
}

.file-input{
  width:100%;
  max-width:450px;

  border:1px solid #e5e7eb;
  border-radius:9px;

  padding:9px;

  background:#fff;
  font-size:11px;
}

.actions{
  margin-top:14px;

  display:flex;
  justify-content:center;
  gap:8px;
  flex-wrap:wrap;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.btn{
  min-height:40px;
  padding:0 15px;

  border-radius:9px;

  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;

  font-size:11px;
  font-weight:600;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-primary{
  background:#4f46e5;
  color:#fff;
}

.btn-primary:hover{
  background:#4338ca;
}

.btn-secondary{
  background:#f3f4f6;
  color:#374151;
}

.btn-secondary:hover{
  background:#e5e7eb;
}

.btn-danger{
  background:#fee2e2;
  color:#dc2626;
}

.btn-danger:hover{
  background:#fecaca;
}

.status-box{
  display:none;

  margin-top:15px;
  padding:12px;

  border-radius:10px;

  background:#f8fafc;
  border:1px solid #e5e7eb;

  font-size:11px;
  color:#4b5563;
}

.status-box.show{
  display:block;
}

.progress{
  height:6px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:9px;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#4f46e5;
  transition:.3s;
}

.list-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:15px;
}

.count{
  background:#eef2ff;
  color:#4f46e5;

  padding:5px 9px;
  border-radius:20px;

  font-size:10px;
  font-weight:600;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fill,minmax(180px,1fr));

  gap:13px;
}

.item{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:13px;
  overflow:hidden;

  transition:.2s;
}

.item:hover{
  box-shadow:0 7px 20px rgba(0,0,0,.06);
  transform:translateY(-2px);
}

.image-wrapper{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  background:#f3f4f6;
}

.image-wrapper img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
}

.item-body{
  padding:10px;
}

.item-id{
  font-size:9px;
  color:#9ca3af;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  margin-bottom:8px;
}

.url-text{
  font-size:9px;
  color:#6b7280;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  margin-bottom:9px;
}

.delete-btn{
  width:100%;
  height:34px;

  border-radius:8px;

  background:#fff1f2;
  color:#e11d48;

  font-size:10px;
  font-weight:600;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
}

.delete-btn:hover{
  background:#ffe4e6;
}

.empty{
  grid-column:1/-1;

  padding:45px 20px;

  text-align:center;

  border:1px dashed #d1d5db;
  border-radius:13px;

  background:#fafafa;
}

.empty i{
  font-size:30px;
  color:#9ca3af;
  margin-bottom:10px;
}

.empty h4{
  margin:0;
  font-size:13px;
}

.empty p{
  margin:5px 0 0;
  font-size:10px;
  color:#9ca3af;
}

.loading{
  position:fixed;
  inset:0;

  background:rgba(255,255,255,.75);

  display:none;
  align-items:center;
  justify-content:center;

  z-index:9999;
}

.loading.show{
  display:flex;
}

.loading-box{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:14px;

  padding:22px 28px;

  text-align:center;

  box-shadow:0 15px 40px rgba(0,0,0,.1);
}

.spinner{
  width:30px;
  height:30px;

  border:3px solid #e5e7eb;
  border-top-color:#4f46e5;

  border-radius:50%;

  animation:spin .7s linear infinite;

  margin:0 auto 10px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading-box p{
  margin:0;
  font-size:11px;
  color:#6b7280;
}

.toast-container{
  position:fixed;
  right:18px;
  bottom:18px;

  z-index:10000;

  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  min-width:260px;
  max-width:360px;

  padding:12px 14px;

  background:#111827;
  color:#fff;

  border-radius:10px;

  font-size:10px;

  box-shadow:0 10px 30px rgba(0,0,0,.15);

  animation:toastIn .25s ease;
}

.toast.success{
  border-left:4px solid #22c55e;
}

.toast.error{
  border-left:4px solid #ef4444;
}

.toast.info{
  border-left:4px solid #6366f1;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .header{
    padding:14px;
  }

  .header h1{
    font-size:15px;
  }

  .header p{
    font-size:9px;
  }

  .box{
    padding:13px;
  }

  .grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));

    gap:9px;
  }

  .item-body{
    padding:8px;
  }

  .delete-btn{
    height:32px;
  }

  .toast-container{
    left:10px;
    right:10px;
    bottom:10px;
  }

  .toast{
    min-width:0;
    max-width:none;
  }

}

@media(max-width:360px){

  .grid{
    grid-template-columns:1fr;
  }

}

</style>
</head>

<body>

<div class="container">


  <!-- HEADER -->

  <div class="header">

    <div class="header-left">

      <div class="header-icon">
        <i class="fa-solid fa-images"></i>
      </div>

      <div>

        <h1>
          Admin Foto Global
        </h1>

        <p>
          Kelola foto global melalui Cloudinary
        </p>

      </div>

    </div>

  </div>


  <!-- UPLOAD -->

  <div class="box">

    <div class="box-title">

      <i class="fa-solid fa-cloud-arrow-up"></i>

      <h3>
        Upload Foto Global
      </h3>

    </div>


    <div class="upload-area">

      <div class="upload-icon">

        <i class="fa-regular fa-image"></i>

      </div>


      <h4>
        Pilih foto yang ingin diupload
      </h4>


      <p>
        Bisa memilih beberapa foto sekaligus
      </p>


      <input
        type="file"
        id="fileInput"
        class="file-input"
        multiple
        accept="image/*"
      >


      <div class="actions">

        <button
          class="btn btn-primary"
          id="uploadButton"
          onclick="uploadFoto()"
        >

          <i class="fa-solid fa-cloud-arrow-up"></i>

          Upload Foto

        </button>

      </div>


      <div
        class="status-box"
        id="uploadStatus"
      >

        <div id="statusText">
          Menyiapkan upload...
        </div>


        <div class="progress">

          <div
            class="progress-bar"
            id="progressBar"
          ></div>

        </div>

      </div>

    </div>

  </div>


  <!-- LIST -->

  <div class="box">

    <div class="list-header">

      <div class="box-title" style="margin:0;">

        <i class="fa-solid fa-photo-film"></i>

        <h3>
          List Foto
        </h3>

      </div>


      <div
        class="count"
        id="photoCount"
      >
        0 Foto
      </div>

    </div>


    <div
      id="list"
      class="grid"
    ></div>

  </div>

</div>


<!-- LOADING -->

<div
  class="loading"
  id="loading"
>

  <div class="loading-box">

    <div class="spinner"></div>

    <p id="loadingText">
      Memuat data...
    </p>

  </div>

</div>


<!-- TOAST -->

<div
  class="toast-container"
  id="toastContainer"
></div>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
  getDatabase,
  ref,
  push,
  get,
  remove
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


/* =========================================================
   FIREBASE CONFIG
========================================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",

  authDomain:
    "users-96dc5.firebaseapp.com",

  databaseURL:
    "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "users-96dc5",

  storageBucket:
    "users-96dc5.firebasestorage.app",

  messagingSenderId:
    "483322415863",

  appId:
    "1:483322415863:web:1397a8f2e808e66ad9e1f2"

};


const app =
  initializeApp(firebaseConfig);


const db =
  getDatabase(app);


/* =========================================================
   CEK LOGIN ADMIN
========================================================= */

const adminData =
  JSON.parse(
    localStorage.getItem("adminLogin")
  );


if (
  !adminData ||
  adminData.role !== "admin"
) {

  window.location.replace(
    "Login_admin.html"
  );

}


/* =========================================================
   CLOUDINARY BARU
========================================================= */

const CLOUD_NAME =
  "yiqzinpc";


const UPLOAD_PRESET =
  "akunstore";


/*
 * Endpoint Cloudinary:
 *
 * https://api.cloudinary.com/v1_1/yiqzinpc/image/upload
 */


/* =========================================================
   ELEMENT
========================================================= */

const fileInput =
  document.getElementById("fileInput");


const uploadButton =
  document.getElementById("uploadButton");


const uploadStatus =
  document.getElementById("uploadStatus");


const statusText =
  document.getElementById("statusText");


const progressBar =
  document.getElementById("progressBar");


const list =
  document.getElementById("list");


const photoCount =
  document.getElementById("photoCount");


const loading =
  document.getElementById("loading");


const loadingText =
  document.getElementById("loadingText");


/* =========================================================
   LOADING
========================================================= */

function showLoading(
  text = "Memuat data..."
){

  loadingText.textContent =
    text;

  loading.classList.add("show");

}


function hideLoading(){

  loading.classList.remove(
    "show"
  );

}


/* =========================================================
   TOAST
========================================================= */

function showToast(
  message,
  type = "info"
){

  const toast =
    document.createElement("div");


  toast.className =
    `toast ${type}`;


  toast.textContent =
    message;


  document
    .getElementById("toastContainer")
    .appendChild(toast);


  setTimeout(() => {

    toast.style.opacity =
      "0";

    toast.style.transform =
      "translateY(8px)";


    setTimeout(() => {

      toast.remove();

    },250);

  },3000);

}


/* =========================================================
   KOMPRES GAMBAR
========================================================= */

async function compressImage(file){

  return new Promise(
    (resolve,reject) => {

      const reader =
        new FileReader();


      reader.onload =
        function(event){

          const img =
            new Image();


          img.onload =
            function(){

              const MAX_SIZE =
                1600;


              let width =
                img.width;

              let height =
                img.height;


              /*
               * Kecilkan gambar jika
               * terlalu besar.
               */

              if(
                width > MAX_SIZE ||
                height > MAX_SIZE
              ){

                if(width > height){

                  height =
                    Math.round(
                      height *
                      MAX_SIZE /
                      width
                    );

                  width =
                    MAX_SIZE;

                }else{

                  width =
                    Math.round(
                      width *
                      MAX_SIZE /
                      height
                    );

                  height =
                    MAX_SIZE;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if(!blob){

                    reject(
                      new Error(
                        "Gagal melakukan kompresi gambar."
                      )
                    );

                    return;

                  }


                  const compressedFile =
                    new File(
                      [blob],
                      file.name.replace(
                        /\.[^/.]+$/,
                        ""
                      ) + ".jpg",
                      {
                        type:
                          "image/jpeg"
                      }
                    );


                  resolve(
                    compressedFile
                  );

                },
                "image/jpeg",
                0.82
              );

            };


          img.onerror =
            function(){

              reject(
                new Error(
                  "File gambar tidak dapat dibaca."
                )
              );

            };


          img.src =
            event.target.result;

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Gagal membaca file."
            )
          );

        };


      reader.readAsDataURL(
        file
      );

    }
  );

}


/* =========================================================
   UPLOAD SATU FILE
========================================================= */

async function uploadSingle(
  file
){

  /*
   * Kompres terlebih dahulu
   */

  const compressedFile =
    await compressImage(
      file
    );


  const formData =
    new FormData();


  formData.append(
    "file",
    compressedFile
  );


  formData.append(
    "upload_preset",
    UPLOAD_PRESET
  );


  /*
   * Upload ke Cloudinary baru
   */

  const response =
    await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      {
        method:"POST",
        body:formData
      }
    );


  const data =
    await response.json();


  if(
    !response.ok ||
    !data.secure_url
  ){

    console.error(
      "Cloudinary Error:",
      data
    );


    throw new Error(
      data?.error?.message ||
      "Upload Cloudinary gagal."
    );

  }


  /*
   * URL Cloudinary dibuat optimized.
   *
   * Contoh:
   *
   * /upload/f_auto,q_auto:eco,w_1080,c_limit/
   */

  const optimizedUrl =
    data.secure_url.replace(
      "/upload/",
      "/upload/f_auto,q_auto:eco,w_1080,c_limit/"
    );


  return {

    url:
      optimizedUrl,

    public_id:
      data.public_id || "",

    delete_token:
      data.delete_token || ""

  };

}


/* =========================================================
   UPLOAD FOTO
========================================================= */

window.uploadFoto =
  async function(){

    const input =
      document.getElementById(
        "fileInput"
      );


    if(
      !input.files ||
      input.files.length === 0
    ){

      alert(
        "Pilih file foto terlebih dahulu."
      );

      return;

    }


    const files =
      Array.from(
        input.files
      );


    /*
     * KONFIRMASI
     */

    const confirmUpload =
      confirm(
        `Upload ${files.length} foto ke Cloudinary?\n\nFoto akan dikompres terlebih dahulu sebelum dikirim.`
      );


    if(!confirmUpload){

      return;

    }


    uploadButton.disabled =
      true;


    uploadButton.style.opacity =
      "0.6";


    uploadStatus.classList.add(
      "show"
    );


    progressBar.style.width =
      "0%";


    let successCount =
      0;


    let failedCount =
      0;


    try{

      for(
        let i = 0;
        i < files.length;
        i++
      ){

        const file =
          files[i];


        statusText.textContent =
          `Mengupload ${i + 1} dari ${files.length}: ${file.name}`;


        progressBar.style.width =
          `${Math.round(
            (i / files.length) * 100
          )}%`;


        try{

          /*
           * Upload Cloudinary
           */

          const result =
            await uploadSingle(
              file
            );


          /*
           * Simpan ke Firebase
           */

          await push(
            ref(
              db,
              "fotoglobal"
            ),
            {

              url:
                result.url,

              public_id:
                result.public_id,

              delete_token:
                result.delete_token,

              dibuatPada:
                Date.now()

            }
          );


          successCount++;


        }catch(error){

          failedCount++;


          console.error(
            `Gagal upload ${file.name}:`,
            error
          );

        }


        progressBar.style.width =
          `${Math.round(
            ((i + 1) / files.length) * 100
          )}%`;

      }


      statusText.textContent =
        `Selesai. Berhasil: ${successCount}, gagal: ${failedCount}`;


      if(
        failedCount === 0
      ){

        showToast(
          `${successCount} foto berhasil diupload.`,
          "success"
        );

      }else{

        showToast(
          `Upload selesai. ${successCount} berhasil, ${failedCount} gagal.`,
          "info"
        );

      }


      /*
       * Reload list
       */

      await loadList();


      /*
       * Reset input
       */

      input.value = "";


    }catch(error){

      console.error(
        error
      );


      showToast(
        "Terjadi kesalahan saat upload.",
        "error"
      );

    }finally{

      uploadButton.disabled =
        false;


      uploadButton.style.opacity =
        "1";

    }

  };


/* =========================================================
   LOAD LIST
========================================================= */

async function loadList(){

  try{

    showLoading(
      "Memuat daftar foto..."
    );


    const snap =
      await get(
        ref(
          db,
          "fotoglobal"
        )
      );


    list.innerHTML =
      "";


    if(
      !snap.exists()
    ){

      photoCount.textContent =
        "0 Foto";


      list.innerHTML = `

        <div class="empty">

          <i class="fa-regular fa-images"></i>

          <h4>
            Belum ada foto
          </h4>

          <p>
            Foto yang diupload akan muncul di sini.
          </p>

        </div>

      `;


      hideLoading();

      return;

    }


    const data =
      snap.val();


    const entries =
      Object.entries(
        data
      );


    /*
     * Foto terbaru di atas.
     */

    entries.reverse();


    photoCount.textContent =
      `${entries.length} Foto`;


    entries.forEach(
      ([key,val]) => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "item";


        const safeUrl =
          String(
            val?.url || ""
          );


        item.innerHTML = `

          <div class="image-wrapper">

            <img
              src="${escapeHtml(safeUrl)}"
              alt="Foto Global"
              loading="lazy"
              onerror="this.style.opacity='0.2';"
            >

          </div>


          <div class="item-body">

            <div
              class="item-id"
              title="${escapeHtml(key)}"
            >
              ID: ${escapeHtml(key)}
            </div>


            <div
              class="url-text"
              title="${escapeHtml(safeUrl)}"
            >
              ${escapeHtml(safeUrl)}
            </div>


            <button
              class="delete-btn"
              data-delete-key="${escapeHtml(key)}"
            >

              <i class="fa-solid fa-trash"></i>

              Hapus Foto

            </button>

          </div>

        `;


        list.appendChild(
          item
        );

      }
    );


    hideLoading();


  }catch(error){

    console.error(
      "Gagal load list:",
      error
    );


    hideLoading();


    showToast(
      "Gagal memuat daftar foto: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   HAPUS FOTO
========================================================= */

async function hapus(
  key
){

  /*
   * Ambil data foto terlebih dahulu
   */

  try{

    const snap =
      await get(
        ref(
          db,
          "fotoglobal/" + key
        )
      );


    if(
      !snap.exists()
    ){

      showToast(
        "Data foto sudah tidak ditemukan.",
        "error"
      );

      await loadList();

      return;

    }


    const photo =
      snap.val();


    /*
     * KONFIRMASI
     */

    const confirmDelete =
      confirm(
        "Yakin ingin menghapus foto ini?\n\nFoto akan dihapus dari daftar Firebase."
      );


    if(!confirmDelete){

      return;

    }


    showLoading(
      "Menghapus foto..."
    );


    /*
     * HAPUS DATA FIREBASE
     */

    await remove(
      ref(
        db,
        "fotoglobal/" + key
      )
    );


    /*
     * Cloudinary:
     *
     * Untuk upload unsigned, Cloudinary
     * dapat memberikan delete_token.
     *
     * Token ini hanya valid dalam waktu
     * terbatas.
     */

    if(
      photo?.delete_token
    ){

      try{

        await fetch(
          `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/delete_by_token`,
          {
            method:"POST",
            headers:{
              "Content-Type":
                "application/x-www-form-urlencoded"
            },
            body:
              new URLSearchParams({
                token:
                  photo.delete_token
              })
          }
        );

      }catch(
        cloudinaryError
      ){

        console.warn(
          "Firebase sudah dihapus, tetapi Cloudinary tidak dapat dihapus menggunakan delete token:",
          cloudinaryError
        );

      }

    }


    hideLoading();


    showToast(
      "Foto berhasil dihapus dari Firebase.",
      "success"
    );


    await loadList();


  }catch(error){

    hideLoading();


    console.error(
      "Gagal hapus:",
      error
    );


    showToast(
      "Gagal menghapus foto: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   BUTTON HAPUS
========================================================= */

list.addEventListener(
  "click",
  event => {

    const button =
      event.target.closest(
        "[data-delete-key]"
      );


    if(!button){
      return;
    }


    const key =
      button.dataset.deleteKey;


    hapus(key);

  }
);


/* =========================================================
   LOAD AWAL
========================================================= */

loadList();

</script>
