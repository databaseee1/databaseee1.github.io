<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Admin Testimoni</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f5f6fa;
}

.header{
  background:#fff;
  padding:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:100;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.search-box{
  margin-top:15px;
}

.search-box input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.add-btn{
  margin-top:15px;
  width:100%;
  border:none;
  background:#e91e63;
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

#listTesti{
  padding:15px;
}

.card{
  background:#fff;
  border-radius:18px;
  padding:15px;
  margin-bottom:15px;
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}

.card-top{
  display:flex;
  gap:12px;
}

.card-top img{
  width:55px;
  height:55px;
  border-radius:50%;
  object-fit:cover;
}

.nama{
  font-weight:bold;
  font-size:15px;
}

.rating{
  margin-top:5px;
  color:#ff9800;
}

.comment{
  margin-top:10px;
  color:#444;
  line-height:1.5;
}

.tanggal{
  margin-top:10px;
  color:#999;
  font-size:13px;
}

.balasan{
  margin-top:15px;
  background:#f7f7f7;
  border-radius:14px;
  padding:12px;
  display:flex;
  gap:10px;
}

.balasan img{
  width:35px;
  height:35px;
  border-radius:50%;
  object-fit:cover;
}

.balasan-nama{
  font-weight:bold;
  font-size:14px;
}

.balasan-text{
  margin-top:5px;
  color:#555;
  line-height:1.5;
}

.actions{
  margin-top:15px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button{
  border:none;
  padding:10px 15px;
  border-radius:10px;
  cursor:pointer;
}

.btn-edit{
  background:#2196f3;
  color:#fff;
}

.btn-hapus{
  background:#f44336;
  color:#fff;
}

.btn-balas{
  background:#4caf50;
  color:#fff;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.4);
  z-index:999;
  overflow:auto;
}

.modal-content{
  background:#fff;
  width:95%;
  max-width:550px;
  margin:40px auto;
  border-radius:18px;
  padding:20px;
}

.modal-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  margin-bottom:6px;
  font-weight:bold;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:12px;
  outline:none;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.preview{
  width:80px;
  height:80px;
  border-radius:12px;
  object-fit:cover;
  display:none;
  margin-top:10px;
}

.modal-buttons{
  display:flex;
  gap:10px;
  margin-top:20px;
}

.modal-buttons button{
  flex:1;
  padding:13px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.btn-save{
  background:#4caf50;
  color:#fff;
}

.btn-close{
  background:#ddd;
}
</style>
</head>
<body>

<div class="header">

  <div class="title">
    Admin Testimoni
  </div>

  <div class="search-box">
    <input
      id="searchInput"
      type="text"
      placeholder="Cari nama testimoni..."
    >
  </div>

  <button
    class="add-btn"
    onclick="openTambah()"
  >
    <i class="fas fa-plus"></i>
    Tambah Testimoni
  </button>

</div>

<div id="listTesti"></div>

<!-- MODAL TAMBAH / EDIT -->

<div class="modal" id="modalTesti">

  <div class="modal-content">

    <div class="modal-title">
      Form Testimoni
    </div>

    <input type="hidden" id="editId">

    <div class="form-group">
      <label>Nama</label>
      <input id="fNama">
    </div>

    <div class="form-group">
      <label>URL Foto Profil</label>
      <input id="fProfil">
      <img id="prevProfil" class="preview">
    </div>

    <div class="form-group">
      <label>Rating</label>

      <select id="fRating">
        <option value="5">5 Bintang</option>
        <option value="4">4 Bintang</option>
        <option value="3">3 Bintang</option>
        <option value="2">2 Bintang</option>
        <option value="1">1 Bintang</option>
      </select>
    </div>

    <div class="form-group">
      <label>Komentar</label>
      <textarea id="fCommentar"></textarea>
    </div>

    <div class="form-group">
      <label>Pengguna Aplikasi</label>
      <input id="fPengguna" value="Tigo">
    </div>

    <div class="form-group">
      <label>URL Logo Aplikasi</label>
      <input id="fLogo">
      <img id="prevLogo" class="preview">
    </div>

    <div class="form-group">
      <label>Tanggal Komentar</label>
      <input id="fTanggal">
    </div>

    <div class="modal-buttons">
      <button
        class="btn-save"
        onclick="simpanTesti()"
      >
        Simpan
      </button>

      <button
        class="btn-close"
        onclick="tutupModal()"
      >
        Tutup
      </button>
    </div>

  </div>

</div>

<!-- MODAL BALASAN -->

<div class="modal" id="modalBalasan">

  <div class="modal-content">

    <div class="modal-title">
      Balasan Developer
    </div>

    <input type="hidden" id="balasId">

    <div class="form-group">
      <label>Nama Balasan</label>
      <input
        id="bNama"
        value="Tigo Developer"
      >
    </div>

    <div class="form-group">
      <label>URL Foto Balasan</label>
      <input id="bFoto">
      <img id="prevBalasan" class="preview">
    </div>

    <div class="form-group">
      <label>Isi Balasan</label>
      <textarea id="bText"></textarea>
    </div>

    <div class="modal-buttons">
      <button
        class="btn-save"
        onclick="simpanBalasan()"
      >
        Simpan Balasan
      </button>

      <button
        class="btn-close"
        onclick="tutupBalasan()"
      >
        Tutup
      </button>
    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  get,
  update,
  remove,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL:
    "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ========================= */

const listTesti =
  document.getElementById("listTesti");

let semuaData = [];

/* ========================= */

function getStars(rating = 5) {
  let html = "";

  for (let i = 1; i <= 5; i++) {
    html +=
      i <= rating
        ? `<i class="fas fa-star"></i>`
        : `<i class="far fa-star"></i>`;
  }

  return html;
}

/* ========================= */

function render(data) {
  listTesti.innerHTML = "";

  if (!data.length) {
    listTesti.innerHTML =
      "<center>Tidak ada data.</center>";
    return;
  }

  data.forEach((t) => {
    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML = `
      <div class="card-top">

        <img
          src="${t.profil || ''}"
          onerror="this.src='https://i.pravatar.cc/150'"
        >

        <div>

          <div class="nama">
            ${t.nama || ""}
          </div>

          <div class="rating">
            ${getStars(
              Number(t.rating || 5)
            )}
          </div>

          <div class="tanggal">
            ${t.tanggalCommentar || ""}
          </div>

        </div>

      </div>

      <div class="comment">
        ${t.commentar || ""}
      </div>

      ${
        t.balasanCommentar
          ? `
        <div class="balasan">

          <img
            src="${
              t.balasanFoto || ""
            }"
            onerror="this.src='${t.gambarAplikasi || ""}'"
          >

          <div>

            <div class="balasan-nama">
              ${
                t.balasanNama ||
                "Tigo Developer"
              }
            </div>

            <div class="balasan-text">
              ${
                t.balasanCommentar
              }
            </div>

          </div>

        </div>
      `
          : ""
      }

      <div class="actions">

        <button
          class="btn-edit"
          onclick="editTesti('${t.id}')"
        >
          Edit
        </button>

        <button
          class="btn-hapus"
          onclick="hapusTesti('${t.id}')"
        >
          Hapus
        </button>

        <button
          class="btn-balas"
          onclick="openBalasan('${t.id}')"
        >
          Balasan
        </button>

      </div>
    `;

    listTesti.appendChild(card);
  });
}

/* ========================= */
/* LOAD DATA */
/* ========================= */

onValue(
  ref(db, "testimoni"),
  (snap) => {
    semuaData = [];

    snap.forEach((c) => {
      semuaData.push({
        id: c.key,
        ...c.val(),
      });
    });

    semuaData.reverse();

    render(semuaData);
  }
);

/* ========================= */
/* SEARCH */
/* ========================= */

window.searchInput
  .addEventListener(
    "input",
    function () {
      const q =
        this.value.toLowerCase();

      const hasil =
        semuaData.filter((x) =>
          (x.nama || "")
            .toLowerCase()
            .includes(q)
        );

      render(hasil);
    }
  );

/* ========================= */
/* MODAL */
/* ========================= */

window.openTambah = function () {
  document.getElementById(
    "editId"
  ).value = "";

  document.getElementById(
    "fNama"
  ).value = "";

  document.getElementById(
    "fProfil"
  ).value = "";

  document.getElementById(
    "fRating"
  ).value = 5;

  document.getElementById(
    "fCommentar"
  ).value = "";

  document.getElementById(
    "fPengguna"
  ).value = "Tigo";

  document.getElementById(
    "fLogo"
  ).value = "";

  document.getElementById(
    "fTanggal"
  ).value =
    new Date().toLocaleDateString(
      "id-ID"
    );

  document.getElementById(
    "modalTesti"
  ).style.display = "block";
};

window.tutupModal =
  function () {
    document.getElementById(
      "modalTesti"
    ).style.display = "none";
  };

/* ========================= */
/* SIMPAN */
/* ========================= */

window.simpanTesti =
  async function () {
    const id =
      document.getElementById(
        "editId"
      ).value;

    const data = {
      nama:
        document.getElementById(
          "fNama"
        ).value,

      profil:
        document.getElementById(
          "fProfil"
        ).value,

      rating: Number(
        document.getElementById(
          "fRating"
        ).value
      ),

      commentar:
        document.getElementById(
          "fCommentar"
        ).value,

      penggunaAplikasi:
        document.getElementById(
          "fPengguna"
        ).value,

      gambarAplikasi:
        document.getElementById(
          "fLogo"
        ).value,

      tanggalCommentar:
        document.getElementById(
          "fTanggal"
        ).value,

      timestamp:
        Date.now(),
    };

    if (id) {
      await update(
        ref(
          db,
          "testimoni/" + id
        ),
        data
      );
    } else {
      const newRef = push(
        ref(db, "testimoni")
      );

      await set(
        newRef,
        data
      );
    }

    tutupModal();
  };

/* ========================= */
/* EDIT */
/* ========================= */

window.editTesti =
  function (id) {
    const t =
      semuaData.find(
        (x) => x.id === id
      );

    if (!t) return;

    document.getElementById(
      "editId"
    ).value = id;

    document.getElementById(
      "fNama"
    ).value = t.nama || "";

    document.getElementById(
      "fProfil"
    ).value = t.profil || "";

    document.getElementById(
      "fRating"
    ).value =
      t.rating || 5;

    document.getElementById(
      "fCommentar"
    ).value =
      t.commentar || "";

    document.getElementById(
      "fPengguna"
    ).value =
      t.penggunaAplikasi ||
      "Tigo";

    document.getElementById(
      "fLogo"
    ).value =
      t.gambarAplikasi ||
      "";

    document.getElementById(
      "fTanggal"
    ).value =
      t.tanggalCommentar ||
      "";

    document.getElementById(
      "modalTesti"
    ).style.display =
      "block";
  };

/* ========================= */
/* HAPUS */
/* ========================= */

window.hapusTesti =
  async function (id) {
    if (
      !confirm(
        "Hapus testimoni?"
      )
    )
      return;

    await remove(
      ref(
        db,
        "testimoni/" + id
      )
    );
  };

/* ========================= */
/* PREVIEW GAMBAR */
/* ========================= */

function preview(
  inputId,
  imgId
) {
  const input =
    document.getElementById(
      inputId
    );

  const img =
    document.getElementById(
      imgId
    );

  input.addEventListener(
    "input",
    () => {
      if (!input.value) {
        img.style.display =
          "none";
        return;
      }

      img.src =
        input.value;

      img.style.display =
        "block";
    }
  );
}

preview(
  "fProfil",
  "prevProfil"
);

preview(
  "fLogo",
  "prevLogo"
);

preview(
  "bFoto",
  "prevBalasan"
);










/* ========================= */
/* MODAL BALASAN */
/* ========================= */

window.openBalasan = function (id) {
  const t = semuaData.find(x => x.id === id);

  if (!t) return;

  document.getElementById("balasId").value = id;

  document.getElementById("bNama").value =
    t.balasanNama || "Tigo Developer";

  document.getElementById("bFoto").value =
    t.balasanFoto ||
    t.gambarAplikasi ||
    "";

  document.getElementById("bText").value =
    t.balasanCommentar || "";

  const img =
    document.getElementById("prevBalasan");

  if (
    document.getElementById("bFoto").value
  ) {
    img.src =
      document.getElementById("bFoto").value;

    img.style.display = "block";
  } else {
    img.style.display = "none";
  }

  document.getElementById(
    "modalBalasan"
  ).style.display = "block";
};

window.tutupBalasan =
  function () {
    document.getElementById(
      "modalBalasan"
    ).style.display = "none";
  };

/* ========================= */
/* SIMPAN BALASAN */
/* ========================= */

window.simpanBalasan =
  async function () {
    const id =
      document.getElementById(
        "balasId"
      ).value;

    if (!id) return;

    await update(
      ref(
        db,
        "testimoni/" + id
      ),
      {
        balasanNama:
          document.getElementById(
            "bNama"
          ).value,

        balasanFoto:
          document.getElementById(
            "bFoto"
          ).value,

        balasanCommentar:
          document.getElementById(
            "bText"
          ).value
      }
    );

    tutupBalasan();

    alert(
      "Balasan berhasil disimpan."
    );
  };










</script>

</body>
</html>
