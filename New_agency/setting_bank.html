<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setting Bank</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
  font-family:Poppins;
  background:#f5f5f5;
  margin:0;
  padding:15px;
  padding-top:65px;
}

/* HEADER */
.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:55px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:999;
}

.back{width:40px;cursor:pointer;font-size:18px;}
.title{font-weight:600;font-size:16px;}

/* CARD */
.card{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.card img{
  width:45px;
  height:45px;
  object-fit:cover;
  border-radius:10px;
}

.name{
  font-weight:600;
  font-size:14px;
}

.small{
  font-size:12px;
  color:#666;
}

/* BTN */
.btn{
  padding:5px 8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.edit{background:#3498db;color:#fff;}
.del{background:#e74c3c;color:#fff;}

/* FLOAT BTN */
.fab{
  position:fixed;
  bottom:20px;
  right:20px;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#3498db;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.box{
  background:#fff;
  padding:15px;
  border-radius:12px;
  width:90%;
  max-width:320px;
}

.box input{
  width:94%;
  padding:10px;
  margin:5px 0;
  border:1px solid #ddd;
  border-radius:8px;
}

/* TOGGLE */
.switch {
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:5px;
}

/* NOTIF */
.notif{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  display:none;
  font-size:13px;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back" onclick="history.back()">
    <i class="fa fa-chevron-left"></i>
  </div>
  <div class="title">Setting Bank</div>
</div>

<!-- LIST -->
<div id="list"></div>

<!-- FLOAT BTN -->
<div class="fab" onclick="openModal()">
  <i class="fa fa-university"></i>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="box">

    <input id="namaBank" placeholder="Nama Bank">
    <input id="namaRek" placeholder="Nama Rekening">
    <input id="noRek" placeholder="No Rekening">
    <input type="file" id="file">

    <div class="switch">
      <label>Maintenance</label>
      <input type="checkbox" id="maintenance">
    </div>

    <button class="btn edit" onclick="saveBank()">Simpan</button>
    <button class="btn del" onclick="closeModal()">Batal</button>

  </div>
</div>

<!-- NOTIF -->
<div class="notif" id="notif"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getDatabase,
ref,
push,
set,
update,
remove,
onValue,
get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
authDomain:"users-96dc5.firebaseapp.com",
databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* LOGIN */
const adminData = JSON.parse(localStorage.getItem("adminLogin")||"{}");
if(!adminData || adminData.role!=="admin"){
window.location.href="Login_admin.html";
}

/* CLOUDINARY */
const CLOUD_NAME="dowoq4a0i";
const UPLOAD_PRESET="fotousershost";

let editId=null;

/* LOAD */
onValue(ref(db,"BANK_EWALLET"),(snap)=>{
const list=document.getElementById("list");
list.innerHTML="";

snap.forEach(child=>{
const d=child.val();

list.innerHTML+=`
<div class="card">
  <div class="left">
    <img src="${d.logo}">
    <div>
      <div class="name">${d.namaBank}</div>
      <div class="small">${d.namaRekening}</div>
    </div>
  </div>

  <div>
    <button class="btn edit" onclick="editBank('${child.key}')">Edit</button>
    <button class="btn del" onclick="delBank('${child.key}')">Hapus</button>
  </div>
</div>`;
});
});

/* MODAL */
window.openModal=()=>document.getElementById("modal").style.display="flex";
window.closeModal=()=>document.getElementById("modal").style.display="none";

/* SAVE */
window.saveBank=async()=>{

const file=document.getElementById("file").files[0];
let logo="";

if(file){
const form=new FormData();
form.append("file",file);
form.append("upload_preset",UPLOAD_PRESET);

const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{
method:"POST",
body:form
});

const data=await res.json();
logo=data.secure_url;
}

const data={
namaBank:document.getElementById("namaBank").value,
namaRekening:document.getElementById("namaRek").value,
noRekening:document.getElementById("noRek").value,
logo:logo,
maintenance:document.getElementById("maintenance").checked
};

if(editId){
await update(ref(db,"BANK_EWALLET/"+editId),data);
showNotif("Bank berhasil diupdate");
}else{
await push(ref(db,"BANK_EWALLET"),data);
showNotif("Bank berhasil ditambah");
}

closeModal();
editId=null;
}

/* EDIT */
window.editBank=async(id)=>{
const snap=await get(ref(db,"BANK_EWALLET/"+id));
const d=snap.val();

document.getElementById("namaBank").value=d.namaBank;
document.getElementById("namaRek").value=d.namaRekening;
document.getElementById("noRek").value=d.noRekening;
document.getElementById("maintenance").checked=d.maintenance;

editId=id;
openModal();
}

/* DELETE */
window.delBank=async(id)=>{
if(confirm("Hapus bank ini?")){
await remove(ref(db,"BANK_EWALLET/"+id));
showNotif("Berhasil dihapus");
}
}

/* NOTIF */
window.showNotif=(msg)=>{
const n=document.getElementById("notif");
n.innerText=msg;
n.style.display="block";
setTimeout(()=>n.style.display="none",2000);
}

</script>

</body>
</html>
