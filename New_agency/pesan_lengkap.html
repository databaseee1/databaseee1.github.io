const CLOUD_NAME = "dowoq4a0i";
const UPLOAD_PRESET = "fotousershost";

window.pickUserImage = function () {

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";

  input.onchange = async (e) => {

    try {

      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", UPLOAD_PRESET);

      const upload = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
        {
          method: "POST",
          body: formData
        }
      );

      const data = await upload.json();

      if (!data.secure_url) {
        alert("Upload gagal");
        return;
      }

      /* LOGIN */
      const loginRaw = localStorage.getItem("user");
      if (!loginRaw) {
        alert("User belum login");
        return;
      }

      const login = JSON.parse(loginRaw);

      /* HARUS SAMA DENGAN ID YANG DIPAKAI CHAT TEXT */
      const chatUserId =
        (login.email || "")
          .toLowerCase()
          .replace(/\./g, "_dot_")
          .replace(/@/g, "_at_");

      await set(
        push(
          ref(
            db,
            `fithnerchats/customer_service/${chatUserId}`
          )
        ),
        {
          text: "",
          foto: data.secure_url,
          sender: chatUserId,
          email: login.email || "",
          time: Date.now(),
          read: false
        }
      );

      console.log("USER IMAGE SENT");
      console.log("CHAT USER ID =", chatUserId);

    } catch (err) {

      console.error("UPLOAD FOTO GAGAL =", err);
      alert("Gagal mengirim foto");

    }

  };

  input.click();
};
