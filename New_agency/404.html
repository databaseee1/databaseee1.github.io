<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Halaman Tidak Dapat Dijangkau</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#fff;
    color:#000;
    font-family:Arial, Helvetica, sans-serif;
    text-align:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:500px;
}

.logo{
    width:45px;
    height:45px;
    object-fit:contain;
    margin-bottom:18px;
    opacity:0.9;
}

.error{
    font-size:clamp(80px,18vw,150px);
    font-weight:900;
    line-height:1;
    letter-spacing:4px;
}

.title{
    margin-top:18px;
    font-size:clamp(22px,5vw,32px);
    font-weight:700;
}

.desc{
    margin-top:12px;
    font-size:clamp(15px,3.8vw,18px);
    color:#555;
    line-height:1.6;
}

.line{
    width:80px;
    height:3px;
    background:#000;
    margin:28px auto 0;
    border-radius:20px;
}

@media (max-width:480px){
    .logo{
        width:38px;
        height:38px;
    }

    .desc{
        padding:0 10px;
    }
}
</style>
</head>
<body>

<div class="container">

    <img src="icon-72x72.png" class="logo" alt="Logo">

    <div class="error">404</div>

    <div class="title">
        Halaman tidak dapat dijangkau
    </div>

    <div class="desc">
        Anda tidak dapat akses kesini
    </div>

    <div class="line"></div>

</div>

</body>
</html>
