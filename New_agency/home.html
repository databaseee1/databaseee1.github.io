/* HEADER */

.toast{
  position:fixed;
  bottom:80px; 
  left:50%;
  transform:translateX(-50%) translateY(20px);
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  color:#000;
  padding:10px 14px;
  border-radius:12px;
  z-index:99999;

  opacity:0;
  pointer-events:none;
}

/* animasi aktif */
.toast.show{
  animation:toastIn 0.25s ease forwards, toastOut 0.25s ease forwards 1.8s;
}

@keyframes toastIn{
  from{
    opacity:0;
    transform:translateX(-50%) translateY(20px);
  }
  to{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
}

@keyframes toastOut{
  from{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
  to{
    opacity:0;
    transform:translateX(-50%) translateY(20px);
  }
}

.toast-icon{
  width:18px;
  height:18px;
}

#loadingScreen{
  position:fixed;
  top:0;
  left:0;

  height:100%;

.spinner{
  width:24px;

  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

function setActiveNav(el) {

  document.querySelectorAll('#bottomNav .nav-item')
    .forEach(item => {

      item.classList.remove('active');

      const img =
        item.querySelector('.nav-icon');

      if (img) {
        img.src = img.dataset.default;
      }
    });

  if (!el) return;

  el.classList.add('active');

  const activeImg =
    el.querySelector('.nav-icon');

  if (activeImg) {
    activeImg.src =
      activeImg.dataset.active;
  }
}

window.goNav = function(el, url) {

  setActiveNav(el);

    window.location.href = url;
  }, 30);
};

function restoreActiveNav() {

  const page =
    window.location.pathname
      .split("/")
      .pop()
      .toLowerCase();

    .querySelectorAll(
      "#bottomNav .nav-item"
    )
    .forEach(item => {

      const click =
        (item.getAttribute("onclick") || "")
          .toLowerCase();

      if (click.includes(page)) {

    });

window.showToast = (text, icon = "logo.png") => {

  const toast = document.getElementById("toast");
  const toastText = document.getElementById("toastText");
  const toastIcon = document.querySelector(".toast-icon");

  if(!toast || !toastText || !toastIcon) return;

  toastText.textContent = text;
  toastIcon.src = icon;

  // restart animasi
  toast.classList.remove("show");
  void toast.offsetWidth; // force reflow
  toast.classList.add("show");
};

document.addEventListener("keydown", function (e) {
  if (

    (e.ctrlKey && e.key === "0") ||

  ) {
    e.preventDefault();
  }
});

window.showchat238 = function(
  status2 = "",
  busy = false
){

  const box =
    document.querySelector(
      "#showchat238 .showchat238-box"
    );

  const isHost =
    status2 === "Host";

  if(busy){

    box.textContent =
      isHost
        ? "Host sedang dalam panggilan lain."
        : "Pengguna sedang dalam panggilan lain.";

  }else{

    box.textContent =
      isHost
        ? "Host sedang sibuk."
        : "Pengguna sedang offline.";

  }

  const pop =
    document.getElementById(
      "showchat238"
    );

  pop.classList.add("show");

  setTimeout(()=>{
    pop.classList.remove("show");
  },2000);

};
