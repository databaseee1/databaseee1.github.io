/* MAIN CARD */

/* FORM LOGIN (JANGAN DIUBAH JS NYA) */
.card {

/* SOCIAL BUTTONS */

.fb { background: #1877f2; }
.google { background: #ea4335; }

/* TOAST */
#toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #22c55e;
  color: white;
  padding: 10px 18px;
  border-radius: 10px;
  font-size: 13px;
  opacity: 0;
  transition: 0.3s;
  z-index: 10;
}


.spinner {
  width: 30px;
  height: 30px;
  border: 4px solid #ccc;
  border-top: 4px solid #3b82f6;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 10px auto;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}





.footer-agree {

  font-size: 12px;
  color: #ddd;
}

.agree-box {

}

/* hapus margin yang bikin turun */
.checkmark {
  width: 16px;
  height: 16px;
  border: 2px solid #888;
  border-radius: 4px;
  position: relative;
  flex-shrink: 0;

/* text rapikan */
.footer-agree .text {
  color: #ccc;
  margin: 0;
  padding: 0;
}

/* hide checkbox default */
.agree-box input {
  display: none;
}

/* custom checkbox */


/* centang */
.agree-box input:checked + .checkmark {
  background: #3b82f6;
  border-color: #3b82f6;
}

.agree-box input:checked + .checkmark::after {
  content: "";

  left: 4px;
  top: 1px;
  width: 4px;
  height: 8px;
  border: solid white;
  border-width: 0 2px 2px 0;

/* text */
.footer-agree .text {

.footer-agree a {
  color: #8b5cf6;

}

.footer-agree a:hover {

}

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
authDomain:"users-96dc5.firebaseapp.com",
databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"users-96dc5",
storageBucket:"users-96dc5.appspot.com",
messagingSenderId:"483322415863",
appId:"1:483322415863:web:1397a8f2e808e66ad9e1f2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* LOGIN (FIX TOTAL) */
window.login = async function () {

  const loginInput = document.getElementById("login").value.trim();
  const password = document.getElementById("password").value.trim();
  const error = document.getElementById("error");

  if (!loginInput || !password) {
    await showLoadingMessage("Isi semua data!");
    return;
  }

  try {

    const snap = await get(ref(db, "users2"));

    if (!snap.exists()) {
      error.innerText = "Data tidak ditemukan!";
      return;
    }

    let found = null;
    let foundKey = null;

    const cleanInput = loginInput.replace(/\s/g, "");
    const cleanPass = password.replace(/\s/g, "");

    snap.forEach(child => {

      const data = child.val();
      const key = child.key;

      const email = (data.email || "").toString().replace(/\s/g, "");
      const wa = (data.wa || "").toString().replace(/\s/g, "");

      if (
        (email === cleanInput || wa === cleanInput) &&
        cleanPass === wa
      ) {
        found = data;
        foundKey = key;
      }

    });

if (found) {

  /* 🔥 SESSION */
  localStorage.setItem("user", JSON.stringify({
    userId: foundKey,
    email: found.email,
    wa: found.wa
  }));

  const statusData = await checkStatus(foundKey);

  const toast = document.getElementById("toast");
  toast.style.opacity = "1";

  setTimeout(() => {
    toast.style.opacity = "0";

    // 🔥 CEK STATUS AKUN
    if (statusData.status === "banned" || statusData.status === "suspend") {
      window.location.href = "status_akun.html";
    } else {
      window.location.href = "my_akun.html";
    }

  }, 1200);

} else {
  await showLoadingMessage("Login gagal!");
}

} catch (e) {
  await showLoadingMessage("Error koneksi Server!");
}

};

async function checkStatus(userId){

  const snap = await get(ref(db, "Statusakun_host/" + userId));

  if(!snap.exists()){
    return { status: "approved" }; // default aman
  }

  return snap.val();
}






function showLoadingMessage(message = "Loading...") {
  const loading = document.getElementById("loading");
  const error = document.getElementById("error");

  error.innerText = "";
  loading.style.display = "block";

  return new Promise(resolve => {
    setTimeout(() => {
      loading.style.display = "none";
      error.innerText = message;

      setTimeout(() => {
        error.innerText = "";
        resolve();
      }, 3000);

    }, 1000);
  });
}




window.logToasFb = function(icon, message) {
  const box = document.getElementById("logToasFb");

  box.innerHTML = `
    <div class="notif-inner">
      <img src="${icon}" class="notif-icon">
      <span>${message}</span>
    </div>
  `;

  box.classList.add("show");

  setTimeout(() => {
    box.classList.remove("show");
  }, 2500);
};

// =======================
// EVENT BUTTONS
// =======================

document.querySelector(".fb").addEventListener("click", () => {
  logToasFb("login_icon_facebook.png", "Login Facebook tidak tersedia untuk host");
});

document.querySelector(".google").addEventListener("click", () => {
  logToasFb("login_icon_google.png", "Login Google tidak tersedia untuk host");
});

document.querySelector(".email").addEventListener("click", () => {
  logToasFb("login_icon_email.png", "Login Email belum aktif");
});

document.querySelector(".twitter").addEventListener("click", () => {
  logToasFb("login_icon_twitter.png", "Login Twitter tidak tersedia untuk host");
});
</script>


<script type="module">

const popup = document.getElementById("popupNotice");
const agreeBtn = document.getElementById("agreeBtn");

// cek saat load
window.addEventListener("load", () => {
  const accepted = localStorage.getItem("tigo_notice");

  if (!accepted) {
    popup.style.display = "flex";
  }
});

// klik menyetujui
agreeBtn.addEventListener("click", () => {
  localStorage.setItem("tigo_notice", "true");
  popup.style.display = "none";
});






/* ================= (NO zoom) ================= */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

/* ❌ BLOCK ZOOM KEYBOARD (Ctrl + / - / 0) */
document.addEventListener("keydown", function (e) {
  if (
    (e.ctrlKey && e.key === "+") ||
    (e.ctrlKey && e.key === "-") ||
    (e.ctrlKey && e.key === "0") ||
    (e.ctrlKey && e.key === "=")
  ) {
    e.preventDefault();
  }
});

/* BLOCK PINCH ZOOM (mobile) */
document.addEventListener("gesturestart", function (e) {
  e.preventDefault();
});

document.addEventListener("gesturechange", function (e) {
  e.preventDefault();
});

document.addEventListener("gestureend", function (e) {
  e.preventDefault();
});
/* ================= (NO zoom) ================= */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {

    navigator.serviceWorker.register("/New_agency/service-worker.js")
      .then((reg) => {
        console.log("SW registered:", reg.scope);

        // 🔥 CEK UPDATE
        reg.addEventListener("updatefound", () => {
          const newWorker = reg.installing;

          newWorker.addEventListener("statechange", () => {
            if (
              newWorker.state === "installed" &&
              navigator.serviceWorker.controller
            ) {
              // 🔥 paksa aktif SW baru
              newWorker.postMessage("SKIP_WAITING");

              // 🔥 reload biar versi baru tampil
              window.location.reload();
            }
          });
        });

      })
      .catch((err) => {
        console.log("SW failed:", err);
      });

  });
}
</script>
