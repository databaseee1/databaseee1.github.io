<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tigo|Login</title>

  <style>
    body{
      margin:0;
      height:100vh;
      font-family: Arial;
      overflow:hidden;
    }

    /* BACKGROUND FOTO */
    .bg{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:url('ic_launcher_background.png') center/cover no-repeat;
      filter: brightness(0.8);
    }

    /* LAYER CONTENT */
    .content{
      position:relative;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      z-index:2;
      color:white;
    }

    img{
      width:120px;
      height:120px;
      border-radius:20px;
    }

    /* FOOTER TEXT */
    .footer{
      position:fixed;
      bottom:20px;
      width:100%;
      text-align:center;
      color:white;
      font-size:16px;
      z-index:3;
    }
  </style>
</head>

<body>

  <div class="bg"></div>

  <div class="content">
    <img src="icon-512x512.png" alt="logo">
  </div>

  <div class="footer">
    Tigo
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "Login.html";
    }, 2000);
  </script>

</body>
</html>
