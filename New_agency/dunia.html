@keyframes spin{

.saldo-box{

@keyframes carouselFakeAnim{

let currentUser = null;

function formatSaldoCoin(saldo){
  saldo = Number(saldo || 0);

  // 🔥 juta → M
  if (saldo >= 1000000) {
    const juta = saldo / 1000000;

    return Number.isInteger(juta)
      ? juta + "M"
      : juta.toFixed(1) + "M";
  }

  // 🔥 kecil → credits (DESIMAL, bukan bulat)
  const credits = saldo / 171.1;

  return credits.toFixed(1);
}





function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}







const FOTO_CACHE_KEY = "fotoglobal_cache_v1";

async function loadFotoGlobal() {

  const track = document.getElementById("carouselTrack");
  const fake = document.getElementById("carouselFake");

  // =====================
  // TAMPILKAN CACHE DULU
  // =====================
  const cache = localStorage.getItem(FOTO_CACHE_KEY);

  if (cache) {
    try {
      let urls = JSON.parse(cache);

urls = shuffleArray(urls);

document.getElementById("carouselFake")?.remove();
track.innerHTML = "";

      urls.forEach(item => {
        const url =
          typeof item === "string"
            ? item
            : item.url;

        const div = document.createElement("div");
        div.className = "carousel-item";
        div.innerHTML = `
          <img src="${url}" loading="lazy">
        `;
        track.appendChild(div);
      });

    } catch (e) {
      console.log("Cache error:", e);
    }
  }

  // =====================
  // AMBIL DATA TERBARU FIREBASE
  // =====================
  const snap = await get(ref(db, "fotoglobal"));

  if (!snap.exists()) return;

  const data = snap.val();
  let urls = Object.values(data);

  // simpan cache
  localStorage.setItem(
    FOTO_CACHE_KEY,
    JSON.stringify(urls)
  );

urls = shuffleArray(urls);

document.getElementById("carouselFake")?.remove();
track.innerHTML = "";

  // tampilkan 10 dulu
  const firstBatch = urls.slice(0, 10);

  firstBatch.forEach(item => {
    const url =
      typeof item === "string"
        ? item
        : item.url;

    const div = document.createElement("div");
    div.className = "carousel-item";
    div.innerHTML = `
      <img src="${url}" loading="lazy">
    `;
    track.appendChild(div);
  });

  // sisanya belakangan
  setTimeout(() => {

    const rest = urls.slice(10);

    rest.forEach(item => {
      const url =
        typeof item === "string"
          ? item
          : item.url;

      const div = document.createElement("div");
      div.className = "carousel-item";
      div.innerHTML = `
        <img src="${url}" loading="lazy">
      `;
      track.appendChild(div);
    });

  }, 200);

  await new Promise(r =>
    requestAnimationFrame(r)
  );

  await new Promise(r =>
    requestAnimationFrame(r)
  );
}

const container = document.getElementById('carouselContainer');
const track = document.getElementById('carouselTrack');
const items = track.querySelectorAll('.carousel-item');

let scrollPos =
Number(localStorage.getItem("carouselPos")) || 0;
const speed = 0.6;

function autoScroll() {
    scrollPos += speed;

    const maxScroll = track.scrollWidth - container.offsetWidth;

    if (maxScroll <= 0) return;

    if (scrollPos >= maxScroll) {
        scrollPos = 0;
    }

    track.style.transform = "translate3d(" + (-scrollPos) + "px,0,0)";
}



// lebih smooth dari setInterval
function loop() {
    autoScroll();
    updateScale(); // 🔥 PENTING: langsung update tiap frame
    requestAnimationFrame(loop);
}

  // 🔥 BARU START LOOP DI SINI

window.addEventListener("resize", () => {

let saveCounter = 0;

// SCALE OPTIMASI (tidak pakai loop berat tiap 80ms)
let lastScaleUpdate = 0;

function updateScale() {
  const containerRect = container.getBoundingClientRect();
  const centerX = containerRect.left + containerRect.width / 2;

  const items = document.querySelectorAll("#carouselTrack .carousel-item");

  items.forEach(item => {
    const img = item.querySelector("img");
    const rect = item.getBoundingClientRect();

    const itemCenter = rect.left + rect.width / 2;

    let distance = Math.abs(centerX - itemCenter);

    let scale = 1 - distance / 250;

    if (scale < 0.6) scale = 0.6;
    if (scale > 1) scale = 1;

    img.style.transform = `scale(${scale})`;
  });
}

// throttle scale (biar tidak spam di mobile)
function scaleLoop(time) {
    if (time - lastScaleUpdate > 120) {
        updateScale();
        lastScaleUpdate = time;
    }
    requestAnimationFrame(scaleLoop);
}

requestAnimationFrame(scaleLoop);















function setActiveNav(el) {

  document.querySelectorAll("#bottomNav .nav-item")
    .forEach(item => {

      item.classList.remove("active");

      const img = item.querySelector(".nav-icon");
      if (img) {
        img.src = img.dataset.default;
      }
    });

  if (!el) return;

  el.classList.add("active");

  const activeImg =
    el.querySelector(".nav-icon");

  if (activeImg) {
    activeImg.src =
      activeImg.dataset.active;
  }
}

window.goNav = function(el, url) {

  setActiveNav(el);

  localStorage.setItem(
    "activeNavPage",
    url
  );

  setTimeout(() => {
    window.location.href = url;
  }, 30);
};

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const currentPage =
      window.location.pathname
        .split("/")
        .pop();

    const active =
      document.querySelector(
        `#bottomNav .nav-item[data-page="${currentPage}"]`
      );

    setActiveNav(active);
  }
);


/* ================= (NO zoom) ================= */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

/* ❌ BLOCK ZOOM KEYBOARD (Ctrl + / - / 0) */
document.addEventListener("keydown", function (e) {
  if (
    (e.ctrlKey && e.key === "+") ||
    (e.ctrlKey && e.key === "-") ||
    (e.ctrlKey && e.key === "0") ||
    (e.ctrlKey && e.key === "=")
  ) {
    e.preventDefault();
  }
});

/* BLOCK PINCH ZOOM (mobile) */
document.addEventListener("gesturestart", function (e) {
  e.preventDefault();
});

});
