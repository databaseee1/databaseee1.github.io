<button id="bannerhot_generate">
  Generate 10 Banner HOT
</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  update,
  set
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain:"users-96dc5.firebaseapp.com",
  databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

document.getElementById("bannerhot_generate").addEventListener("click", async () => {

  const snap = await get(ref(db, "BANNERHOT"));

  // biar cuma 1x generate
  if (snap.exists()) {
    alert("BANNERHOT sudah dibuat!");
    return;
  }

  const dummy = [];

  for (let i = 1; i <= 10; i++) {

    dummy.push({
      foto: `https://picsum.photos/800/400?random=${i}`,
      link: `https://www.tigohost.asia/banner/${i}`,
      diperbaharuiOleh: "Tigo"
    });

  }

  for (let i = 0; i < dummy.length; i++) {

    await set(ref(db, `BANNERHOT/${i + 1}`), dummy[i]);

  }

  alert("10 Banner HOT berhasil dibuat!");

});
</script>
