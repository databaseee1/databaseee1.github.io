<input
  id="targetUserId"
  placeholder="Masukkan User ID users2"
>

<button onclick="buatDummyCall()">
  Buat Dummy Panggilan
</button>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
  getDatabase,
  ref,
  set
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
  storageBucket: "users-96dc5.appspot.com",
  messagingSenderId: "483322415863",
  appId: "1:483322415863:web:1397a8f2e808e66ad9e1f2"
};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);

window.buatDummyCall =
async function(){

  const targetUserId =
    document
      .getElementById("targetUserId")
      .value
      .trim();

  if(!targetUserId){
    alert("Masukkan User ID.");
    return;
  }

  await set(
    ref(
      db,
      "IncomingCall/" +
      targetUserId
    ),
    {
      aktif: true,

      foto:
      "https://i.pinimg.com/736x/8e/20/89/8e20893c0a3ce653e3764b660fe9afd8.jpg",

      nama:
      "Aulia",

      negara:
      "Indonesia",

      negaraLogo:
      "indonesialogo.png",

      pesan:
      "Sedang menghubungi Anda..."
    }
  );

  alert("Dummy panggilan berhasil dibuat.");
};

</script>
