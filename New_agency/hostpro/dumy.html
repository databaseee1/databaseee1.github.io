<button id="addSliderBtn">Tambah Slider Dummy</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain:"users-96dc5.firebaseapp.com",
  databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const sliderBtn = document.getElementById("addSliderBtn");

const sliderDummy = [
  "https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d",
  "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee",
  "https://images.unsplash.com/photo-1495567720989-cebdbdd97913",
  "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e",
  "https://images.unsplash.com/photo-1501785888041-af3ef285b470"
];

sliderBtn.addEventListener("click", async () => {

  try {

    const snap = await get(ref(db, "Mypostingan"));

    if(!snap.exists()){
      alert("Tidak ada postingan");
      return;
    }

    const updates = {};

    snap.forEach(child => {
      const id = child.key;

      updates[`Mypostingan/${id}/slider`] = sliderDummy;
    });

    await update(ref(db), updates);

    alert("Semua postingan berhasil ditambahkan slider!");

  } catch (err) {
    console.error(err);
    alert("Gagal update slider");
  }

});
</script>
