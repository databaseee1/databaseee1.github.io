<button id="addLinkBtn">Tambah Link Tujuan Semua Post</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain:"users-96dc5.firebaseapp.com",
  databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* POOL LINK RANDOM */
const links = [
  "https://tigohost.asia",
  "https://google.com",
  "https://youtube.com",
  "https://example.com",
  "https://github.com"
];

function getRandomLink() {
  return links[Math.floor(Math.random() * links.length)];
}

const addLinkBtn = document.getElementById("addLinkBtn");

addLinkBtn.addEventListener("click", async () => {

  try {
    const snap = await get(ref(db, "Mypostingan"));

    if (!snap.exists()) {
      alert("Tidak ada data postingan");
      return;
    }

    const updates = {};

    snap.forEach(child => {
      const key = child.key;

      updates[`Mypostingan/${key}/linkTujuan`] = getRandomLink();
    });

    await update(ref(db), updates);

    alert("Semua postingan berhasil ditambahkan link random!");

  } catch (err) {
    console.error(err);
    alert("Gagal update semua postingan");
  }

});

</script>
