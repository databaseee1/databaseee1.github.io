/* LOGIN WAJIB */
const login =
JSON.parse(localStorage.getItem("user"));

if(!login){

}







function updateLastActive(page = "Catatan_Pembayaran") {

  const login = JSON.parse(localStorage.getItem("user"));
  if (!login?.userId) return;

  update(ref(db, "users2/" + login.userId), {
    lastActive: Date.now(),
    currentPage: page
  });

}

["click", "touchstart", "keydown"].forEach(evt => {

  }, { passive: true });
});

/* FORMAT RUPIAH */
function rupiah(nominal){

return "Rp " +
Number(nominal || 0)
.toLocaleString("id-ID");

}

/* FORMAT TANGGAL */
function formatTanggal(timestamp){

if(!timestamp) return "-";

const d = new Date(timestamp);

return d.toLocaleDateString("id-ID",{
day:"2-digit",
month:"2-digit",
year:"numeric"
})
+
" "
+
d.toLocaleTimeString("id-ID",{
hour:"2-digit",
minute:"2-digit"
});

}

/* SPINNER */
function hideLoading(){

const loading =
document.getElementById("loadingScreen");

if(!loading) return;

loading.style.opacity = "0";

setTimeout(()=>{

loading.style.display = "none";

},300);

}



let selectedYear = null;
let selectedMonth = null;
/* LOAD HISTORY */
async function loadHistory(){

const list =
document.getElementById("txList");

try{

const snap =
await get(ref(db,"historyWithdraw"));

if(!snap.exists()){

list.innerHTML = `
<div class="tx-item">
<div>
<div class="tx-main">
Belum ada riwayat penarikan
</div>
</div>
</div>
`;

hideLoading();
return;

}

let histories = [];

snap.forEach(child=>{

const data = child.val();

const cocokUser =
data.userId &&
login.userId &&
String(data.userId) === String(login.userId);

if(cocokUser){

const tgl =
new Date(data.createdAt || 0);

const itemYear =
String(tgl.getFullYear());

const itemMonth =
String(tgl.getMonth() + 1).padStart(2,"0");




/* FILTER BULAN TAHUN */
if(
selectedYear &&
selectedMonth &&
(
itemYear !== selectedYear ||
itemMonth !== selectedMonth
)
){

return;
}

histories.push({
id: child.key,
...data
});

}

});

histories.sort((a,b)=>
(b.createdAt || 0)
-
(a.createdAt || 0)
);

if(histories.length === 0){

  document.getElementById("historyTotal").innerText =
  "Total: $ 0.00";

  if(selectedYear && selectedMonth){

    document.getElementById("historyHeader").innerText =
    Number(selectedMonth) + "/" + selectedYear;

  }else{

    const now = new Date();

    document.getElementById("historyHeader").innerText =
    (now.getMonth() + 1) + "/" + now.getFullYear();

  }

  list.innerHTML = `
  <div class="tx-item">
    <div>
      <div class="tx-main">
        Belum ada riwayat penarikan
      </div>
    </div>
  </div>
  `;

  hideLoading();
  return;

}

let totalWithdraw = 0;
let html = "";

histories.forEach(item=>{

let warna = "#7749f8";
let judul = "Dalam ulasan";

if(item.status === "approved"){

warna = "#6d6d6d";
judul = "Punya uang";

/* HANYA APPROVED DIHITUNG */
totalWithdraw += Number(item.nominal || 0);

}

if(item.status === "rejected"){

warna = "#ff3d00";
judul = "Tidak disetujui";

}

html += `

<div class="tx-item">

  <div class="tx-left">

  <div
class="tx-main"
style="
  color:${warna};
  font-weight:500;
  margin-bottom:8px;
">
  ${judul}
</div>

    <div class="tx-sub">
      ${formatTanggal(item.createdAt)}
    </div>

  </div>

  <div
  class="tx-amount"
  style="
    color:#868686;
    font-weight:500;
  ">
    ${formatSaldoK(item.nominal)}
  </div>

</div>

`;

});

function formatTanggal(timestamp){

if(!timestamp) return "-";

const d = new Date(timestamp);

const bulan = d.getMonth() + 1;
const tanggal = d.getDate();

const jam = String(d.getHours()).padStart(2,"0");
const menit = String(d.getMinutes()).padStart(2,"0");
const detik = String(d.getSeconds()).padStart(2,"0");

return `${bulan}/${tanggal} ${jam}:${menit}:${detik}`;

}

function formatSaldoK(nominal){

nominal = Number(nominal || 0);

if(nominal >= 1000000){

return "Rp " +
(nominal / 1000000)
.toFixed(3)
.replace(/\.?0+$/,'')
+ "JT";

}

return "Rp " +
(nominal / 1000)
.toFixed(2)
+ "K";

}







/* TOTAL HANYA APPROVED */
/* TOTAL HANYA APPROVED */
const usdRate = 15500;
const totalUSD = (totalWithdraw / usdRate).toFixed(2);

document.getElementById("historyTotal").innerText =
"Total: $ " + totalUSD;

/* HEADER SESUAI FILTER */
if(selectedYear && selectedMonth){

  document.getElementById("historyHeader").innerText =
  Number(selectedMonth) + "/" + selectedYear;

}else{

  const now = new Date();

  document.getElementById("historyHeader").innerText =
  (now.getMonth() + 1) + "/" + now.getFullYear();

}





list.innerHTML = html;

hideLoading();

}catch(err){

console.log(err);

document.getElementById(
"txList"
).innerHTML = `

<div class="tx-item">

<div>
<div class="tx-main">
Gagal memuat data
</div>
</div>

</div>

`;

hideLoading();

}

}


loadHistory();






const filterBtn =
document.getElementById("filterBtn");

const filterSheet =
document.getElementById("filterSheet");

/* BUKA FILTER */
filterBtn.onclick = ()=>{

  filterSheet.style.bottom = "0";

};

/* TUTUP FILTER */
document
.getElementById("cancelFilter")
.onclick = ()=>{

  filterSheet.style.bottom = "-100%";

};

/* KONFIRMASI FILTER */
document
.getElementById("confirmFilter")
.onclick = ()=>{

  const tahun =
  document.getElementById("pickerYear").value;

  const bulan =
  document.getElementById("pickerMonth").value;

  selectedYear = String(tahun);
selectedMonth = String(bulan).padStart(2,"0");

loadHistory();

  filterSheet.style.bottom = "-100%";

};



/* FILTER */
window.applyFilter = function(year, month){

  selectedYear = year;
  selectedMonth = month;

  

  loadHistory();

};

const now = new Date();

document.getElementById("pickerYear").value =
String(now.getFullYear());

document.getElementById("pickerMonth").value =
String(now.getMonth() + 1).padStart(2,"0");







/* ================= (NO zoom) ================= */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

/* ❌ BLOCK ZOOM KEYBOARD (Ctrl + / - / 0) */
document.addEventListener("keydown", function (e) {
  if (
    (e.ctrlKey && e.key === "+") ||
    (e.ctrlKey && e.key === "-") ||
    (e.ctrlKey && e.key === "0") ||
    (e.ctrlKey && e.key === "=")
  ) {
    e.preventDefault();
  }
});

/* BLOCK PINCH ZOOM (mobile) */
document.addEventListener("gesturestart", function (e) {
  e.preventDefault();
});

document.addEventListener("gesturechange", function (e) {
  e.preventDefault();
});

document.addEventListener("gestureend", function (e) {
  e.preventDefault();
});
/* ================= (NO zoom) ================= */



</script>
