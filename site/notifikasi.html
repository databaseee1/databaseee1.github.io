<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Notifikasi Saya</title>

<style>




*{
-webkit-tap-highlight-color: transparent;
}

button,
a,
img,
div{
-webkit-tap-highlight-color: transparent;
}

body{
user-select:none;
-webkit-user-select:none;
}

img{
-webkit-user-drag:none;
}

input,
textarea,
select{
user-select:text;
-webkit-user-select:text;
}




body{
    margin:0;
    font-family:Arial;
    background:#f7f5ff;
}

/* HEADER */
.header{
    background:#6a00ff;
    color:#fff;
    padding:14px;
    font-weight:bold;
    font-size:16px;
    position:sticky;
    top:0;
}

/* LIST */
.container{
    padding:12px;
}

/* CARD NOTIF */
.card{
    background:#fff;
    border-radius:12px;
    padding:12px;
    margin-bottom:10px;
    box-shadow:0 2px 6px rgba(0,0,0,0.05);
    cursor:pointer;
    border-left:4px solid transparent;
}

.card.unread{
    border-left:4px solid #6a00ff;
    background:#faf8ff;
}

.title{
    font-weight:bold;
    font-size:13px;
    margin-bottom:4px;
}

.msg{
    font-size:12px;
    color:#444;
    line-height:1.4;
}

.time{
    font-size:11px;
    color:#999;
    margin-top:6px;
}

/* EMPTY */
.empty{
    text-align:center;
    margin-top:50px;
    color:#777;
}

/* POPUP */
.popup{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    display:none;
    justify-content:center;
    align-items:center;
}

.popup-content{
    background:#fff;
    width:90%;
    border-radius:12px;
    padding:14px;
}

.close{
    float:right;
    cursor:pointer;
    font-weight:bold;
    color:#6a00ff;
}
</style>
</head>

<body>

<div class="header">
Notifikasi Saya
</div>

<div class="container" id="list">
Loading...
</div>

<!-- POPUP -->
<div class="popup" id="popup">
    <div class="popup-content">
        <span class="close" id="close">✕</span>
        <div id="popupText"></div>
    </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
    getDatabase,
    ref,
    get,
    update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const uid = localStorage.getItem("usersid");

const listEl = document.getElementById("list");
const popup = document.getElementById("popup");
const popupText = document.getElementById("popupText");

/* CLOSE POPUP */
document.getElementById("close").onclick = () => {
    popup.style.display = "none";
};

if(!uid){
    listEl.innerHTML = `<div class="empty">Yuk Login dulu</div>`;
}else{
    loadNotif();
}

/* ===================== LOAD NOTIF ===================== */
async function loadNotif(){

    const snap = await get(ref(db, `notifications/${uid}`));

    if(!snap.exists()){
        listEl.innerHTML = `<div class="empty">Belum ada notifikasi</div>`;
        return;
    }

    const data = snap.val();

    let html = "";

    Object.entries(data).reverse().forEach(([id,item])=>{

        const o = item.orderData || {};

        // Logo aplikasi / thumbnail produk (BUKAN logo bank)
        const logo =
            item.produkThumbnail ||
            o.produkThumbnail ||
            item.logoAplikasi ||
            o.logoAplikasi ||
            item.thumbnail ||
            o.thumbnail ||
            "https://cdn-icons-png.flaticon.com/512/1828/1828640.png";

        // Nama aplikasi / produk
const nama =
    item.produk?.nama?.nama ||
    item.produk?.nama ||
    item.produkNama ||
    item.orderData?.produk?.nama ||
    item.aplikasi ||
    "Tigo Notification";


    console.log("produk =", item.produk);
console.log("orderData =", item.orderData);


        html += `

<div
class="card ${item.read ? "" : "unread"}"
onclick="openNotif('${id}')">

<div style="
display:flex;
align-items:flex-start;
gap:14px;
">

<div style="
width:56px;
height:56px;
border-radius:16px;
overflow:hidden;
background:#fff;
border:1px solid #ececec;
flex-shrink:0;
box-shadow:0 4px 12px rgba(0,0,0,.08);
">

<img
src="${logo}"
style="
width:100%;
height:100%;
object-fit:cover;
">

</div>


<div style="
flex:1;
min-width:0;
">

<div style="
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:10px;
margin-bottom:6px;
">

<div style="
font-size:15px;
font-weight:700;
color:#222;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
">

${nama}

</div>

${
!item.read
?
`<span style="
width:10px;
height:10px;
border-radius:50%;
background:#ff3b30;
flex-shrink:0;
margin-top:5px;
"></span>`
:
""
}

</div>


<div style="
font-size:13px;
color:#666;
line-height:1.6;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
">

${item.message}

</div>


<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-top:12px;
">

<div style="
font-size:12px;
color:#999;
">

${new Date(item.createdAt).toLocaleString("id-ID")}

</div>

<div style="
font-size:12px;
font-weight:700;
color:#5c27fe;
">

Lihat Detail ›

</div>

</div>

</div>

</div>

</div>

`;
    });

    listEl.innerHTML = html;
}

/* ===================== OPEN NOTIF ===================== */
window.openNotif = async(id)=>{

const snap = await get(
ref(db,`notifications/${uid}/${id}`)
);

if(!snap.exists()) return;

const n = snap.val();

// Ambil detail pesanan
const o = n.orderData || {};

const produk =
n.produk?.nama ||
o.produk?.nama ||
n.produk ||
o.produk ||
n.aplikasi ||
"-";

const itemNama =
n.item?.nama ||
o.item?.nama ||
n.itemNama ||
o.itemNama ||
n.item ||
n.paket ||
"-";

const harga =
n.total ??
o.itemHarga ??
n.harga ??
0;

const pembayaran =
n.namaBank ||
o.paymentBank ||
n.payment ||
"-";

const status =
n.status ||
o.status ||
"Menunggu Pembayaran";

const bg =
status==="Sukses"
? "#d8ffe5"
:
status==="Gagal"
? "#ffe2e2"
:
"#fff5d8";


const color =
status==="Sukses"
? "#0b8d3b"
:
status==="Gagal"
? "#d60000"
:
"#c98b00";

popupText.innerHTML = `

<div style="
background:#fff;
border-radius:18px;
overflow:hidden;
font-family:Poppins,sans-serif;
">

<div style="
background:linear-gradient(135deg,#5c27fe,#7f5cff);
padding:18px;
color:#fff;
">

<div style="
font-size:18px;
font-weight:700;
">
Detail Pembelian
</div>

<div style="
font-size:13px;
opacity:.9;
margin-top:4px;
line-height:1.5;
">
${n.message}
</div>

</div>


<div style="padding:18px;">


<div style="
border:1px solid #ececec;
border-radius:14px;
padding:15px;
margin-bottom:15px;
">

<div style="
font-size:13px;
color:#888;
margin-bottom:10px;
font-weight:600;
">
PRODUK
</div>

<div style="
display:flex;
justify-content:space-between;
margin-bottom:10px;
">

<span style="color:#777;">
Produk
</span>

<b>
${produk?.nama || produk || "-"}
</b>

</div>

<div style="
display:flex;
justify-content:space-between;
margin-bottom:10px;
">

<span style="color:#777;">
Item
</span>

<b>
${itemNama}
</b>

</div>

<div style="
display:flex;
justify-content:space-between;
">

<span style="color:#777;">
Total
</span>

<b style="
color:#5c27fe;
font-size:17px;
">
Rp ${Number(harga).toLocaleString("id-ID")}
</b>

</div>

</div>



<div style="
border:1px solid #ececec;
border-radius:14px;
padding:15px;
margin-bottom:15px;
">

<div style="
font-size:13px;
color:#888;
margin-bottom:10px;
font-weight:600;
">
PEMBAYARAN
</div>


<div style="
display:flex;
align-items:center;
gap:12px;
margin-bottom:14px;
">

${
n.logoBank
?
`
<img
src="${n.logoBank}"
style="
width:52px;
height:52px;
border-radius:12px;
object-fit:contain;
background:#fff;
border:1px solid #eee;
padding:6px;
">
`
:
""
}

<div>

<div style="
font-weight:700;
">
${n.namaBank || "-"}
</div>

<div style="
font-size:13px;
color:#777;
">
${n.namaRekening || "-"}
</div>

</div>

</div>


<div style="
display:flex;
justify-content:space-between;
margin-bottom:10px;
">

<span style="color:#777;">
Nomor Pembayaran
</span>

<b>
${n.noRekening || "-"}
</b>

</div>


<div style="
display:flex;
justify-content:space-between;
">

<span style="color:#777;">
Metode
</span>

<b>
${pembayaran}
</b>

</div>

</div>



<div style="
border:1px solid #ececec;
border-radius:14px;
padding:15px;
">

<div style="
display:flex;
justify-content:space-between;
align-items:center;
">

<span style="
font-weight:600;
">
Status Pesanan
</span>

<span style="
background:${bg};
color:${color};
padding:6px 12px;
border-radius:999px;
font-size:13px;
font-weight:700;
">
${status}
</span>

</div>

</div>

</div>

</div>

`;

popup.style.display="flex";

await update(
ref(db,`notifications/${uid}/${id}`),
{
read:true
}
);

loadNotif();

};


















// PROTEKSI
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

document.addEventListener("dragstart",e=>{
if(e.target.tagName==="IMG")e.preventDefault();
});

document.addEventListener("keydown",e=>{
if(
(e.ctrlKey&&["s","u","c"].includes(e.key.toLowerCase()))
||e.key==="F12"
)e.preventDefault();
});


let lastTouch=0;

document.addEventListener("touchend",e=>{
let now=Date.now();
if(now-lastTouch<300)e.preventDefault();
lastTouch=now;
},{passive:false});


document.addEventListener("gesturestart",e=>e.preventDefault());
// PROTEKSI



</script>

</body>
</html>
