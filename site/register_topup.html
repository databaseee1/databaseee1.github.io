<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    set,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const redirect =
new URLSearchParams(
    location.search
).get("redirect");

document
.getElementById("btnDaftar")
.onclick = async ()=>{

    const email =
    document.getElementById("email")
    .value.trim();

    const password =
    document.getElementById("password")
    .value.trim();

    const whatsapp =
    document.getElementById("whatsapp")
    .value.trim();

    if(!email){
        alert("Email wajib diisi.");
        return;
    }

    if(!password){
        alert("Password wajib diisi.");
        return;
    }

    if(!whatsapp){
        alert("Nomor WhatsApp wajib diisi.");
        return;
    }

    try{

        const usersid =
        "USR" + Date.now();

        const cek =
        await get(
            ref(
                db,
                `users_topup/${usersid}`
            )
        );

        if(cek.exists()){
            alert(
                "Silakan coba lagi."
            );
            return;
        }

        const dataUser = {
            usersid,
            email,
            password,
            whatsapp,
            profil:
            "https://ui-avatars.com/api/?name=" +
            encodeURIComponent(
                email.charAt(0)
            ),

            fotoSampul:
            "https://res.cloudinary.com/dowoq4a0i/image/upload/v1783173591/uvmbwsddcuajb7nkrpjp.png",

            saldo:0,
            dibuatPada:Date.now()
        };

        await set(
            ref(
                db,
                `users_topup/${usersid}`
            ),
            dataUser
        );

        localStorage.setItem(
            "usersid",
            usersid
        );

        localStorage.setItem(
            "user_topup",
            JSON.stringify(
                dataUser
            )
        );

        alert(
            "Pendaftaran berhasil."
        );

        if(redirect){
            location.href =
            decodeURIComponent(
                redirect
            );
        }else{
            location.href =
            "beranda.html";
        }

    }catch(err){

        console.error(err);
        alert(err.message);

    }

};












// PROTEKSI
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

document.addEventListener("dragstart",e=>{
if(e.target.tagName==="IMG")e.preventDefault();
});

document.addEventListener("keydown",e=>{
if(
(e.ctrlKey&&["s","u","c"].includes(e.key.toLowerCase()))
||e.key==="F12"
)e.preventDefault();
});


let lastTouch=0;

document.addEventListener("touchend",e=>{
let now=Date.now();
if(now-lastTouch<300)e.preventDefault();
lastTouch=now;
},{passive:false});


document.addEventListener("gesturestart",e=>e.preventDefault());
// PROTEKSI



</script>
