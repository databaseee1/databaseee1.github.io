<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Top Up Mobile</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
}

body{

margin:0;
background:#f6f6f6;
font-family:Poppins,Arial;
    color: #9e4fff;

}



.container{

max-width:600px;
margin:auto;
padding-bottom:100px;

}



.card{

background:white;
margin:12px;
padding:14px;
border-radius:8px;

box-shadow:0 3px 12px #0001;

}



.hero img{

width:100%;
height:220px;
object-fit:cover;
border-radius:15px;

}



.title{

font-size:18px;
font-weight:600;
margin-top:20px;
color: #834bff;
    margin-bottom: 20px;

}



.rating{

display:flex;
gap:10px;
font-size:13px;
color:#777;

}



.star{

color:#ffae00;

}




.price{

color:#ff4d00;
font-size:22px;
font-weight:600;
margin-top: 30px;

}



#productList{

display:grid;

grid-template-columns:repeat(2,1fr);

gap:10px;

margin-top:10px;

}




.product{

display:flex;

flex-direction:column;

align-items:center;

justify-content:center;

text-align:center;

gap:8px;

border:1px solid #eee;

padding:12px;

border-radius:16px;

cursor:pointer;

background:white;

min-height:120px;

transition:.2s;

}



.product:hover{

transform:translateY(-2px);

box-shadow:0 5px 15px #0002;

}



.product.active{

border:2px solid #ff4d00;

background:#fff7f2;

}




.product img{

width:45px;

height:45px;

object-fit:contain;

}



.product-name{

font-weight:800;

font-size:13px;

line-height:18px;

}



.product-price{

color:#ff4d00;

font-weight:600;

font-size:14px;

}




/* desktop */

@media(min-width:900px){


#productList{

grid-template-columns:repeat(5,1fr);

}


}



.product-logo{

width:45px;
height:45px;

object-fit:contain;

border-radius:10px;

background:#f7f7f7;

}



.product-info{

flex:1;

}



.product-name{

font-weight:800;
font-size:14px;

}



.product-price{

color:#ff4d00;
font-weight:600;
margin-top:5px;

}



input{

width:100%;
padding:12px;
border-radius:12px;
border:1px solid #ddd;
margin-top:8px;

}



.buy{

position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);

width:90%;
max-width:560px;

border:0;

background:#ff4d00;

color:white;

padding:15px;

border-radius:18px;

font-weight:900;

}




.popup{

position:fixed;
inset:0;

background:#0006;

display:none;

align-items:center;
justify-content:center;

z-index:99;

}



.box{

background:white;

width:90%;
max-width:360px;

padding:22px;

border-radius:22px;

text-align:center;

}



.box i{

font-size:45px;
color:#ff4d00;

}



.btn{

width:100%;
padding:13px;
border:0;
border-radius:14px;

margin-top:10px;

background:#ff4d00;
color:white;

font-weight:800;

}



.close{

background:#eee;
color:#333;

}


.badge{

display:inline-flex;
align-items:center;
gap:5px;

background:#fff1e8;

color:#52aa72;

padding:6px 10px;

border-radius:20px;

font-size:12px;

font-weight:600;

}



.card p{

font-size:13px;

line-height:1.6;

color:#666;

}





.cara-box{

margin-top:12px;
border-radius:15px;
background:#f8f8f8;
overflow:hidden;

}


.cara-head{

padding:14px;
display:flex;
justify-content:space-between;
align-items:center;
font-weight:800;
cursor:pointer;

}


.cara-head i{

transition:.3s;

}



.cara-content{

max-height:0;
overflow:hidden;
padding:0 14px;
font-size:13px;
color:#666;
line-height:1.6;
transition:.3s;

}



.cara-content.open{

max-height:3000px;
padding:0 14px 14px;

}


.cara-head.active i{

transform:rotate(180deg);

}










#antisscrampng83{

margin-top:6px;
    margin-bottom: -40px;

}


#antisscrampng83 img{

width:90px;

height:70px;

object-fit:contain;

}
</style>

</head>



<body>



<div class="container" id="content">


<div class="card">
Memuat...
</div>


</div>



<button class="buy" id="buyBtn">
Beli Sekarang
</button>





<!-- POPUP -->


<div class="popup" id="popup">


<div class="box">


<i class="fa-solid fa-circle-info"></i>


<h3 id="popupTitle">
Info
</h3>


<p id="popupText"></p>


<button class="btn" id="popupOk">
OK
</button>


<button class="btn close" id="popupClose">
Tutup
</button>


</div>

</div>







<script type="module">


import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
get

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",

authDomain:"users-96dc5.firebaseapp.com",

databaseURL:
"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"users-96dc5"

};



const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);




const id =
new URLSearchParams(location.search)
.get("id");


if(!id){

document.getElementById("content").innerHTML =
`
<div class="card">
Data produk tidak ditemukan
</div>
`;

throw new Error("ID produk kosong");
}


const content =
document.getElementById("content");



let game=null;

let selectedProduct=null;




function showPopup(title,text){


document
.getElementById("popupTitle")
.innerHTML = title;



document
.getElementById("popupText")
.innerHTML = text;



document
.getElementById("popup")
.style.display="flex";



}


popupOk.onclick=()=>{

document
.getElementById("popup")
.style.display="none";

};



popupClose.onclick=()=>{

document
.getElementById("popup")
.style.display="none";

};





async function load(){


const snap =
await get(
ref(db,"Top-up game-Mobile/"+id)
);



if(!snap.exists()){

content.innerHTML="Data tidak ditemukan";

return;

}


game=snap.val();




content.innerHTML=`



<div class="card hero">


<img src="${game.thumbnail}">



<div class="title">

${game.nama}

</div>





<div class="rating">


<span class="star">

<i class="fa-solid fa-star"></i>

${game.rating || "-"}

</span>



<span>

${game.ulasan || "0 Ulasan"}

</span>



<span>

${game.terjual || 0} Terjual

</span>


</div>

<div id="antisscrampng83">


<img src="https://res.cloudinary.com/dowoq4a0i/image/upload/v1782856890/bt3oxtfnoxeienyjqgu9.webp">


</div>



<div class="price">

Rp ${Number(game.harga || 0)
.toLocaleString("id-ID")}

</div>





<div style="
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:10px;
">



<span class="badge">

<i class="fa-solid fa-layer-group"></i>

${game.kategori || "-"}

</span>




<span class="badge">

<i class="fa-solid fa-earth-asia"></i>

${game.status || "-"}

</span>




<span class="badge">

<i class="fa-solid fa-gamepad"></i>

${game.platform?.nama || "-"}

</span>



</div>




</div>






<div class="card">


<h3>

<i class="fa-solid fa-user"></i>

Data Akun

</h3>



<input id="account"

placeholder="ID Account">





<input id="email"

readonly

placeholder="Email">





<input id="wa"

readonly

placeholder="WhatsApp">



</div>




<div class="card">


<h3>

<i class="fa-solid fa-tablet-button"></i>

Pilih item

</h3>



<div id="productList"></div>


</div>







<div class="card">


<h3>




<div class="cara-box">


<div class="cara-head" onclick="toggleCara()">


<span>
<i class="fa-solid fa-circle-info"></i>
Cara Beli & Tips
</span>


<i class="fa-solid fa-chevron-down"></i>


</div>



<div class="cara-content" id="caraContent">

${game.caraBeli || "Cara Beli & Tips"}

</div>



</div>



</div>







`;



const list =
document.getElementById("productList");



(game.produk||[])
.forEach((p,i)=>{


list.innerHTML+=`


<div class="product"
onclick="pilih(${i})">


<img 
class="product-logo"
src="${p.logo || ''}">


<div class="product-info">


<div class="product-name">

${p.nama}

</div>


<div class="product-price">

Rp ${Number(p.harga)
.toLocaleString("id-ID")}

</div>


</div>


</div>


`;



});



}


window.pilih=(i)=>{


selectedProduct =
game.produk[i];



// hapus active lama
document
.querySelectorAll(".product")
.forEach(x=>{

x.classList.remove("active");

});



// aktifkan yang dipilih
document
.querySelectorAll(".product")[i]
.classList.add("active");



};




async function loadUser(){


const usersid =
localStorage.getItem("usersid");



if(!usersid)
return;



const snap =
await get(
ref(db,"users_topup/"+usersid)
);



if(!snap.exists())
return;



let u=snap.val();



email.value =
u.email || "";

wa.value =
u.whatsapp || "";



}




buyBtn.onclick=()=>{



const usersid =
localStorage.getItem("usersid");



if(!usersid){


showPopup(
"Login Dibutuhkan",
"Silahkan login untuk membeli"
);



popupOk.onclick=()=>{

location.href="login_topup.html";

};


return;


}





if(!selectedProduct){


showPopup(
"Pilih Produk",
"Silahkan pilih produk terlebih dahulu"
);


return;


}




if(!account.value){


showPopup(
"ID Account",
"Masukkan ID account"
);


return;


}





showPopup(
"Konfirmasi",
`
Beli <b>${selectedProduct.nama}</b><br>
Lanjut checkout?
`
);



popupOk.onclick=()=>{


location.href =
"Checkout_game_mobile.html?id="
+ id
+ "&produk="
+ game.produk.indexOf(selectedProduct);


};



};




load();

loadUser();


window.toggleCara=()=>{


const box =
document.getElementById("caraContent");


const head =
document.querySelector(".cara-head");


box.classList.toggle("open");


head.classList.toggle("active");


};
</script>



</body>
</html>
