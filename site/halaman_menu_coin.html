/* =========================================
   BONUS EVENT POPUP
========================================= */

.bonus-popup {
    position: fixed;
    inset: 0;
    z-index: 999999;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition:
        opacity .3s ease,
        visibility .3s ease;
}

.bonus-popup.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}


/* BACKDROP */
.bonus-popup-overlay {
    position: absolute;
    inset: 0;
    background: rgb(255 255 255 / 9%);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(7px);
}


/* CONTENT */
.bonus-popup-content {
    position: relative;
    z-index: 2;

    width: min(920px, 100%);
    max-height: 90vh;

    display: flex;
    align-items: center;
    justify-content: center;

    transform: scale(.92) translateY(10px);
    opacity: 0;

    transition:
        transform .35s cubic-bezier(.2,.8,.2,1),
        opacity .3s ease;
}

.bonus-popup.active .bonus-popup-content {
    transform: scale(1) translateY(0);
    opacity: 1;
}


/* IMAGE */
.bonus-popup-image {
    display: block;

    width: 100%;
    max-width: 920px;
    max-height: 88vh;

    object-fit: contain;

    border-radius: 18px;

    box-shadow:
        0 25px 80px rgba(0,0,0,.55),
        0 0 0 1px rgba(255,255,255,.08);

    user-select: none;
    -webkit-user-drag: none;
}


/* CLOSE BUTTON */
.bonus-popup-close {
    position: absolute;

    top: -15px;
    right: -15px;

    width: 42px;
    height: 42px;

    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;

    background: rgba(15,15,18,.92);
    color: #fff;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 17px;

    cursor: pointer;

    z-index: 5;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);

    transition:
        transform .2s ease,
        background .2s ease;
}

.bonus-popup-close:hover {
    background: #111;
    transform: rotate(90deg) scale(1.05);
}

.bonus-popup-close:active {
    transform: rotate(90deg) scale(.95);
}


/* =========================================

========================================= */

@media (max-width: 600px) {

    }

    .bonus-popup-close {
        width: 38px;
        height: 38px;

        top: -12px;
        right: -5px;

        font-size: 15px;
    }

}

/* =========================================

document.addEventListener("DOMContentLoaded", function () {

    const popup = document.getElementById("bonusEventPopup");
    const closeBtn = document.getElementById("bonusPopupClose");
    const overlay = popup.querySelector(".bonus-popup-overlay");
    const popupImage = document.getElementById("bonusPopupImage");

    /* Tampilkan popup */
    setTimeout(() => {
        popup.classList.add("active");
        document.body.style.overflow = "hidden";
    }, 500);


    /* =========================================
       CLOSE POPUP
    ========================================= */

    function closeBonusPopup() {
        popup.classList.remove("active");
        document.body.style.overflow = "";
    }


    /* Klik tombol X */
    closeBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        closeBonusPopup();
    });


    /* Klik area luar */
    overlay.addEventListener("click", function () {
        closeBonusPopup();
    });


    /* =========================================
       KLIK GAMBAR
       → PENGERTIAN BONUS
    ========================================= */

    popupImage.addEventListener("click", function () {
        window.location.href = "pengertian_bonus.html";
    });


    /* ESC */
    document.addEventListener("keydown", function (e) {

        if (
            e.key === "Escape" &&
            popup.classList.contains("active")
        ) {
            closeBonusPopup();
        }

    });

});

</script>
