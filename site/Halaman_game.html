<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">


<title>Detail Game</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



<style>





*{
-webkit-tap-highlight-color: transparent;
}

button,
a,
img,
div{
-webkit-tap-highlight-color: transparent;
}

body{
user-select:none;
-webkit-user-select:none;
}

img{
-webkit-user-drag:none;
}

input,
textarea,
select{
user-select:text;
-webkit-user-select:text;
}





*{
box-sizing:border-box;
}


body{

margin:0;
background:#f6f6f6;
font-family:Poppins,Arial,sans-serif;

}



.container{

max-width:600px;
margin:auto;
padding-bottom:90px;

}



.card{

background:white;
margin:10px;
border-radius:18px;
padding:14px;

}




.hero img{

width:100%;
height:260px;
object-fit:cover;
border-radius:15px;

}



.title{

font-size:18px;
font-weight:800;
margin-top:12px;

}



.rating{

display:flex;
gap:8px;
align-items:center;
font-size:13px;
color:#666;

}


.star{

color:#ffb000;

}




.price{

font-size:22px;
font-weight:900;
color:#ff4d00;
margin-top:10px;

}




.badge{

display:inline-flex;
background:#eafff0;
color:#00a651;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:700;
}



.info{

display:flex;
justify-content:space-between;
margin-top:12px;
font-size:13px;

}



.item{

display:flex;
gap:6px;
align-items:center;

}



.item img{

width:20px;
height:20px;
object-fit:contain;

}




h3{

font-size:15px;
margin-bottom:8px;

}




p{

font-size:13px;
color:#555;

}



.buy{

position:fixed;
bottom:15px;
left:50%;
transform:translateX(-50%);

width:90%;
max-width:560px;

background:#ff4d00;
color:white;

border:none;
padding:15px;

border-radius:18px;

font-weight:800;
font-size:16px;

}




.loading{

height:500px;

background:

linear-gradient(
90deg,
#eee,
#fafafa,
#eee
);

animation:load 1s infinite;

}



@keyframes load{

0%{opacity:.5}

50%{opacity:1}

100%{opacity:.5}

}








.popup-bg{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}


.popup-box{
width:90%;
max-width:360px;
background:white;
border-radius:22px;
padding:25px;
text-align:center;
}


.popup-box i{
font-size:45px;
color:#ff4d00;
margin-bottom:10px;
}


.popup-box h3{
margin:5px 0;
}


.popup-box p{
font-size:14px;
color:#666;
}


.popup-btn{
width:100%;
border:0;
padding:13px;
border-radius:14px;
background:#ff4d00;
color:white;
font-weight:700;
margin-top:10px;
}


.popup-close{
background:#eee;
color:#333;
}


.secure-list{
display:flex;
flex-direction:column;
gap:14px;
}


.secure-item{
display:flex;
align-items:center;
gap:12px;
background:#fff7f2;
padding:12px;
border-radius:14px;
}


.secure-item i{

width:35px;
height:35px;

display:flex;
align-items:center;
justify-content:center;

border-radius:50%;

background:#ff4d00;
color:white;

font-size:16px;

}



.secure-item b{

font-size:13px;

}



.secure-item p{

margin:3px 0 0;

font-size:11px;

color:#777;

}
</style>


</head>


<body>


<div class="container" id="content">


<div class="card loading"></div>


</div>



<button class="buy" id="buyBtn">

Beli Sekarang

</button>






<script type="module">


import {
initializeApp
}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
get

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",

authDomain:"users-96dc5.firebaseapp.com",

databaseURL:
"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"users-96dc5"


};





const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);





const id =
new URLSearchParams(
location.search
).get("id");





const content =
document.getElementById("content");



let game=null;





async function load(){



const snap =
await get(
ref(db,"Game-top-up/"+id)
);



if(!snap.exists()){

content.innerHTML =
"<div class='card'>Game tidak ditemukan</div>";

return;

}



game={
id:id,
...snap.val()
};





content.innerHTML = `




<div class="card hero">


<img src="${game.thumbnail}">


<div class="title">

${game.nama}

</div>





<div class="rating">


<span class="star">

<i class="fa-solid fa-star"></i>

${game.rating}

</span>


<span>

${game.reviews || "0 reviews"}

</span>


<span>

${game.terjual || 0} terjual

</span>


</div>





<div class="price">


Rp ${Number(game.harga||0)
.toLocaleString("id-ID")}


</div>





<span class="badge">

${game.badge}

</span>




</div>



<div class="card">


<div class="secure-list">


<div class="secure-item">

<i class="fa-solid fa-shield-halved"></i>

<div>

<b>Transaksi Aman dengan Trade Guard</b>

<p>
Perlindungan transaksi untuk keamanan pembelian kamu.
</p>

</div>


</div>





<div class="secure-item">


<i class="fa-solid fa-money-bill-transfer"></i>


<div>

<b>Garansi Uang Kembali</b>

<p>
Jaminan pengembalian dana sesuai ketentuan.
</p>

</div>


</div>







<div class="secure-item">


<i class="fa-solid fa-headset"></i>


<div>

<b>Bantuan Customer Care 24/7</b>

<p>
Tim support siap membantu kapan saja.
</p>

</div>


</div>



</div>


</div>



<div class="card">




<h3>Informasi</h3>



<div class="info">


<div class="item">

<img src="${game.platform.icon}">

${game.platform.name}

</div>



<div class="item">

<img src="${game.region.icon}">

${game.region.name}

</div>



</div>






<div class="info">


<div class="item">

<img src="${game.type.icon}">

${game.type.name}

</div>


<div>

${game.aktivasi}

</div>



</div>



</div>






<div class="card">


<h3>Catatan</h3>


<p>

${game.note}

</p>


</div>







<div class="card">


<h3>${game.caraBeli}</h3>


<p>

${game.deskripsi}

</p>



<h3>

${game.detailEdisi}

</h3>


<p>

${game.promo}

</p>



</div>






<div class="card">


<h3>Verifikasi</h3>


<p>

${game.verified}

</p>


</div>






`;



}





load();





























document
.getElementById("buyBtn")
.onclick=()=>{


const usersid =
localStorage.getItem("usersid");



if(!usersid){


document
.getElementById("loginPopup")
.style.display="flex";


return;

}




if(!game)
return;





document
.getElementById("buyPopup")
.style.display="flex";





document
.getElementById("buyText")
.innerHTML =
`
Beli <b>${game.nama}</b> sekarang?
`;



};






document
.getElementById("goLogin")
.onclick=()=>{


window.location.href =
"login_topup.html";


};







document
.getElementById("closePopup")
.onclick=()=>{


document
.getElementById("loginPopup")
.style.display="none";


};







document
.getElementById("cancelBuy")
.onclick=()=>{


document
.getElementById("buyPopup")
.style.display="none";


};






document
.getElementById("confirmBuy")
.onclick=()=>{


document
.getElementById("buyPopup")
.style.display="none";



window.location.href =
"Checkout_game.html?id="+game.id;



};















// PROTEKSI
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

document.addEventListener("dragstart",e=>{
if(e.target.tagName==="IMG")e.preventDefault();
});

document.addEventListener("keydown",e=>{
if(
(e.ctrlKey&&["s","u","c"].includes(e.key.toLowerCase()))
||e.key==="F12"
)e.preventDefault();
});


let lastTouch=0;

document.addEventListener("touchend",e=>{
let now=Date.now();
if(now-lastTouch<300)e.preventDefault();
lastTouch=now;
},{passive:false});


document.addEventListener("gesturestart",e=>e.preventDefault());
// PROTEKSI




</script>



<div class="popup-bg" id="buyPopup">


<div class="popup-box">


<i class="fa-solid fa-cart-shopping"></i>


<h3>Konfirmasi Pembelian</h3>


<p id="buyText">
</p>



<button class="popup-btn" id="confirmBuy">
Lanjutkan
</button>



<button class="popup-btn popup-close" id="cancelBuy">
Batal
</button>



</div>


</div>


<div class="popup-bg" id="loginPopup">


<div class="popup-box">


<i class="fa-solid fa-user-lock"></i>


<h3>Login Diperlukan</h3>


<p>
Silahkan login terlebih dahulu untuk melakukan pembelian.
</p>



<button class="popup-btn" id="goLogin">
Login Sekarang
</button>



<button class="popup-btn popup-close" id="closePopup">
Nanti
</button>



</div>


</div>
</body>

</html>
