<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dating Apps</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>








body{
    margin:0;
    font-family:'Poppins', sans-serif;
    color:#111;

    background:
        radial-gradient(circle at 10% 20%, rgba(120, 180, 255, 0.25), transparent 35%),
        radial-gradient(circle at 90% 80%, rgba(255, 120, 200, 0.18), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(120, 255, 200, 0.10), transparent 50%),
        #f7f8fc;
}


body{
    -webkit-font-smoothing: antialiased;
}

*{
    box-sizing:border-box;
}











/* HEADER */
.header{
    position:sticky;
    top:0;
    z-index:10;
    background:#0c85ff;
    padding:22px 14px;
    display:flex;
    align-items:center;
    gap:10px;
    border-bottom:1px solid #eee;
    font-weight:800;
    color:#ffffff
}

/* LIST */
#listApps{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:10px;
}

/* ITEM */
.app-item{
    display:flex;
    align-items:center;
    gap:10px;
    background:#fff;
    padding:10px;
    border-radius:12px;
    border:1px solid #eee;
    box-shadow:0 2px 6px rgba(0,0,0,0.04);
    transition:0.15s;
}

.app-item:active{
    transform:scale(0.98);
}

/* ICON */
.app-item img{
    width:44px;
    height:44px;
    border-radius:10px;
    object-fit:cover;
    background:#eee;
}

/* TEXT */
.app-name{
    font-size:13px;
    font-weight:700;
    color:#111;
}

.app-desc{
    font-size:11px;
    color:#0c85ff;
    margin-top:2px;
}














.rekomen365-list{

display:grid;

grid-template-columns:repeat(5,1fr);

gap:12px;
    margin-bottom: 10px;
}



.rekomen365-item{

background:white;

border-radius:16px;

padding:10px;

display:flex;

align-items:center;

gap:10px;

box-shadow:0 5px 20px #0001;

cursor:pointer;

}



.rekomen365-item img{

width:45px;

height:45px;

border-radius:12px;

object-fit:cover;

}



.rekomen365-name{

font-size:13px;

font-weight:800;

}



@media(max-width:768px){


.rekomen365-list{

grid-template-columns:repeat(2,1fr);

}


}



.suka365-list{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:10px;

padding:5px;
    margin-bottom: 40px;

}



.suka365-item{

height:65px;

background:white;

border-radius:14px;

display:flex;

align-items:center;

gap:8px;

padding:10px;

box-shadow:0 5px 15px #0001;

cursor:pointer;

}



.suka365-item img{

width:38px;

height:38px;

border-radius:10px;

object-fit:cover;

}



.suka365-name{

font-size:12px;

font-weight:800;

overflow:hidden;

text-overflow:ellipsis;

white-space:nowrap;

}





/* mobile */

@media(max-width:768px){


.suka365-list{

grid-template-columns:repeat(2,1fr);

}


}


.suka365-title,
.rekomen365-title{

display:inline-flex;

align-items:center;

gap:8px;

background:#0c85ff;

padding:8px 45px 8px 14px;

font-weight:900;

font-size:15px;

color:white;

clip-path:polygon(
0 0,
92% 0,
100% 100%,
0 100%
);

margin-bottom:15px;

margin-left:-16px;

padding-left:28px;

font-family:Poppins,Arial;

}









/*=========================
BANNER MINI 327
==========================*/

#bannermin327Container{

padding:12px;

}

#bannermin327List{

display:flex;
flex-direction:column;
gap:14px;

}

.bannermin327-card{

display:block;


border-radius:22px;

overflow:hidden;


border:1px solid #0c85ff;

transition:.25s;

text-decoration:none;

}

.bannermin327-card:hover{

transform:translateY(-2px);

}

.bannermin327-image{

width:100%;


display:flex;

justify-content:center;

align-items:center;

padding:12px;

}

.bannermin327-image img{

width:100%;

height:100%;

object-fit:contain;

display:block;

}

.bannermin327-footer{

padding:10px 14px;

display:flex;

justify-content:space-between;

align-items:center;

font-size:12px;

color:#777;

border-top:1px solid #ffffff00;

background:#1ea7ff;

}

.bannermin327-go{

font-weight:700;

color:#ffffff;

}

.bannermin327-update{

color:#fff;

font-size:12px;

font-weight:500;

}

/*=========================
LOADING
==========================*/

.bannermin327-loading{

height:145px;

margin-bottom:14px;

border-radius:20px;

background:

linear-gradient(

90deg,

#eee,

#fafafa,

#eee

);

background-size:300% 100%;

animation:bannermin327Load 1s linear infinite;

}

@keyframes bannermin327Load{

0%{

background-position:100% 0;

}

100%{

background-position:-100% 0;

}

}









</style>

</head>
<body>

<!-- HEADER -->
<div class="header">
    Dating Apps
</div>

<!-- LIST -->
<div id="listApps"></div>





















<div class="suka365-box">


<h3 class="suka365-title">
Rekomendasi Pilihan Untuk Kamu
</h3>


<div id="suka365List" class="suka365-list"></div>


</div>



<div class="rekomen365-box">


<h3 class="rekomen365-title">
Aplikasi & Layanan Lainnya
</h3>


<div id="rekomen365List" class="rekomen365-list"></div>


</div>





<!-- =========================
     BANNER MINI 327
========================= -->

<div id="bannermin327Container">

<div id="bannermin327Loading">

<div class="bannermin327-loading"></div>
<div class="bannermin327-loading"></div>
<div class="bannermin327-loading"></div>

</div>

<div id="bannermin327List"></div>

</div>


<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
authDomain:"users-96dc5.firebaseapp.com",
databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId:"users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ELEMENT */
const rekomen365List = document.getElementById("rekomen365List");
const suka365List = document.getElementById("suka365List");
const listApps = document.getElementById("listApps");

const bannermin327Wrap =
document.getElementById("bannermin327List");

const bannermin327Loading =
document.getElementById("bannermin327Loading");

onValue(

ref(db,"Bannermini33"),

(snapshot)=>{

bannermin327Loading.style.display="none";

bannermin327Wrap.innerHTML="";

if(!snapshot.exists()){

bannermin327Wrap.innerHTML=`

<div style="text-align:center;
padding:30px;
color:#888;">

Belum ada banner.

</div>

`;

return;

}

const data=snapshot.val();

Object.keys(data).reverse().forEach(key=>{

const item=data[key];

const a=document.createElement("a");

a.className="bannermin327-card";

a.href=item["Link tujuan"]||"#";

a.target="_blank";

a.innerHTML=`

<div class="bannermin327-image">

<img

src="${item.Bannermini}"

loading="lazy"

alt="Banner"

>

</div>

<div class="bannermin327-footer">

<span class="bannermin327-update">

${item["Diperbaharui oleh"]||""}

</span>

<span class="bannermin327-go">

Buka →

</span>

</div>

`;

bannermin327Wrap.appendChild(a);

});

});























/* =========================
   SUKA APPS
========================= */
const sukaRef = ref(db,"Top-up_aplikasi");

onValue(sukaRef,(snap)=>{

suka365List.innerHTML = "";

snap.forEach((child)=>{

const g = child.val();
const key = child.key;

suka365List.innerHTML += `
<div class="suka365-item" onclick="openSuka365('${key}')">

<img src="${g.logoAplikasi || ""}" onerror="this.style.display='none'">

<div class="suka365-name">
${g.nama || g.aplikasi || key}
</div>

</div>
`;

});

});

window.openSuka365 = (key)=>{
location.href = `halaman_menu_coin.html?app=${encodeURIComponent(key)}`;
};


/* =========================
   MOBILE + REKOMENDASI
========================= */
const mobileRef = ref(db,"Top-up game-Mobile");

onValue(mobileRef,(snap)=>{

let arr = [];

snap.forEach((child)=>{
arr.push({id:child.key,...child.val()});
});

renderRekomen365(arr);

});


/* =========================
   REKOMENDASI
========================= */
function renderRekomen365(data){

rekomen365List.innerHTML = "";

data.forEach(g=>{

const id = g.id;

rekomen365List.innerHTML += `
<div class="rekomen365-item" onclick="openRekomen365('${id}')">

<img src="${g.thumbnail || ""}">

<div class="rekomen365-name">
${
    (g.nama || "-")
    .split(" ")
    .slice(0,5)
    .join(" ")
    +
    ((g.nama || "").split(" ").length > 5 ? "..." : "")
}
</div>

</div>
`;

});

}

window.openRekomen365 = (id)=>{
location.href = "Halaman_mobile.html?id=" + id;
};


/* =========================
   APPS LIST (FIX UTAMA)
========================= */
const appsRef = ref(db,"Top-up_aplikasi");

onValue(appsRef,(snap)=>{

listApps.innerHTML = "";

snap.forEach(child=>{

const g = child.val();
const key = child.key;

listApps.innerHTML += `
<div class="app-item" onclick="openApp('${key}')">

<img src="${g.logoAplikasi || ''}" onerror="this.style.display='none'">

<div>
    <div class="app-name">
        ${g.nama || g.aplikasi || key}
    </div>

    <div class="app-desc">
        ${limitWords(g.deskripsi)}
    </div>
</div>

</div>
`;

});

});

window.openApp = (key)=>{
location.href = "halaman_menu_coin.html?app=" + encodeURIComponent(key);
};


/* =========================
   LIMIT WORDS
========================= */
function limitWords(text, maxWords = 20){
    if(!text) return "Aplikasi";

    const words = text.split(" ");

    if(words.length <= maxWords){
        return text;
    }

    return words.slice(0, maxWords).join(" ") + "...";
}

</script>

</body>
</html>
