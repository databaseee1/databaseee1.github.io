<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">


<title>Checkout Game</title>


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



<style>


*{
box-sizing:border-box;
}


body{

margin:0;
background:#f6f6f6;
font-family:Poppins,Arial;

}



.container{

max-width:600px;
margin:auto;
padding:15px;
padding-bottom:40px;

}



.card{

background:white;
border-radius:20px;
padding:15px;
margin-bottom:12px;

}



.loading{

height:400px;

background:
linear-gradient(
90deg,
#eee,
#fafafa,
#eee
);

animation:load 1s infinite;

}



@keyframes load{

0%{
opacity:.5;
}

50%{
opacity:1;
}

100%{
opacity:.5;
}

}




.product{

display:flex;
gap:12px;

}



.product img{

width:90px;
height:90px;
border-radius:15px;
object-fit:cover;

}



.name{

font-size:15px;
font-weight:800;

}



.price{

color:#ff4d00;
font-size:20px;
font-weight:900;
margin-top:8px;

}




.info{

display:flex;
justify-content:space-between;
margin-top:10px;

font-size:13px;

}



.item{

display:flex;
align-items:center;
gap:6px;

}



.item img{

width:22px;
height:22px;
object-fit:contain;

}





.warning{

text-align:center;
padding:25px;

}



.warning i{

font-size:55px;
color:#ff4d00;

}



.warning h3{

font-size:17px;

}



.warning p{

font-size:13px;
color:#666;

}




.back{

width:100%;
border:0;
padding:14px;
border-radius:15px;

background:#a8a8a8;
color:white;

font-weight:800;

}


.profile-checkout{

width:70px;
height:70px;
border-radius:50%;
object-fit:cover;
margin-bottom:10px;

}

</style>


</head>



<body>


<div class="container" id="content">


<div class="card loading"></div>


</div>






<script type="module">


import {
initializeApp
}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getDatabase,
ref,
get

}

from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";





const firebaseConfig={


apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",

authDomain:"users-96dc5.firebaseapp.com",

databaseURL:
"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"users-96dc5"


};





const app =
initializeApp(firebaseConfig);


const db =
getDatabase(app);





const content =
document.getElementById("content");





const id =
new URLSearchParams(
location.search
).get("id");


async function loadProfile(){


const usersid =
localStorage.getItem("usersid");



if(!usersid)
return;



const snap =
await get(
ref(
db,
"users_topup/"+usersid
)
);



if(!snap.exists())
return;



const user =
snap.val();



document
.getElementById("userProfileCheckout")
.src =
user.profil ||
"https://cdn-icons-png.flaticon.com/512/149/149071.png";



}













let game=null;







async function load(){



const snap =
await get(
ref(
db,
"Game-top-up/"+id
)
);




if(!snap.exists()){


content.innerHTML=
`

<div class="card">

Game tidak ditemukan

</div>

`;

return;

}



game=snap.val();




// semua data tersimpan
console.log(
"Checkout Data",
game
);






content.innerHTML = `




<div class="card">


<div class="product">


<img src="${game.thumbnail}">


<div>


<div class="name">

${game.nama}

</div>



<div class="price">


Rp ${Number(game.harga||0)
.toLocaleString("id-ID")}


</div>



</div>


</div>


</div>







<div class="card">


<div class="info">


<div class="item">


<img src="${game.platform.icon}">


${game.platform.name}


</div>




<div class="item">


<img src="${game.region.icon}">


${game.region.name}


</div>



</div>




<div class="info">


<div class="item">


<img src="${game.type.icon}">


${game.type.name}


</div>


<span>

${game.terjual || 0} terjual

</span>


</div>



</div>







<div class="card warning">

<img id="userProfileCheckout"
src=""
class="profile-checkout">



<h3>

Akun kamu belum memenuhi syarat

</h3>



<p>

Akun kamu belum memenuhi syarat untuk membeli item 
<b>${game.platform.name}</b>.

</p>




<button class="back" onclick="history.back()">

Kembali

</button>



</div>







`;


loadProfile();
}



load();



</script>



</body>


</html>
