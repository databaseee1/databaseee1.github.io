
<!DOCTYPE html>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}



.show-notif{

position:fixed;

top:20px;

left:50%;

transform:translateX(-50%) translateY(-100px);

opacity:0;

transition:.35s;

z-index:999999;

pointer-events:none;

}

.show-notif.show{

transform:translateX(-50%) translateY(0);

opacity:1;

}

.show-notif-box{

display:flex;

align-items:center;

gap:12px;

padding:14px 18px;

background:white;

border-radius:16px;

box-shadow:
0 10px 30px rgba(0,0,0,.15);

min-width:270px;

font-family:Poppins,sans-serif;

}

.show-notif-icon{

width:38px;

height:38px;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-size:18px;

background:#0c85ff;

color:white;

}

.show-notif-text{

font-size:14px;

font-weight:600;

color:#222;

}

.show-notif.success .show-notif-icon{

background:#16a34a;

}

.show-notif.error .show-notif-icon{

background:#ef4444;

}

.show-notif.warning .show-notif-icon{

background:#f59e0b;

}

    min-height:100vh;
    font-family:'Poppins',sans-serif;

    background-image:

    linear-gradient(45deg,

    transparent 25%,
    transparent 75%,
    rgba(255,255,255,.03) 75%),

    linear-gradient(-45deg,
    rgba(255,255,255,.03) 25%,
    transparent 25%,
    transparent 75%,
    rgba(255,255,255,.03) 75%);

    background-size:40px 40px;

    color:#fff;
}

.btn{

.footer{

    margin-top:50px;

    background:#ffffff00;

    border-top:1px solid #e8e8e8;
border-radius: 10px;
    padding:25px 18px;

}

.footer-links{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    gap:12px;

}

.footer-links a{

    text-decoration:none;

    color:#555;

    font-size:13px;

    font-weight:500;

}

.footer-links a:hover{

}

.footer-copy{

    margin-top:18px;

    text-align:center;

</style>
</head>
<body>

<div class="card">

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const redirect =
new URLSearchParams(location.search)
.get("redirect");

document
.getElementById("btnLogin")
.onclick = async ()=>{

    const email =
    document.getElementById("email")
    .value.trim();

    const password =
    document.getElementById("password")
    .value.trim();

    if(!email){
        showNotif("Email wajib diisi.","warning");
        return;
    }

    if(!password){
        showNotif("Password wajib diisi.","warning");
        return;
    }

    try{

        const snap =
        await get(
            ref(db,"users_topup")
        );

        if(!snap.exists()){
            showNotif("Akun tidak ditemukan.","error");
            return;
        }

        const users = snap.val();

        let user = null;

        Object.values(users)
        .forEach(u=>{

            if(
                u.email === email &&
                u.password === password
            ){
                user = u;
            }

        });

        if(!user){
            showNotif("Email atau password salah.","error");
            return;
        }

        localStorage.setItem(
            "usersid",
            user.usersid
        );

        localStorage.setItem(
            "user_topup",
            JSON.stringify(user)
        );

        showNotif("Login berhasil.","success");

        if(redirect){
            location.href =
            decodeURIComponent(
                redirect
            );
        }else{
            location.href =
            "beranda.html";
        }

    }catch(err){

        console.error(err);
        showNotif(err.message,"error");

    }

};












function showNotif(text,type="success"){

const notif =
document.getElementById("showNotif");

const icon =
document.getElementById("showNotifIcon");

const txt =
document.getElementById("showNotifText");

txt.textContent=text;

notif.className="show-notif "+type+" show";

if(type==="success"){

icon.innerHTML=
'<i class="fa-solid fa-check"></i>';

}

else if(type==="error"){

icon.innerHTML=
'<i class="fa-solid fa-xmark"></i>';

}

else{

icon.innerHTML=
'<i class="fa-solid fa-circle-info"></i>';

}

clearTimeout(window.notifTimer);

window.notifTimer=setTimeout(()=>{

notif.classList.remove("show");

},2500);

}


















// PROTEKSI
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

document.addEventListener("dragstart",e=>{
if(e.target.tagName==="IMG")e.preventDefault();
});

document.addEventListener("keydown",e=>{
if(
(e.ctrlKey&&["s","u","c"].includes(e.key.toLowerCase()))
||e.key==="F12"
)e.preventDefault();
});


let lastTouch=0;

document.addEventListener("touchend",e=>{
let now=Date.now();
if(now-lastTouch<300)e.preventDefault();
lastTouch=now;
},{passive:false});


document.addEventListener("gesturestart",e=>e.preventDefault());
// PROTEKSI



</script>




<div id="showNotif" class="show-notif">

    <div class="show-notif-box">

        <div id="showNotifIcon" class="show-notif-icon">
            <i class="fa-solid fa-circle-info"></i>
        </div>

        <div id="showNotifText" class="show-notif-text">
            Pesan
        </div>

    </div>

</div>
