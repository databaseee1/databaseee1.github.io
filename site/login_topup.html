
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Akun Top Up</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>





*{
-webkit-tap-highlight-color: transparent;
}

button,
a,
img,
div{
-webkit-tap-highlight-color: transparent;
}

body{
user-select:none;
-webkit-user-select:none;
}

img{
-webkit-user-drag:none;
}

input,
textarea,
select{
user-select:text;
-webkit-user-select:text;
}





*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins,sans-serif;
}

body{
    background:#f5f6fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:450px;
    background:#fff;
    border-radius:25px;
    padding:35px;
    box-shadow:0 10px 40px rgba(0,0,0,.08);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo img{
    width:90px;
    height:90px;
    border-radius:25px;
    object-fit:cover;
}

.logo h2{
    margin-top:15px;
    color:#5c27fe;
    font-size:25px;
}

.logo p{
    color:#777;
    margin-top:8px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
    color:#555;
}

.form-group input{
    width:100%;
    border:1px solid #ddd;
    border-radius:14px;
    padding:15px;
    outline:none;
    font-size:15px;
}

.form-group input:focus{
    border-color:#5c27fe;
}

.btn{
    width:100%;
    border:none;
    background:#5c27fe;
    color:#fff;
    padding:16px;
    border-radius:15px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    margin-top:10px;
}

.btn:hover{
    opacity:.9;
}

.register{
    text-align:center;
    margin-top:20px;
    color:#777;
}

.register a{
    color:#5c27fe;
    text-decoration:none;
    font-weight:600;
}
</style>
</head>
<body>

<div class="card">

    <div class="logo">
        <img src="https://res.cloudinary.com/dowoq4a0i/image/upload/v1782573190/vqp0oxzbjiwwmvpbn9yl.jpg">

        <h2>Login Akun Top Up</h2>

        <p>
            Masuk untuk melanjutkan pembelian coin.
        </p>
    </div>

    <div class="form-group">
        <label>Email</label>
        <input
            type="email"
            id="email"
            placeholder="Masukkan email">
    </div>

    <div class="form-group">
        <label>Password</label>
        <input
            type="password"
            id="password"
            placeholder="Masukkan password">
    </div>

    <button
        class="btn"
        id="btnLogin">
        Login Sekarang
    </button>

    <div class="register">
        Belum punya akun?
        <a href="register_topup.html">
            Daftar Sekarang
        </a>
    </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    get
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const redirect =
new URLSearchParams(location.search)
.get("redirect");

document
.getElementById("btnLogin")
.onclick = async ()=>{

    const email =
    document.getElementById("email")
    .value.trim();

    const password =
    document.getElementById("password")
    .value.trim();

    if(!email){
        alert("Email wajib diisi.");
        return;
    }

    if(!password){
        alert("Password wajib diisi.");
        return;
    }

    try{

        const snap =
        await get(
            ref(db,"users_topup")
        );

        if(!snap.exists()){
            alert("Akun tidak ditemukan.");
            return;
        }

        const users = snap.val();

        let user = null;

        Object.values(users)
        .forEach(u=>{

            if(
                u.email === email &&
                u.password === password
            ){
                user = u;
            }

        });

        if(!user){
            alert(
                "Email atau password salah."
            );
            return;
        }

        localStorage.setItem(
            "usersid",
            user.usersid
        );

        localStorage.setItem(
            "user_topup",
            JSON.stringify(user)
        );

        alert(
            "Login berhasil."
        );

        if(redirect){
            location.href =
            decodeURIComponent(
                redirect
            );
        }else{
            location.href =
            "beranda.html";
        }

    }catch(err){

        console.error(err);
        alert(err.message);

    }

};







// PROTEKSI
document.addEventListener("contextmenu",e=>e.preventDefault());
document.addEventListener("copy",e=>e.preventDefault());
document.addEventListener("cut",e=>e.preventDefault());
document.addEventListener("selectstart",e=>e.preventDefault());

document.addEventListener("dragstart",e=>{
if(e.target.tagName==="IMG")e.preventDefault();
});

document.addEventListener("keydown",e=>{
if(
(e.ctrlKey&&["s","u","c"].includes(e.key.toLowerCase()))
||e.key==="F12"
)e.preventDefault();
});


let lastTouch=0;

document.addEventListener("touchend",e=>{
let now=Date.now();
if(now-lastTouch<300)e.preventDefault();
lastTouch=now;
},{passive:false});


document.addEventListener("gesturestart",e=>e.preventDefault());
// PROTEKSI



</script>

</body>
</html>
