const firebaseConfig={

async function loadAll(){

}


const data=snap.val();

let html="";


Object.entries(data).reverse().forEach(

([uid,user])=>{

Object.entries(user).reverse().forEach(

([id,item])=>{

html+=`

<div class="card">

}">

<img
class="logo"
src="${
item.logoAplikasi ||

}">

<div class="flex">

<div class="title">

${item.aplikasi ||

"-"}

</div>

<div class="subtitle">

${item.email || "-"}

</div>

</div>

</div>


<div class="row">

<div class="label">

</div>

<div class="value">

${item.namaAkun ||
"-"}

</div>

</div>


<div class="row">

<div class="label">
ID Akun
</div>

<div class="value">

${item.idAkun ||
"-"}

</div>

</div>


<div class="row">

<div class="label">
Paket
</div>

<div class="value">

${item.paket ||
item.itemNama ||
"-"}

</div>

</div>


<div class="row">

<div class="label">

</div>

<div class="value">

${item.namaBank ||
"-"}

</div>

</div>


<div class="row">

<div class="label">
Total
</div>

<div class="total">

Rp ${Number(
item.total || 0
).toLocaleString("id-ID")}

</div>

</div>


<div class="row">

<div class="label">
Status
</div>

<div>

<span class="badge ${item.status}">

${item.status}

</span>

</div>

</div>


<div class="actions">

<button
class="btn approve"
onclick="approve('${uid}','${id}')">

Approve

</button>

<button

onclick="pending('${uid}','${id}')">

listEl.innerHTML=html;

async function updateNotifStatus(uid, orderId, status){

    // kalau tidak ada orderId jangan update apa pun
    if(!orderId) return;

    const snap = await get(
        ref(db, `notifications/${uid}`)
    );

    if(!snap.exists()) return;

    const updates = {};

    snap.forEach(child=>{

        const n = child.val();

        if(
            n.orderId &&
            n.orderId === orderId
        ){

            updates[`${child.key}/status`] = status;

        }

    });

    if(Object.keys(updates).length){

        await update(
            ref(db, `notifications/${uid}`),
            updates
        );

    }

}







/* ==========================================
   APPROVE
========================================== */

window.approve = async(uid,id)=>{

const ok=confirm(
"Approve transaksi ini?"
);

if(!ok) return;

const itemSnap=
await get(
ref(db,`History_Topup/${uid}/${id}`)
);

if(!itemSnap.exists()) return;

const item=itemSnap.val();

await update(
ref(db,`History_Topup/${uid}/${id}`),
{
status:"Sukses"
}
);



await updateNotifStatus(
    uid,
    item.orderId,
    "Sukses"
);









/* jika memiliki order utama */
if(item.orderId){

const orderRef=
ref(
db,
`Histori_top-up_mobile/${item.orderId}`
);

const orderSnap=
await get(orderRef);

if(orderSnap.exists()){

await update(
orderRef,
{
status:"Sukses"
}
);

}

}


await sendNotif(
uid,
"Sukses",
item
);

alert("Transaksi berhasil di Approve");

loadAll();

};

   PENDING
========================================== */

const orderRef=
ref(
db,
`Histori_top-up_mobile/${item.orderId}`

`Histori_top-up_mobile/${item.orderId}`
);

if(orderSnap.exists()){

/* ==========================================
   HAPUS
========================================== */

window.hapus=async(uid,id)=>{

const ok=confirm(
"Yakin ingin menghapus transaksi ini?\n\nData tidak bisa dikembalikan."
);

if(!ok) return;


const itemSnap=
await get(
ref(db,`History_Topup/${uid}/${id}`)
);

if(!itemSnap.exists()) return;

const item=itemSnap.val();


await remove(
ref(
db,
`History_Topup/${uid}/${id}`
)
);


/* hapus order utama jika ada */

if(item.orderId){

const orderRef=
ref(
db,
`Histori_top-up_mobile/${item.orderId}`
);

const orderSnap=
await get(orderRef);

if(orderSnap.exists()){

await remove(orderRef);

}

}


/* kirim notif */

await sendNotif(
uid,
"Hapus",
item
);


alert(
"Transaksi berhasil dihapus."
);

loadAll();

};


/* ==========================================
   KIRIM NOTIFIKASI LENGKAP
========================================== */

async function sendNotif(uid,type,item){

let message="";
let status=item.status||"-";

switch(type){

case "Sukses":

message=
`Hai ${item.email || "User"}, pembayaran kamu telah berhasil diverifikasi. Coin/produk akan segera diproses ke akun tujuan.`;

status="Sukses";

break;

case "Pending":

message=
`Hai ${item.email || "User"}, pembayaran kamu sedang menunggu proses verifikasi admin. Mohon tunggu beberapa saat.`;

status="Menunggu Pembayaran";

break;

case "Gagal":

message=
`Hai ${item.email || "User"}, pembayaran kamu ditolak. Silakan periksa kembali bukti transfer dan data pembayaran kamu.`;

status="Gagal";

break;

case "Hapus":

message=
`Riwayat transaksi ini telah dihapus oleh Admin.`;

status="Dihapus";

break;

default:

message="Status transaksi diperbarui.";

}


/* ==========================
   SIMPAN NOTIFIKASI
========================== */

await set(

ref(
db,
`notifications/${uid}/${Date.now()}`
),

{

type:"topup_info",

message:message,

read:false,

createdAt:Date.now(),


/* STATUS */

status:status,


/* USER */

userId:item.usersid || uid,

email:item.email || "-",

profil:item.profil || "",


/* ORDER */

orderId:item.orderId || "",


/* APLIKASI */

aplikasi:
item.aplikasi ||
item.produk ||
"-",

logoAplikasi:
item.logoAplikasi ||
item.produkThumbnail ||
"",


/* PRODUK */

produk:{

id:
item.idProduk ||
item.produk?.id ||
"",

nama:
item.aplikasi ||
item.produk ||
"-",

thumbnail:
item.logoAplikasi ||
item.produkThumbnail ||
""

},


/* ITEM */

item:{

nama:
item.paket ||
item.itemNama ||
item.item?.nama ||
"-",

harga:Number(

item.total ||

item.itemHarga ||

item.item?.harga ||

0

)

},


/* TOTAL */

total:Number(

item.total ||

item.itemHarga ||

item.item?.harga ||

0

),


/* PEMBAYARAN */

payment:{

id:
item.metode || "",

namaBank:
item.namaBank || "-",

namaRekening:
item.namaRekening || "-",

noRekening:
item.noRekening || "-",

logo:
item.logoBank || ""

},


/* FIELD AGAR COMPATIBLE
   DENGAN POPUP LAMA */

namaBank:
item.namaBank || "-",

namaRekening:
item.namaRekening || "-",

noRekening:
item.noRekening || "-",

logoBank:
item.logoBank || "",

produkThumbnail:
item.logoAplikasi ||
item.produkThumbnail ||
"",

itemNama:
item.paket ||
item.itemNama ||
item.item?.nama ||
"-",

itemHarga:Number(

item.total ||

item.itemHarga ||

item.item?.harga ||

0

),


/* ORDER DATA LENGKAP */

orderData:item

}

);

}


/* ==========================================
   FORMAT RUPIAH
========================================== */

function rupiah(x){

return Number(
x || 0
).toLocaleString("id-ID");

}


/* ==========================================
   FORMAT TANGGAL
========================================== */

function waktu(x){

return new Date(
x
).toLocaleString("id-ID");

}
