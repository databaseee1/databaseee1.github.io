import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

  getDatabase,
  ref,
  set,
  get
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* FIREBASE */
const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const key = "syarat&ketentuan";

/* DUMMY DATA (AUTO INSERT SEKALI SAJA) */
const dummyText = `
SYARAT & KETENTUAN PENGGUNAAN AGENCY

1. KEANGGOTAAN
Pengguna yang mendaftar sebagai agency wajib memberikan data yang benar, valid, dan dapat dipertanggungjawabkan.

2. VERIFIKASI AKUN
Setiap akun akan melalui proses verifikasi sistem untuk memastikan keaslian data sebelum dapat digunakan secara penuh.

3. SISTEM PENDAPATAN
Pendapatan agency dihitung berdasarkan aktivitas referral dan validasi sistem. Semua perhitungan bersifat otomatis dan final.

4. VALIDASI REFERRAL
Hanya referral yang terverifikasi oleh sistem yang akan dihitung sebagai aktivitas sah dalam perolehan bonus.

5. PELANGGARAN SISTEM
Segala bentuk kecurangan, spam referral, atau manipulasi sistem akan menyebabkan akun dibekukan tanpa pemberitahuan.

6. KEAMANAN AKUN
Pengguna bertanggung jawab penuh atas keamanan akun, termasuk password, email, dan data login lainnya.

7. TANGGUNG JAWAB PENGGUNA
Setiap agency bertanggung jawab penuh atas seluruh aktivitas akun yang dilakukan menggunakan kredensial miliknya. Pihak sistem tidak bertanggung jawab atas kehilangan akses, penyalahgunaan akun, maupun ketidaklanjutan akun apabila akun tersebut sudah tidak valid, terindikasi pelanggaran, atau telah diblokir oleh pihak sistem maupun pihak agency terkait. Segala risiko yang timbul akibat kelalaian pengguna dalam menjaga keamanan akun menjadi tanggung jawab pengguna sepenuhnya.

8. KEBIJAKAN PEMBLOKIRAN
Sistem berhak melakukan pemblokiran akun apabila ditemukan aktivitas mencurigakan atau pelanggaran terhadap ketentuan yang berlaku.

9. PERUBAHAN KETENTUAN
Pihak sistem berhak mengubah syarat & ketentuan kapan saja untuk meningkatkan kualitas layanan tanpa pemberitahuan sebelumnya.

10. PEMBAYARAN & BONUS
Bonus akan diberikan sesuai ketentuan sistem yang berlaku dan dapat berubah sewaktu-waktu tanpa pemberitahuan.

11. PENUNDAAN PEMBAYARAN
Sistem berhak menunda pembayaran jika ditemukan indikasi pelanggaran atau verifikasi tambahan.

12. KEABSAHAN DATA
Data yang tidak valid atau palsu akan menyebabkan pembatalan hak agency tanpa kompensasi.

13. PENGGUNAAN SISTEM
Sistem hanya boleh digunakan untuk tujuan yang sah sesuai dengan aturan platform.

14. KETERBATASAN TANGGUNG JAWAB SISTEM
Sistem tidak bertanggung jawab atas kerugian yang timbul akibat penggunaan layanan oleh pengguna.

15. AKTIVITAS ILEGAL
Segala bentuk aktivitas ilegal akan langsung menyebabkan akun dibekukan permanen.

16. KETENTUAN BONUS TAMBAHAN
Bonus tambahan hanya berlaku pada event tertentu yang diumumkan secara resmi oleh sistem.

17. AKTIVITAS GANDA
Penggunaan lebih dari satu akun oleh satu individu dapat menyebabkan seluruh akun diblokir.

18. PEMULIHAN AKUN
Pemulihan akun hanya dapat dilakukan melalui proses verifikasi resmi.

19. KEPUTUSAN SISTEM
Semua keputusan sistem bersifat final dan tidak dapat diganggu gugat.

20. PENUTUP
Dengan menggunakan layanan ini, pengguna dianggap telah membaca, memahami, dan menyetujui seluruh syarat & ketentuan yang berlaku.
`;

async function loadData(){

  const snap = await get(ref(db, key));

  if(!snap.exists()){
    await set(ref(db, key), dummyText);
    document.getElementById("content").innerHTML = formatText(dummyText);
  } else {
    document.getElementById("content").innerHTML = formatText(snap.val());
  }
}

/* FORMAT RAPI + BOX AUTO */
function formatText(text){

  let lines = text.split("\n");
  let html = "";

  lines.forEach(line => {

    line = line.trim();

    if(line === ""){
      html += "<br>";
      return;
    }

    /* BOX UNTUK JUDUL BESAR */
    if(line.includes("SYARAT") || line.includes("KEANGGOTAAN")){
      html += `<div class="box"><b>${line}</b></div>`;
    }
    else if(/^\d+\./.test(line)){
      html += `<div style="margin-top:8px;"><b>${line}</b></div>`;
    }
    else{
      html += `<div>${line}</div>`;
    }

  });

  return html;
}

loadData();
