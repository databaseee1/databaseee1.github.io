<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Isi Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  outline: none !important;
}

/* hilangkan highlight saat klik/focus */
button, a, div, span, img {
  outline: none !important;
}


img {

  -webkit-user-drag: none;
  user-select: none;
}



* {
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}




html,
body,
input,
button,
textarea,
select{
  font-family:'Poppins',sans-serif;
}

body{
  background:#ffffff;
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
.header{
  position:sticky;
  top:0;
  z-index:100;
  background:#fff;
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.header-title{
  font-size:17px;
  font-weight:600;
  color:#222;
}

.header-back{
  position:absolute;
  left:15px;
  width:22px;
  height:22px;
  cursor:pointer;
}

.header-right{
  position:absolute;
  right:15px;
  width:22px;
  height:22px;
  object-fit:contain;
  cursor:pointer;
}








.chat-row{
  display:flex;
  align-items:flex-start;
  margin:10px 0;
  gap:8px;
}

.chat-row.me{
  justify-content:flex-end;
}

.chat-avatar{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  flex-shrink:0;
  align-self:flex-start;
}


/* CHAT BOX */
.chat-box{
  flex:1;
  overflow-y:auto;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* BUBBLE */
.msg{
  max-width:70%;
  padding:10px 12px;
  border-radius:12px;
  font-size:13px;
  word-wrap:break-word;
}

.left{
  background:#eeeeee;
      align-self: flex-end;
    border-radius: 8px;
    border-top-left-radius: 1px;
    position: relative;
    top: -1px;
}

.right{
  background:#a51dff;
  color:#fff;
  align-self:flex-end;
  border-radius:8px;
  border-top-right-radius:1px;

  position:relative;
  top:1px;
}
/* INPUT */
.input-box{
  display:flex;
  padding:10px;
  background:#fff;
}

.input-box input{
  flex:1;
  padding:10px;
  border:1px solid #ffffff;
  border-radius:20px;
  outline:none;
  background: #ececec;
}

.input-box button{
  padding:1px 5px;
  border:none;
  border-radius:20px;
  color:#fff;
  font-weight:600;
}


.bottom-icons{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 45px;
  background:#fff;

  transform:translateX(-20px);
  margin-bottom:80px;
}

.bottom-icon{
  width:35px;
  height:35px;
  object-fit:contain;
  cursor:pointer;
}

.send-btn{
  background:none;
  border:none;
  padding:0;
  cursor:pointer;
}

.send-btn img{
  width:45px;
  height:45px;
  object-fit:contain;
  display:block;
}



.more-menu{
  position:absolute;
  top:50px;
  right:5px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  min-width:190px;
  display:none;
  overflow:hidden;
  z-index:9999;
}

.menu-item{
  padding:12px 15px;
  font-family:'Poppins',sans-serif;
  font-size:14px;
  cursor:pointer;
  background: #f1f1f1;
}










.gift-name{
  margin-top:6px;
  font-size:12px;
  font-weight:600;
  color:#333;
  text-align:center;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}


.gift-sheet{
  position:fixed;
  left:0;
  bottom:0;
  width:100%;
  height:49%;
  background:#fff;
  border-radius:18px 18px 0 0;
  z-index:999999;

  transform: translateY(100%);
  transition: transform 0.3s ease;
  will-change: transform;
}

.gift-sheet.show{
  transform: translateY(0%);
  background: #fbfbfb;
}

.gift-header{
  display:flex;
  justify-content:center;
  margin-bottom:10px;
}

.gift-header .line{
  width:50px;
  height:5px;
  background:#ccc;
  border-radius:20px;
}

.gift-list{
  display:grid;
  grid-template-rows:repeat(3, auto); 
  grid-auto-flow:column;             
  grid-auto-columns:90px;           
  gap:1px;
  overflow-x:auto;
  overflow-y:hidden;

  padding:10px;

  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
}


.gift-list::-webkit-scrollbar{
  display:none;
}


.gift-item{
  width:80px;
  height:80px;

  background:#ffffff;
  border-radius:12px;

  padding:10px;
  text-align:center;

  cursor:pointer;
}




.gift-item > img{
  width:40px;
  height:40px;
  object-fit:contain;
}

.gift-price{
  margin-top:5px;
  font-size:11px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:1px;
}



.tokengamgam{
  width:16px !important;
  height:16px !important;
  object-fit:contain;
  vertical-align:middle;
  margin-right:3px;
}






.gift-notif{
  position:fixed;
  top:40px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  z-index:99999999;
}


.gift-notif.show{
  display:block;
}


.gift-notif-box{
  background:#fd3e3e;
  border-radius:9px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  gap:10px;
  animation:slideDown .25s ease;
}


.gift-notif-box img{
  width:25px;
  height:25px;
  object-fit:contain;
}


.gift-notif-box span{
  font-size:13px;
  font-weight:600;
  color:#ffffff;
  white-space:nowrap;
}





#uploadLoading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999999;
}


.loader{
  width:35px;
  height:35px;
  border:4px solid #eee;
  border-top:4px solid #8a00ff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}


@keyframes spin{
 from{
  transform:rotate(0deg);
 }
 to{
  transform:rotate(360deg);
 }
}


.status-tag{
  display:inline-flex;
  align-items:center;
  justify-content:center;

  margin-left:6px;
  padding:2px 8px;
  background:#ff3b30;
  color:#fff;
  border-radius:4px;
  font-size:7px;
  font-weight:500;
  font-family:'Poppins',sans-serif;

  text-transform:uppercase;
  letter-spacing:.3px;

  line-height:1.4;
}




.emoji{
  display:inline-block;
  font-size:24px;
  cursor:pointer;
  padding:4px;
  border-radius:6px;
}

.emoji:hover{
  background:#f1f1f1;
}



#emojiBox{
  display:none;

  position:absolute;
  bottom:70px;
  left:10px;

  width:320px;
  height:220px;

  background:#fff;
  border-radius:16px;
  padding:10px;

  box-shadow:0 2px 15px rgba(0,0,0,.15);

  overflow-y:auto;

  grid-template-columns:repeat(7,1fr);
  gap:4px;

  z-index:999;
}

.emoji{
  display:flex;
  align-items:center;
  justify-content:center;

  width:36px;
  height:36px;

  font-size:24px;
  cursor:pointer;

  border-radius:8px;
}

.emoji:hover{
  background:#f3f3f3;
}

.gift-chat{
  text-align:center;
  padding:10px;
  min-width:120px;
}

.gift-chat-img{
  width:90px;
  height:90px;
  object-fit:contain;
}

.gift-chat-name{
  margin-top:5px;
  font-size:13px;
  font-weight:600;
}

.gift-chat-price{
  margin-top:3px;
  font-size:12px;
  color:#ff9800;
  font-weight:700;
}



.gift-footer{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:12px 16px;
  border-top:1px solid rgba(255,255,255,.1);
}


.gift-token-box{
  display:flex;
  align-items:center;
  gap:8px;
}

.gift-footer-icon{
  width:30px;
  height:30px;
  object-fit:contain;
}

.gift-token-total{
  font-size:16px;
  font-weight:600;
  color:#000000;
}


.gift-buy-btn{
  border:none;
  padding:5px 25px;
  border-radius:30px;

  background:#8200d8;
  color:#fff;

  font-size:14px;
  font-weight:600;

  cursor:pointer;
}




#Giftpopup89_overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:99999999;
}


#Giftpopup89_box{
  width:280px;
  background:#fff;
  border-radius:18px;
  padding:20px;
  text-align:center;
  font-family:'Poppins',sans-serif;
}


#Giftpopup89_title{
  font-size:17px;
  font-weight:600;
  margin-bottom:12px;
}


#Giftpopup89_text{
  font-size:13px;
  color:#555;
  line-height:1.5;
  margin-bottom:20px;
}


#Giftpopup89_buttons{
  display:flex;
  gap:10px;
}


#Giftpopup89_cancel,
#Giftpopup89_ok{

  flex:1;
  border:none;
  padding:10px;
  border-radius:12px;
  font-family:'Poppins',sans-serif;
  cursor:pointer;

}


#Giftpopup89_cancel{
  background:#eee;
}


#Giftpopup89_ok{
  background:#a51dff;
  color:#fff;
}



#Giftpopup89_toast{

  position:fixed;
  top:30px;
  left:50%;
  transform:translateX(-50%) translateY(-20px);

  background:#333;
  color:#fff;

  padding:12px 20px;
  border-radius:20px;

  font-family:'Poppins',sans-serif;
  font-size:13px;

  opacity:0;
  pointer-events:none;

  transition:.25s ease;

  z-index:999999999;

}


#Giftpopup89_toast.Giftpopup89_show{

  opacity:1;
  transform:translateX(-50%) translateY(0);

}
</style>

 <img src="msg_icon_more_dot.png"

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase,
  ref,
  onValue,
  push,
  get,
  update,
  set
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);




/* ================= LOGIN ================= */
const login = JSON.parse(localStorage.getItem("user"));
if (!login) window.location.href = "login.html";





onValue(ref(db, "Statusakun_host/" + login.userId), (snap) => {

  if (!snap.exists()) return;

  const status = snap.val().status;

  if (status === "banned" || status === "suspend") {

    localStorage.removeItem("user");
    window.location.replace("status_akun.html");
  }

});









function updateLastActive(page = "ISI_CHAT_HOST") {

  const login = JSON.parse(localStorage.getItem("user"));
  if (!login?.userId) return;

  update(ref(db, "users2/" + login.userId), {
    lastActive: Date.now(),
    currentPage: page
  });

}

["click", "touchstart", "keydown"].forEach(evt => {
  document.addEventListener(evt, () => {
    updateLastActive("ISI_CHAT_HOST");
  }, { passive: true });
});

updateLastActive("ISI_CHAT_HOST");








/* ================= COIN REALTIME ================= */
onValue(ref(db, "users2"), (snap) => {

  snap.forEach(child => {

    const data = child.val();

    if (data.email === login.email) {

      const coin = data.coin || 0;

      document.getElementById("coinValue").textContent =
        Number(coin).toLocaleString("id-ID");

    }

  });

});



















/* ================= CLEAN ================= */
function cleanId(id){
  return String(id || "")
    .toLowerCase()
    .replace(/\./g, "_")
    .replace(/@/g, "_")
    .replace(/\s+/g, "_");
}

/* ================= ELEMENT ================= */
const chatBox = document.getElementById("chatBox");
const header = document.getElementById("chatHeader");

/* ================= CHAT ID ================= */
const chatId = localStorage.getItem("chatId");
if(!chatId){
  alert("Chat tidak ditemukan");
  window.location.href = "inbox.html";
}

/* ================= MY ID ================= */
const myId = cleanId(login.uid || login.email || login.wa);

/* ================= USERS INDEX (users1 untuk chat partner) ================= */
let usersIndex = {};

onValue(ref(db, "users1"), (snap) => {

  usersIndex = {};

  snap.forEach(child => {
    const d = child.val();
    const id = cleanId(d.uid || d.email || d.wa);
    usersIndex[id] = d;
  });



  loadHeader();

});

/* ================= USERS2 (UNTUK LOGIN USER SAYA) ================= */
let myUserData = {};

onValue(ref(db, "users2"), (snap) => {

  snap.forEach(child => {
    const d = child.val();

    if (d.email === login.email) {
      myUserData = d;
    }
  });
});


console.log("CHAT ID =", chatId);


/* ================= AMBIL LAWAN CHAT ================= */
function getOtherUser(){

  const match = chatId.match(/user_\d+/);

  if(!match) return null;

  const uid = match[0];

  console.log("UID CHAT:", uid);

  return usersIndex[uid] || null;
}

/* ================= HEADER ================= */
function loadHeader(){

  const other = getOtherUser();

 

  const statush = other?.statush || "";
const otherUid = other?.uid || "";
 header.innerHTML = `
  <div
    onclick="openProfile('${otherUid}')"
    style="
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      width:100%;
      height:100%;
      cursor:pointer;
    "
  >



    <div style="
      display:flex;
      align-items:center;
      gap:5px;
      font-weight:600;
      font-size:16px;
    ">
      ${other?.nama || "Unknown User"}

      ${
        other?.statush
          ? `<span class="status-tag">${other.statush}</span>`
          : ""
      }
    </div>

  </div>
`;
}

/* ================= CHAT LOAD ================= */
onValue(ref(db, "chats/" + chatId), (snap) => {

  chatBox.innerHTML = "";

  const data = snap.val();
  if (!data) return;

  const history = data.history || {};
 const myId = login.email.replace(/[@.]/g, "_");
Object.values(history).forEach(msg => {



  const senderId = cleanId(msg.senderId || msg.sender || "");



  const isMe = senderId === myId;

  console.log("IS ME:", isMe);

   const isPhoto = !!msg.foto;

/* ================= AMBIL USER ================= */
const senderUser =
  usersIndex[cleanId(msg.senderId)] ||
  usersIndex[senderId] ||
  null;

const senderName =
  msg.senderName ||
  senderUser?.nama ||
  "Unknown User";

const senderFoto =
  msg.senderFoto ||
  senderUser?.profil ||
  senderUser?.foto?.[0] ||
  "assets/images/default_pic_100.png";

const myAvatar =
  myUserData?.profil ||
  login.foto?.[0] ||
  "assets/images/default_pic_100.png";

const row = document.createElement("div");
row.className = isMe ? "chat-row me" : "chat-row";








let content = "";

if(msg.gift){

  content = `
    <div class="gift-chat">
      <img src="${msg.giftImg}" class="gift-chat-img">

      <div class="gift-chat-name">
        ${msg.giftName}
      </div>

      <div class="gift-chat-price">
        🪙 ${msg.giftPrice}
      </div>
    </div>
  `;

}
else if(msg.foto){

  content = `
    <img src="${msg.foto}"
         style="max-width:180px;border-radius:10px;">
  `;

}
else{

  content = msg.text || "";

}






row.innerHTML = isMe
  ? `
      ${
        msg.gift
          ? content
          : msg.foto
            ? content
            : `
                <div class="msg right">
                  ${content}
                </div>
              `
      }

      <img class="chat-avatar" src="${myAvatar}">
    `
  : `
      <img class="chat-avatar" src="${senderFoto}">

      ${
        msg.gift
          ? content
          : msg.foto
            ? content
            : `
                <div class="msg left">
                  ${content}
                </div>
              `
      }
    `;

    chatBox.appendChild(row);
  });

  chatBox.scrollTop = chatBox.scrollHeight;
});





/* ================= SEND TEXT ================= */
window.sendMsg = function(){

  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;

  const senderId = cleanId(login.uid || login.email || login.wa);

  const senderFoto =
    myUserData?.profil ||
    login.foto?.[0] ||
    "assets/images/default_pic_100.png";

  push(ref(db, "chats/" + chatId + "/history"), {
    text,
    senderId,
    senderName: myUserData?.nama || login.nama || "Unknown User",
    senderFoto,
    time: Date.now(),
    read : false
  });

  input.value = "";
};




/* ================= SEND IMAGE ================= */
window.chooseImage = function(){

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";

  input.onchange = async (e) => {

    const file = e.target.files[0];
    if(!file) return;

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "fotousershost");

    const res = await fetch(
      "https://api.cloudinary.com/v1_1/dowoq4a0i/image/upload",
      { method: "POST", body: formData }
    );

    const data = await res.json();

    push(ref(db, "chats/" + chatId + "/history"), {
      foto: data.secure_url,
      senderId: cleanId(login.uid || login.email || login.wa),
      senderName: myUserData?.nama || login.nama || "Unknown User",
      senderFoto: myUserData?.profil || login.foto?.[0] || "",
      time: Date.now(),
      read : false
    });
  };

  input.click();
};






console.log(login);


console.log("UID =", login.uid);
console.log("EMAIL =", login.email);
console.log("WA =", login.wa);
console.log("KEY =", login.key);






window.openProfile = function(uid){

  localStorage.setItem("profilUid", uid);

  window.location.href = "profil_users2.html";
};






























/* OPEN SHEET */
function openGift(){
  console.log("OPEN GIFT CLICKED");

  const sheet = document.getElementById("giftSheet");

  sheet.classList.add("show");
}

window.openGift = openGift;




document.addEventListener("click", function(e){

  const sheet = document.getElementById("giftSheet");
  const giftBtn = document.querySelector(".bottom-icon[onclick='openGift()']");

  if(!sheet) return;

  if(!sheet.classList.contains("show")) return;

  if(!sheet.contains(e.target) && e.target !== giftBtn) {
    sheet.classList.remove("show");
  }

});

/* SHOW NOTIF */
function showNotif(){

  const notif = document.getElementById("giftNotif");

  notif.classList.add("show");


  setTimeout(()=>{
    notif.classList.remove("show");
  },2500);

}

/* LOAD GIFTS */
async function loadGift(){

  const snap = await get(ref(db, "Gift"));

  let data;

  if(!snap.exists()){
    // 🔥 AUTO DUMMY 20 DATA
    data = {};
    for(let i=1;i<=20;i++){
      data["gift"+i] = {
        name: "Gift " + i,
        price: (i * 50).toString(),

        role: "Gift"
      };
    }

    await set(ref(db, "Gift"), data);
  } else {
    data = snap.val();
  }

  renderGift(data);
}

function Giftpopup89Confirm(text){

  return new Promise(resolve=>{

    const popup =
      document.getElementById("Giftpopup89_overlay");

    const txt =
      document.getElementById("Giftpopup89_text");


    txt.innerHTML = text;

    popup.style.display="flex";


    document.getElementById("Giftpopup89_ok")
    .onclick=function(){

      popup.style.display="none";
      resolve(true);

    };


    document.getElementById("Giftpopup89_cancel")
    .onclick=function(){

      popup.style.display="none";
      resolve(false);

    };


  });

}






function Giftpopup89Toast(text){

  const toast =
    document.getElementById("Giftpopup89_toast");

  const txt =
    document.getElementById("Giftpopup89_toastText");


  txt.innerHTML = text;


  toast.classList.add("Giftpopup89_show");


  setTimeout(()=>{

    toast.classList.remove("Giftpopup89_show");

  },2500);

}
