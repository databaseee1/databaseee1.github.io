    border-radius:50%;

#carouselTrack{

#loadingScreen{

@keyframes spin{

<script type="module">

const loadingScreen =
document.getElementById("loadingScreen");

const login = JSON.parse(localStorage.getItem("user"));

onValue(ref(db, "Statusakun_host/" + login.userId), (snap) => {

function updateLastActive(page = "Dunia") {

  const login = JSON.parse(localStorage.getItem("user"));

let currentUser = null;

async function getCurrentUser() {
  try {

    // 🔥 FIX: langsung ambil berdasarkan userId
    const snap = await get(ref(db, "users2/" + login.userId));

    if (!snap.exists()) return null;

    currentUser = snap.val();



    return currentUser;

  } catch (err) {
    console.log("ERROR getCurrentUser:", err);
    return null;
  }
}


window.addEventListener("DOMContentLoaded", async () => {
  await getCurrentUser();

  const el = document.getElementById("saldoHostPopup3");

  if (el && currentUser) {
    el.innerText = formatSaldoCoin(currentUser.saldo);
  }
});


function formatSaldoCoin(saldo){
  saldo = Number(saldo || 0);

  // 🔥 juta → M
  if (saldo >= 1000000) {
    const juta = saldo / 1000000;

    return Number.isInteger(juta)
      ? juta + "M"
      : juta.toFixed(1) + "M";
  }

  // 🔥 kecil → credits (DESIMAL, bukan bulat)
  const credits = saldo / 171.1;

  return credits.toFixed(1);
}





function shuffleArray(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}









async function loadFotoGlobal() {

  const snap = await get(ref(db, "fotoglobal"));

  if (!snap.exists()) return;

  const data = snap.val();
  let urls = Object.values(data);

// acak setiap refresh
urls = shuffleArray(urls);

  const track = document.getElementById("carouselTrack");

  track.innerHTML = "";

  // 🔥 tampilkan dulu 10 gambar pertama (biar langsung muncul)
  const firstBatch = urls.slice(0, 10);

  firstBatch.forEach(item => {
    const url = typeof item === "string" ? item : item.url;

    const div = document.createElement("div");
    div.className = "carousel-item";
    div.innerHTML = `<img src="${url}">`;
    track.appendChild(div);
  });

  // 🔥 delay render sisanya (background)
  setTimeout(() => {

    const rest = urls.slice(10);

    rest.forEach(item => {
      const url = typeof item === "string" ? item : item.url;

      const div = document.createElement("div");
      div.className = "carousel-item";
      div.innerHTML = `<img src="${url}">`;
      track.appendChild(div);
    });

  }, 200);





  // tunggu browser render
  await new Promise(resolve =>
    requestAnimationFrame(resolve)
  );

  await new Promise(resolve =>
    requestAnimationFrame(resolve)
  );

 

}









/* HISTORY */
function openHistory(){
  document.getElementById("historyPopup").style.display="block";
}
function closeHistory(){
  document.getElementById("historyPopup").style.display="none";
}

const container = document.getElementById('carouselContainer');
const track = document.getElementById('carouselTrack');
const items = track.querySelectorAll('.carousel-item');

let scrollPos =
Number(localStorage.getItem("carouselPos")) || 0;
const speed = 0.6;

function autoScroll() {
    scrollPos += speed;

    const maxScroll = track.scrollWidth - container.offsetWidth;

    if (maxScroll <= 0) return;

    if (scrollPos >= maxScroll) {
        scrollPos = 0;
    }

    track.style.transform = "translate3d(" + (-scrollPos) + "px,0,0)";
}



// lebih smooth dari setInterval
function loop() {
    autoScroll();
    updateScale(); // 🔥 PENTING: langsung update tiap frame
    requestAnimationFrame(loop);
}




(async () => {

  await loadFotoGlobal();

  // 🔥 tunggu layout benar-benar jadi
  await new Promise(r => requestAnimationFrame(r));
  await new Promise(r => requestAnimationFrame(r));

  container.style.opacity = "1";

  loadingScreen.classList.add("hide");
  setTimeout(()=>loadingScreen.remove(),400);

  // 🔥 BARU START LOOP DI SINI
  loop();

})();

window.addEventListener("resize", () => {
    scrollPos = 0;
});


let saveCounter = 0;

// SCALE OPTIMASI (tidak pakai loop berat tiap 80ms)
let lastScaleUpdate = 0;

function updateScale() {
  const containerRect = container.getBoundingClientRect();
  const centerX = containerRect.left + containerRect.width / 2;

  const items = document.querySelectorAll("#carouselTrack .carousel-item");

  items.forEach(item => {
    const img = item.querySelector("img");
    const rect = item.getBoundingClientRect();

    const itemCenter = rect.left + rect.width / 2;

    let distance = Math.abs(centerX - itemCenter);

    let scale = 1 - distance / 250;

    if (scale < 0.6) scale = 0.6;
    if (scale > 1) scale = 1;

    img.style.transform = `scale(${scale})`;
  });
}

// throttle scale (biar tidak spam di mobile)
function scaleLoop(time) {
    if (time - lastScaleUpdate > 120) {
        updateScale();
        lastScaleUpdate = time;
    }
    requestAnimationFrame(scaleLoop);
}

requestAnimationFrame(scaleLoop);




window.goNav = function(el, url) {

  document.querySelectorAll("#bottomNav .nav-item").forEach(i => {
    i.classList.remove("active");

    const img = i.querySelector("img");
    if (img) img.src = img.dataset.default;
  });

  el.classList.add("active");

  const img = el.querySelector("img");
  if (img) img.src = img.dataset.active;

  setTimeout(() => {
    window.location.href = url;
  }, 150);
};
window.addEventListener("DOMContentLoaded", () => {

  const items = document.querySelectorAll("#bottomNav .nav-item");

  if (items.length > 1) {
    items[1].classList.add("active");

    const img = items[1].querySelector("img");
    if (img) img.src = img.dataset.active;
  }

});
/* AUTO ACTIVE */
document.querySelectorAll(".nav-item")[1].classList.add("active");



/* ================= (NO zoom) ================= */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

/* ❌ BLOCK ZOOM KEYBOARD (Ctrl + / - / 0) */
document.addEventListener("keydown", function (e) {
  if (
    (e.ctrlKey && e.key === "+") ||
    (e.ctrlKey && e.key === "-") ||
    (e.ctrlKey && e.key === "0") ||
    (e.ctrlKey && e.key === "=")
  ) {
    e.preventDefault();
  }
});

/* BLOCK PINCH ZOOM (mobile) */
document.addEventListener("gesturestart", function (e) {
  e.preventDefault();
});

document.addEventListener("gesturechange", function (e) {
  e.preventDefault();
});

document.addEventListener("gestureend", function (e) {
  e.preventDefault();
});
/* ================= (NO zoom) ================= */
