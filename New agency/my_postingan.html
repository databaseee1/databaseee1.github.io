<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Postingan</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>


body{
  font-family:'Poppins',sans-serif;
  background:#f5f5f5;
  margin:0;
  padding:15px;
  padding-top:65px;
}

*{
  font-family:'Poppins',sans-serif;
  box-sizing:border-box;
}

.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:55px;
  background:#fff;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  z-index:999;
}

.back{
  width:40px;
  cursor:pointer;
  font-size:18px;
}

.title{
  font-size:16px;
  font-weight:600;
}

.post-card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.post-img{
  width:100%;
  height:190px;
  object-fit:cover;
}

.post-body{
  padding:12px;
}

.post-title{
  font-size:15px;
  font-weight:600;
}

.post-desc{
  font-size:13px;
  color:#666;
  margin-top:5px;
}

.post-info{
  display:flex;
  gap:15px;
  margin-top:8px;
  font-size:12px;
  color:#666;
  font-family:Poppins,sans-serif;
}

.post-info div{
  display:flex;
  align-items:center;
  gap:5px;
}

.post-info i{
  font-size:13px;
}

.post-info .fa-heart{
  color:#ff4d6d;
}

.post-info .fa-comment{
  color:#3498db;
}
.action{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.btn{
  border:none;
  border-radius:8px;
  padding:7px 12px;
  cursor:pointer;
  font-size:12px;
}

.edit{
  background:#3498db;
  color:#fff;
}

.delete{
  background:#e74c3c;
  color:#fff;
}

.cancel{
  background:#ddd;
}

.save{
  background:#3498db;
  color:#fff;
}

.fab{
  position:fixed;
  right:20px;
  bottom:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#3498db;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  cursor:pointer;
  box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.modal{
  position:fixed;
  inset:0;

  display:none;

  background:#fff;

  z-index:99999;

  overflow-y:auto;

  -webkit-overflow-scrolling:touch;
}

.box{
  width:100%;
  min-height:100vh;

  background:#fff;

  border-radius:0;

  padding:15px;
  box-sizing:border-box;

  overflow:visible;
}
.box input,
.box textarea{
  width:100%;
  box-sizing:border-box;
  margin-top:8px;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-family:Poppins;
}

.box textarea{
  min-height:120px;
  resize:none;
}

#previewFoto{
  width:100%;
  display:none;
  margin-top:10px;
  border-radius:10px;
}

.btn-row{
  display:flex;
  gap:8px;
  margin-top:12px;
}

.confirm-box{
  text-align:center;
}

.confirm-icon{
  font-size:45px;
  color:#e74c3c;
}

.confirm-title{
  font-size:16px;
  font-weight:600;
  margin-top:10px;
}

.confirm-sub{
  font-size:12px;
  color:#666;
  margin-top:5px;
}

.notif{
  position:fixed;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  color:#fff;
  padding:10px 15px;
  border-radius:10px;
  display:none;
  z-index:99999;
}

.post-header{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
}

.profile-img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
  border:1px solid #ddd;
}

.poster-name{
  font-size:14px;
  font-weight:600;
}

.post-date{
  font-size:12px;
  color:#888;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back" onclick="history.back()">
    <i class="fas fa-chevron-left"></i>
  </div>

  <div class="title">
    My Postingan
  </div>
</div>

<!-- LIST POSTINGAN -->
<div id="listPost"></div>

<!-- FLOAT BUTTON -->
<div class="fab" onclick="openModal()">
  <i class="fas fa-plus"></i>
</div>

<!-- MODAL TAMBAH / EDIT -->
<div class="modal" id="postModal">

  <div class="box">

    <h3 id="modalTitle">
      Tambah Postingan
    </h3>


<label>Logo / Profil Pemosting</label>

<input
  type="file"
  id="profilInput"
  accept="image/*">

<img
  id="previewProfil"
  style="
    width:60px;
    height:60px;
    border-radius:50%;
    object-fit:cover;
    margin-top:10px;
    display:none;
  ">


    <div class="input-group">
  <label>Nama Pemosting</label>
  <input
    type="text"
    id="namaPemosting"
    placeholder="Masukkan nama pemosting">
</div>



    <input
      type="file"
      id="fotoInput"
      accept="image/*">

    <img id="previewFoto">


    <input
      type="text"
      id="judul"
      placeholder="Judul postingan">

    <textarea
      id="deskripsi"
      placeholder="Deskripsi postingan"></textarea>

    <div class="btn-row">

      <button
        class="btn save"
        onclick="savePost()">
        Simpan
      </button>

      <button
        class="btn cancel"
        onclick="closeModal()">
        Batal
      </button>

    </div>

  </div>

</div>

<!-- MODAL HAPUS -->
<div class="modal" id="hapusModal">

  <div class="box confirm-box">

    <div class="confirm-icon">
      <i class="fas fa-trash"></i>
    </div>

    <div class="confirm-title">
      Hapus Postingan?
    </div>

    <div class="confirm-sub">
      Data yang dihapus tidak dapat dikembalikan.
    </div>

    <div class="btn-row">

      <button
        class="btn delete"
        onclick="hapusPost()">
        Hapus
      </button>

      <button
        class="btn cancel"
        onclick="closeDelete()">
        Batal
      </button>

    </div>

  </div>

</div>

<!-- NOTIF -->
<div class="notif" id="notif"></div>

<script type="module">



/* ================= FIREBASE ================= */
import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getDatabase,
  ref,
  push,
  set,
  get,
  update,
  remove,
  onValue
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
  storageBucket: "users-96dc5.appspot.com",
  messagingSenderId: "483322415863",
  appId: "1:483322415863:web:1397a8f2e808e66ad9e1f2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================= CEK LOGIN ================= */

const adminData =
JSON.parse(localStorage.getItem("adminLogin"));

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}

/* ================= CLOUDINARY ================= */

const CLOUD_NAME = "dowoq4a0i";
const UPLOAD_PRESET = "fotousershost";

/* ================= GLOBAL ================= */

let editId = null;
let deleteId = null;

/* ================= NOTIF ================= */

function showNotif(text){

  const notif =
  document.getElementById("notif");

  notif.innerText = text;
  notif.style.display = "block";

  setTimeout(() => {
    notif.style.display = "none";
  },2500);

}

/* ================= MODAL ================= */

window.openModal = function(){

  document.getElementById("postModal")
  .style.display = "flex";

}

window.closeModal = function(){

  document.getElementById("postModal")
  .style.display = "none";

  editId = null;

  document.getElementById("modalTitle")
  .innerText = "Tambah Postingan";

  document.getElementById("judul")
  .value = "";

  document.getElementById("deskripsi")
  .value = "";

  document.getElementById("fotoInput")
  .value = "";

  document.getElementById("previewFoto")
  .style.display = "none";


document
.getElementById("profilInput")
.addEventListener("change", e => {

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(ev){

    const img =
      document.getElementById("previewProfil");

    img.src = ev.target.result;
    img.style.display = "block";

  };

  reader.readAsDataURL(file);

});



}

/* ================= DELETE MODAL ================= */

window.closeDelete = function(){

  document.getElementById("hapusModal")
  .style.display = "none";

  deleteId = null;

}

window.askDelete = function(id){

  deleteId = id;

  document.getElementById("hapusModal")
  .style.display = "flex";

}



window.hapusPost = async function(){

  if(!deleteId) return;

  try{

    await remove(
      ref(db, "Mypostingan/" + deleteId)
    );

    closeDelete();

    showNotif("Postingan berhasil dihapus");

  }catch(err){

    console.log(err);

    showNotif("Gagal menghapus");

  }

};






/* ================= PREVIEW FOTO ================= */

document
.getElementById("fotoInput")
.addEventListener("change", e => {

  const file =
  e.target.files[0];

  if(!file) return;

  const reader =
  new FileReader();

  reader.onload = function(ev){

    const img =
    document.getElementById("previewFoto");

    img.src = ev.target.result;
    img.style.display = "block";

  };

  reader.readAsDataURL(file);

});



/* ================= LOAD POSTINGAN ================= */

function loadPostingan(){

  const list =
  document.getElementById("listPost");

  onValue(
    ref(db,"Mypostingan"),
    (snap)=>{

      list.innerHTML = "";

      if(!snap.exists()){

        list.innerHTML = `
          <div class="card">
            Belum ada postingan
          </div>
        `;

        return;
      }

      let arr = [];

      snap.forEach(child => {

        arr.push({
          id: child.key,
          ...child.val()
        });

      });

      arr.sort((a,b)=>
        (b.timestamp||0)
        -
        (a.timestamp||0)
      );

      arr.forEach(item => {

        list.innerHTML += `

<div class="post-card">

  <div class="post-header">

    <img
      class="profile-img"
      src="${item.profil || 'https://via.placeholder.com/50'}">

    <div>

      <div class="poster-name">
        ${item.namaPemosting || '-'}
      </div>

      <div class="post-date">
        ${item.tanggal || '-'}
      </div>

    </div>

  </div>

  ${item.foto ? `
    <img
      class="post-img"
      src="${item.foto}">
  ` : ""}

  <div class="post-body">

    <div class="post-title">
      ${item.judul || '-'}
    </div>

    <div class="post-desc">
      ${item.deskripsi || '-'}
    </div>

            <div class="post-info">

<div>
  <i class="fas fa-heart"></i>
  ${Number(item.like || 0).toLocaleString()}
</div>

<div>
  <i class="fas fa-comment"></i>
  ${Number(item.komentar || 0).toLocaleString()}
</div>

            </div>

            <div class="action">

              <button
                class="btn edit"
                onclick="editPost('${item.id}')">

                Edit

              </button>

              <button
                class="btn delete"
                onclick="askDelete('${item.id}')">

                Hapus

              </button>

            </div>

          </div>

        </div>

        `;

      });

    }
  );

}

loadPostingan();






window.editPost = async function(id){

  editId = id;

  const snap = await get(
    ref(db, "Mypostingan/" + id)
  );

  if(!snap.exists()){
    showNotif("Postingan tidak ditemukan");
    return;
  }

  const data = snap.val();

if(data.profil){

  document.getElementById("previewProfil")
    .src = data.profil;

  document.getElementById("previewProfil")
    .style.display = "block";

}

  document.getElementById("namaPemosting").value =
  data.namaPemosting || "";

  document.getElementById("modalTitle")
    .innerText = "Edit Postingan";

  document.getElementById("judul")
    .value = data.judul || "";

  document.getElementById("deskripsi")
    .value = data.deskripsi || "";

  if(data.foto){
    document.getElementById("previewFoto").src =
      data.foto;

    document.getElementById("previewFoto")
      .style.display = "block";
  }

  document.getElementById("postModal")
    .style.display = "flex";

};









window.savePost = async function(){

  console.log("1. savePost jalan");
const namaPemosting =
document.getElementById("namaPemosting")
.value.trim();




  const judul = document.getElementById("judul").value.trim();
  const deskripsi = document.getElementById("deskripsi").value.trim();

const fileInput =
document.getElementById("fotoInput");

const file =
fileInput?.files?.[0];

const profilFile =
document.getElementById("profilInput")
?.files?.[0];

  console.log("2. data:", {
    judul,
    deskripsi,
    file
  });

if(!namaPemosting || !judul || !deskripsi){
    alert("Lengkapi data");
    return;
  }

  console.log("3. lolos validasi");

  let fotoUrl = "";
let profilUrl = "";
  if(file){

    console.log("4. upload cloudinary mulai");

    const form = new FormData();
    form.append("file", file);
    form.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(
      `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
      {
        method:"POST",
        body:form
      }
    );

    console.log("5. response cloudinary", res);

    const data = await res.json();

    console.log("6. data cloudinary", data);

    fotoUrl = data.secure_url || "";
  }


/* ================= UPLOAD PROFIL ================= */

if(profilFile){

  const form2 = new FormData();

  form2.append("file", profilFile);

  form2.append(
    "upload_preset",
    UPLOAD_PRESET
  );

  const res2 = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    {
      method:"POST",
      body:form2
    }
  );

  const data2 = await res2.json();

  profilUrl = data2.secure_url || "";

}








  console.log("7. foto url", fotoUrl);




const dataPost = {

  namaPemosting,

  judul,

  deskripsi,

  tanggal:
    new Date().toLocaleDateString("id-ID")

};
/* ================= EDIT ================= */

if(editId){

  const oldSnap =
    await get(ref(db,"Mypostingan/" + editId));

  const oldData =
    oldSnap.val() || {};

await update(
  ref(db,"Mypostingan/" + editId),
  {

    ...dataPost,

    foto:
      fotoUrl ||
      oldData.foto ||
      "",

    profil:
      profilUrl ||
      oldData.profil ||
      "",

    like:
      oldData.like || 0,

    komentar:
      oldData.komentar || 0

  }
);

  showNotif("Postingan berhasil diperbarui");

}

/* ================= TAMBAH ================= */

else{

  const newRef =
    push(ref(db,"Mypostingan"));

await set(newRef, {

  ...dataPost,

  foto: fotoUrl,

  profil: profilUrl,

  like: 0,
  komentar: 0,

  timestamp: Date.now()

});

  showNotif("Postingan berhasil ditambahkan");

}




closeModal();

document.getElementById("judul").value = "";
document.getElementById("deskripsi").value = "";
document.getElementById("fotoInput").value = "";
document.getElementById("namaPemosting").value = "";
document.getElementById("profilInput")
.value = "";

document.getElementById("previewProfil")
.style.display = "none";



};

</script>

</body>
</html>
