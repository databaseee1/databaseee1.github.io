<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Withdraw</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body{
  margin:0;
  font-family:Poppins,sans-serif;
  background:#f4f6f9;
  color:#222;
}

/* HEADER */
.header{
  background:#ffffff;
  padding:16px;
  text-align:center;
  font-weight:600;
  border-bottom:1px solid #eee;
  letter-spacing:0.5px;
}

/* CARD */
.card{
  background:#fff;
  margin:12px;
  padding:14px;
  border-radius:14px;
  position:relative;
  box-shadow:0 4px 14px rgba(0,0,0,0.06);
  transition:0.2s;
}

.card:hover{
  transform:translateY(-2px);
}

/* TEXT */
.card b{
  font-size:15px;
}

.row{
  font-size:13px;
  margin:4px 0;
  color:#444;
}

/* STATUS BADGE */
.status{
  display:inline-block;
  margin-top:8px;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:600;
  text-transform:capitalize;
}

.pending{
  background:#fff3cd;
  color:#b8860b;
}

.approved{
  background:#d1f7d6;
  color:#1e7e34;
}

.rejected{
  background:#ffd6d6;
  color:#c0392b;
}

/* MENU */
.menu{
  position:absolute;
  top:10px;
  right:10px;
}

.btn-menu{
  width:34px;
  height:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#2f80ed;
  color:#fff;
  border-radius:10px;
  cursor:pointer;
}

.menu-box{
  display:none;
  position:absolute;
  right:0;
  top:40px;
  background:#fff;
  border:1px solid #eee;
  border-radius:12px;
  padding:6px;
  box-shadow:0 10px 25px rgba(0,0,0,0.12);
  z-index:999;
  min-width:150px;
}

.menu-box button{
  width:100%;
  padding:9px;
  border:none;
  background:none;
  text-align:left;
  cursor:pointer;
  font-size:13px;
  border-radius:8px;
}

.menu-box button:hover{
  background:#f3f6ff;
}

/* POPUP */
.overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.box{
  background:#fff;
  padding:18px;
  border-radius:14px;
  width:300px;
  text-align:center;
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
}

.box button{
  margin-top:10px;
  padding:9px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:500;
}

.ok{
  background:#2ecc71;
  color:#fff;
}

.cancel{
  background:#e0e0e0;
}



.tagihan-box{
  position:absolute;
  top:10px;
  right:45px;
  background:#f1f1f1;
  color:#ff0a0a;
  font-size:12px;
  font-weight:600;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid #ffd9a6;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  white-space:nowrap;
}



.user-top{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:10px;
}

.user-photo{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #eee;
  background:#f5f5f5;
}

.user-info{
  flex:1;
  min-width:0;
}

.user-name{
  font-size:15px;
  font-weight:600;
  color:#222;
}

.user-email{
  font-size:12px;
  color:#888;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}




</style>
</head>

<body>

<div class="header">ADMIN WITHDRAW</div>
<div id="list"></div>

<!-- CONFIRM POPUP -->
<!-- CONFIRM POPUP -->
<div class="overlay" id="confirmBox">
  <div class="box">
    <div id="confirmText">Yakin?</div>
    <button class="ok" onclick="confirmYes()">Ya</button>
    <button class="cancel" onclick="closeConfirm()">Batal</button>
  </div>
</div>

<!-- NOTIF -->
<div class="overlay" id="notifBox">
  <div class="box">
    <div id="notifText"></div>
    <button class="ok" onclick="closeNotif()">OK</button>
  </div>
</div>


<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  update,
  push,
   remove
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey:"AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain:"users-96dc5.firebaseapp.com",
  databaseURL:"https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"users-96dc5",
  storageBucket:"users-96dc5.appspot.com",
  messagingSenderId:"483322415863",
  appId:"1:483322415863:web:1397a8f2e808e66ad9e1f2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);







/* ================= CEK LOGIN ================= */

const adminData = JSON.parse(localStorage.getItem("adminLogin"));

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}











let currentData = null;
let currentId = null;
let currentStatus = null;
let usersData = {};

/* ================= LOAD ================= */
async function load(){

  const snap = await get(ref(db,"historyWithdraw"));
  const snapUser = await get(ref(db,"users2"));

  if(snapUser.exists()){
    usersData = snapUser.val();
  }

  if(!snap.exists()) return;

  const data = snap.val();

  const list = document.getElementById("list");
  list.innerHTML = "";

  const keys = Object.keys(data).reverse();

  keys.forEach(id => {

    const d = data[id];





    const u = usersData[d.userId] || {};

    // 🔥 FORCE NUMBER (INI YANG PENTING)
    const tagihan = Number(u.jumlahTagihan ?? 0);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="menu">
        <div class="btn-menu" onclick="toggleMenu('${id}')">
          <i class="fa fa-ellipsis-vertical"></i>
        </div>

        <div class="menu-box" id="menu-${id}">
          <button onclick='action("${id}", ${JSON.stringify(d)}, "approved")'>Approved</button>
          <button onclick='action("${id}", ${JSON.stringify(d)}, "rejected")'>Tolak</button>
          <button onclick='action("${id}", ${JSON.stringify(d)}, "pending")'>Pending</button>
            <button
    style="color:#e74c3c;font-weight:600;"
    onclick='action("${id}", ${JSON.stringify(d)}, "delete")'>
    Hapus
  </button>
           </div>
      </div>

<div class="tagihan-box">
  Tagihan: Rp ${tagihan.toLocaleString("id-ID")}
</div>

<div class="user-top">

<img
  src="${u.profil || 'https://via.placeholder.com/50'}"
  class="user-photo"
>

  <div class="user-info">
    <div class="user-name">
      ${d.nama}
    </div>

    <div class="user-email">
      ${d.email}
    </div>
  </div>

</div>
      <div>WA: ${d.wa || "-"}</div>
      <div>Nominal: Rp ${d.nominal}</div>
      <div>Rekening: ${d.rekening}</div>
      <div>Metode: ${d.metode}</div>
      <div>${new Date(d.createdAt).toLocaleString()}</div>

      <div class="status ${d.status}">
        Status: ${d.status}
      </div>
    `;

    list.appendChild(div);
  });
}

load();

/* ================= MENU TOGGLE ================= */
window.toggleMenu = function(id){

  document.querySelectorAll(".menu-box").forEach(m=>{
    if(m.id !== "menu-"+id) m.style.display="none";
  });

  const el = document.getElementById("menu-"+id);
  el.style.display = (el.style.display === "block") ? "none" : "block";
};

/* ================= ACTION ================= */
window.action = function(id, data, status){

  currentId = id;
  currentData = data;
  currentStatus = status;

  const menu = document.getElementById("menu-"+id);
  if(menu) menu.style.display = "none";

const textMap = {
  approved : "Setujui withdraw ini?",
  rejected : "Tolak withdraw ini?",
  pending  : "Tandai sebagai pending?",
  delete   : "Yakin ingin menghapus data withdraw ini?"
};

  document.getElementById("confirmText").innerText =
    textMap[status] || "Yakin?";

  document.getElementById("confirmBox").style.display = "flex";
};











/* ================= CONFIRM ================= */
window.confirmYes = async function(){

  if(!currentId) return;

  const data = currentData;



 // ================= HAPUS DATA =================
  if(currentStatus === "delete"){

    await remove(
      ref(db,"historyWithdraw/" + currentId)
    );

    closeConfirm();

    showNotif(
      "Data withdraw berhasil dihapus!"
    );

    load();
    return;
  }







  // ================= UPDATE STATUS WD =================
  await update(ref(db,"historyWithdraw/"+currentId),{
    status: currentStatus
  });





// ================= KEMBALIKAN SALDO JIKA DITOLAK =================
// ================= KEMBALIKAN SALDO JIKA DITOLAK =================
if(
  currentStatus === "rejected" &&
  data.status !== "rejected"
){

  const userRef =
    ref(db, "users2/" + data.userId);

  const userSnap =
    await get(userRef);

  if(userSnap.exists()){

    const userData =
      userSnap.val();

    const saldoSekarang =
      Number(userData.saldo || 0);

    const nominalWD =
      Number(data.nominal || 0);

    await update(userRef,{
      saldo: saldoSekarang + nominalWD
    });

  }
}




  let alasan = "";
let notifText = "";

// ================= RATE USD =================
const USD_RATE = 15500;

// ================= CONVERT FUNCTION =================
function toUSD(idr){
  return (Number(idr) / USD_RATE).toFixed(2);
}

// ================= AMBIL NOMINAL =================
const idrAmount = Number(data.nominal) || 0;

// ================= USD RESULT =================
const usdText = `$${toUSD(idrAmount)}`;

// ================= STATUS LOGIC =================
if (currentStatus === "approved") {

  alasan = "Withdraw disetujui";

  notifText =
    `Pembayaran Anda telah dibayarkan, jumlahnya adalah ${usdText}, silakan periksa di platform pengumpulan yang sesuai~`;

}

else if (currentStatus === "rejected") {

  alasan = "Withdraw ditolak oleh platform";

  notifText =
    `Penarikan Anda tidak disetujui oleh platform, lakukan panggilan video dengan baik. Credits telah dikembalikan ke saldo host Anda jumlahnya adalah ${usdText}, silakan periksa kembali dan patuhi kebijakan platform. Silakan perbaiki perilaku Anda sebelum mengajukan kembali~`;

}

else {

  alasan = "Withdraw pending";

  notifText =
    `Penarikan Anda sedang diproses oleh sistem, harap menunggu~`;
}



  // ================= KIRIM NOTIF =================
  await push(
    ref(db, `fithnerchats/notifikasi/${data.userId}/withdraw`),
    {
      text: notifText,
      profil: "ic_launcher_circle.png",
      time: Date.now(),
      nominalIDR: data.nominal,
      nama: data.nama,
      email: data.email,
      wa: data.wa,
      metode: data.metode,
      status: currentStatus
    }
  );

  closeConfirm();
  showNotif("Status WD & Notifikasi terkirim!");

  load();
};




/* ================= POPUP CONTROL ================= */
window.closeConfirm = function(){
  document.getElementById("confirmBox").style.display = "none";
};

window.showNotif = function(text){
  document.getElementById("notifText").innerText = text;
  document.getElementById("notifBox").style.display = "flex";
};

window.closeNotif = function(){
  document.getElementById("notifBox").style.display = "none";
};

</script>

</body>
</html>
