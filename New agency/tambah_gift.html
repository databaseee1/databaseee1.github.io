<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Admin Gift System</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<style>
body{
  font-family: Arial;
  margin:0;
  background:#f5f5f5;

  padding-bottom: 80px;
}

.container{
  max-width:500px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  padding:12px;
  border-radius:10px;
  margin-bottom:10px;
}

.user{
  padding:10px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:5px;
  cursor:pointer;
}

.user.active{
  background:#8100ff;
  color:#fff;
}

.gift-box{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px;
  border:1px solid #eee;
  border-radius:10px;
  margin-bottom:8px;
}

.gift-box img{
  width:40px;
  height:40px;
  object-fit:cover;
  border-radius:8px;
}

input{
  width:80px;
  padding:5px;
}

button{
  width:15%;
  padding:12px;
  background:#8100ff;
  color:#fff;
  border:none;
  border-radius:10px;
  margin-top:10px;
}


.user.active{
  background:#8100ff;
  color:#fff;
}




#saveBtn{
  position: fixed;
  bottom: 15px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 450px;
  z-index: 9999;

  background: #8100ff;
  color: #fff;
  border: none;
  padding: 14px;
  border-radius: 12px;
  font-size: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
}
</style>
</head>

<body>

<div class="container">

  <div class="card">
    <h3>Pilih User</h3>
    <div id="userList"></div>
  </div>

  <div class="card">
    <h3>Gift List</h3>
    <div id="giftList"></div>

    <button id="saveBtn">Tambah Gift ke User</button>
  </div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  update
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


const adminData = JSON.parse(localStorage.getItem("adminLogin") || "{}");

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}




/* ================= STATE ================= */
let selectedUsers = [];
let gifts = {};
let users = {};

/* ================= LOAD USERS ================= */
async function loadUsers(){

  const snap = await get(ref(db,"Users"));
  const users = snap.val() || {};

  const box = document.getElementById("userList");
  box.innerHTML = "";

  Object.keys(users).forEach(uid => {

    const u = users[uid];

    const div = document.createElement("div");
    div.className = "user";

    const foto = (Array.isArray(u.foto) && u.foto[0]) 
      ? u.foto[0] 
      : "https://i.pinimg.com/736x/placeholder.png";

   const giftCount = u.gifts
  ? Object.keys(u.gifts).length
  : 0;

div.innerHTML = `
  <div style="
    display:flex;
    align-items:center;
    gap:10px;
  ">

    <!-- FOTO -->
    <img src="${foto}" style="
      width:40px;
      height:40px;
      border-radius:50%;
      object-fit:cover;
    ">

    <!-- NAMA -->
    <div style="flex:1;">
      <div style="font-weight:bold;">
        ${u.nama || "No Name"}
      </div>
    </div>

    <!-- TOTAL ITEM GIFT -->
   <div style="
  font-size:12px;
  background:#222;
  color:#fff;
  padding:4px 8px;
  border-radius:20px;
  margin-right:6px;
">
  ${giftCount} gift
</div>

<div style="
  font-size:12px;
  background:#8100ff;
  color:#fff;
  padding:4px 8px;
  border-radius:20px;
  margin-right:6px;
">
  Lv ${u.level || 0}
</div>

<button class="resetBtn" data-uid="${uid}" style="
">
  <i class="fa fa-refresh"></i>
</button>

  </div>
`;

  div.onclick = () => {

  const index = selectedUsers.indexOf(uid);

  if (index === -1) {
    selectedUsers.push(uid);
    div.classList.add("active");
  } else {
    selectedUsers.splice(index, 1);
    div.classList.remove("active");
  }

  console.log("SELECTED USERS:", selectedUsers);

};

    box.appendChild(div);


div.querySelector(".resetBtn").onclick = async (e) => {

  e.stopPropagation(); // biar tidak select user

  const uid = e.target.dataset.uid;

  const ok = confirm("Reset semua gift user ini?");

  if(!ok) return;

  await update(ref(db, `Users/${uid}`), {
    gifts: null,
    giftTotal: 0
  });

  alert("Gift user berhasil direset!");

  loadUsers(); // refresh list

};


  });

}

/* ================= LOAD GIFTS ================= */
async function loadGifts(){

  const snap = await get(ref(db,"Gift"));

  gifts = snap.val() || {};

  const box = document.getElementById("giftList");
  box.innerHTML = "";

  Object.keys(gifts).forEach(id=>{

    const g = gifts[id];

    const div = document.createElement("div");
    div.className = "gift-box";

    div.innerHTML = `
      <img src="${g.img}">
      <div style="flex:1; padding-left:10px;">
        <div>${g.name}</div>
        <small>${g.price}</small>
      </div>
      <input type="number" min="0" max="10" value="${getRandomGiftValue()}" id="gift_${id}">
    `;

    box.appendChild(div);

  });

}

function getRandomGiftValue(){
  return Math.floor(Math.random() * 10) + 1; // 1 - 10
}


/* ================= SAVE GIFTS ================= */
document.getElementById("saveBtn").onclick = async ()=>{

  if(selectedUsers.length === 0){
    alert("Pilih user dulu");
    return;
  }

  for(const giftId in gifts){

    const qty = parseInt(document.getElementById("gift_"+giftId).value || 0);

    if(qty <= 0) continue;

    const giftName = gifts[giftId].name;
    const giftImg = gifts[giftId].img;

    for(const userId of selectedUsers){

      const giftRef = ref(db, `Users/${userId}/gifts`);

      const snap = await get(giftRef);
      const data = snap.val() || {};

      let foundKey = null;

      // 🔍 cari gift yang sama
      for(const key in data){
        if(data[key].name === giftName){
          foundKey = key;
          break;
        }
      }

      if(foundKey){

        // ✅ UPDATE kalau sudah ada
        await update(
          ref(db, `Users/${userId}/gifts/${foundKey}`),
          {
            total: data[foundKey].total + qty
          }
        );

      } else {

        // ➕ CREATE kalau belum ada
        const newKey = Date.now() + "_" + giftId;

        await update(
          ref(db, `Users/${userId}/gifts/${newKey}`),
          {
            name: giftName,
            image: giftImg,
            total: qty,
            time: Date.now()
          }
        );

      }

    }

  }

  alert("Gift berhasil dikirim (merge mode)!");
};

/* ================= INIT ================= */
loadUsers();
loadGifts();

</script>

</body>
</html>
