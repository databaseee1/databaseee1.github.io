<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Host Users</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#f5f5f5;
}

.header{
  padding:15px;
  text-align:center;
  font-weight:600;
  background:#fff;

}

.container{
  padding:10px;
}

.card{

  padding:12px;
  border-radius:12px;
  margin-bottom:10px;

}

.top{
  display:flex;
  align-items:center;
  gap:10px;
}

.top img{
  width:45px;
  height:45px;
  border-radius:50%;
  object-fit:cover;
}

.name{
  font-weight:600;
}

.small{
  font-size:12px;
  color:#777;
}

.btn{
  margin-top:10px;
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.btn button{
  padding:6px 10px;
  border:none;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
}

.approved{background:#2ecc71;color:#fff;}
.tolak{background:#f39c12;color:#fff;}
.banned{background:#e74c3c;color:#fff;}
.suspend{background:#8e44ad;color:#fff;}

.edit{
  background:#3498db;
  color:#fff;
}




.menu-wrap-top{
  position:absolute;
  top:10px;
  right:10px;
}

.hamburger{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#3498db;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}

.menu-box{
  display:none;
  position:absolute;
  top:38px;
  right:0;
  background:#2c8d65;
  border:1px solid #eee;
  border-radius:10px;
  padding:6px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  z-index:999;
}

.menu-box button{
  width:130px;
  padding:7px;
  border:none;
  background:none;
  text-align:left;
  cursor:pointer;
  font-size:13px;
  color: #fff;
}

.menu-box button:hover{
  background:#b16060;
}



.search-box{
  display:flex;
  align-items:center;
  gap:8px;
  background:#fff;
  margin:10px;
  padding:10px 12px;
  border-radius:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.search-box i{
  color:#777;
}

.search-box input{
  border:none;
  outline:none;
  width:100%;
  font-size:14px;
  font-family:'Poppins',sans-serif;
}

.status{
  font-size:11px;
  padding:3px 8px;
  border-radius:8px;
  color:#fff;
  text-transform:uppercase;
  font-weight:600;
}

/* STATUS COLOR */
.status.approved{ background:#2ecc71; }
.status.banned{ background:#e74c3c; }
.status.tolak{ background:#f39c12; }
.status.suspend{ background:#8e44ad; }
.status.unknown{ background:#999; }

.popup99status_overlay{
  position:fixed;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:999999;
}

.popup99status_box{
  width:90%;
  max-width:500px;   /* 🔥 lebih lebar */
  background:#fff;
  border-radius:14px;
  padding:20px;
  text-align:center;
}

.popup99status_title{
  font-weight:600;
  margin-bottom:12px;
  font-size:16px;
}

/* 🔥 INPUT LEBIH BESAR */
#popup99status_input{
  width:90%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:12px;
  margin-bottom:15px;
  font-size:14px;
  min-height:45px;
}

/* 🔥 tombol lebih enak */
.popup99status_btns{
  display:flex;
  justify-content:space-between;
  gap:12px;
}

.popup99status_btns button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:14px;
}

#popup99status_cancel{
  background:#ccc;
}

#popup99status_ok{
  background:#2ecc71;
  color:#fff;
}






.last-active,
.current-page {
  background: #8cd0ff; 
  padding: 4px 8px;
  border-radius: 6px;
  display: inline-block;
  margin-top: 4px;
}

</style>
</head>

<body>

<div class="header">ADMIN HOST USERS</div>
<div class="search-box">
  <i class="fa fa-search"></i>
  <input id="searchInput" type="text" placeholder=" Cari nama...">
</div>



<div class="container" id="list"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase,
  ref,
  get,
  set,
  push,
  onValue
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);




/* ================= CEK LOGIN ================= */

const adminData = JSON.parse(localStorage.getItem("adminLogin"));

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}







let allUsers = {};



/* LOAD USERS */
async function loadUsers(){

  const snap = await get(ref(db,"users2"));

  if(!snap.exists()) return;

  allUsers = snap.val();
  renderUsers(allUsers);
}

loadUsers();
function renderUsers(data){

  const list = document.getElementById("list");
  list.innerHTML = "";

  Object.keys(data)
.sort((a, b) => b.localeCompare(a))
  .forEach(id => {

const u = data[id];

const div = document.createElement("div");
div.className = "card";

if(u.statusAdminCard === "sudah"){

  div.style.background = "#fff3cd";
  div.style.border = "1px solid #ffe69c";

}

if(u.statusAdminCard === "sukses"){

  div.style.background = "#198754";
  div.style.color = "#fff";
}



div.id = "card-" + id;

    div.innerHTML = `
      <div class="top">
        <img src="${u.profil}">
        <div>
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
  
  <div class="name">${u.nama}</div>

  <div class="status ${u.status || 'unknown'}">
    ${u.status || 'no status'}
  </div>

</div>
          <div class="small">${u.email || ""}</div>
        </div>
      </div>

      <div class="small">Saldo: ${u.saldo}</div>
      <div class="small">Level: ${u.level}</div>
      <div class="small">WA: ${u.wa || "-"}</div>



<div class="small last-active">
  Terakhir aktif: ${formatLastActive(u.lastActive)}
</div>

<div class="small current-page">
  Page: ${u.currentPage || "-"}
</div>



      <div class="menu-wrap-top">
        <div class="hamburger" onclick="toggleMenu('${id}')">
          <i class="fa fa-ellipsis-vertical"></i>
        </div>





<div class="menu-box" id="menu-${id}">
  <button onclick="setStatus('${id}','approved')">Approved</button>
  <button onclick="setStatus('${id}','tolak')">Tolak</button>
  <button onclick="setStatus('${id}','banned')">Banned</button>
  <button onclick="setStatus('${id}','suspend')">Suspend</button>
  <button onclick="catatanPembayaran('${id}')">
Catatan
</button>

  <button onclick="setSudah('${id}')">Sudah</button>
  <button onclick="setSukses('${id}')">Sukses</button>

  <button onclick="terimaData('${id}')">Terima</button>

  <button style="background:#e74c3c;color:#fff;" onclick="deleteUser('${id}')">
    Hapus Data
  </button>

  <hr style="border:none;border-top:1px solid #eee;margin:6px 0;">

  <button onclick="editData('${id}')">Edit</button>
</div>


      </div>
    `;




if(u.statusAdminCard === "sukses"){

  setTimeout(()=>{

    div.querySelectorAll("*").forEach(el=>{
      el.style.color = "#fff";
    });

  },0);

}





    list.appendChild(div);

  });
}



loadUsers();




window.setSudah = async function(userId){

  const snap = await get(
    ref(db, "users2/" + userId + "/statusAdminCard")
  );

  const status = snap.exists()
    ? snap.val()
    : "";

  if(status === "sudah"){

    await set(
      ref(db, "users2/" + userId + "/statusAdminCard"),
      ""
    );

    showAlert99("Status dikembalikan normal");

  }else{

    await set(
      ref(db, "users2/" + userId + "/statusAdminCard"),
      "sudah"
    );

    showAlert99("Status diubah ke Sudah");

  }

  loadUsers();
};

window.setSukses = async function(userId){

  const snap = await get(
    ref(db, "users2/" + userId + "/statusAdminCard")
  );

  const status = snap.exists()
    ? snap.val()
    : "";

  if(status === "sukses"){

    await set(
      ref(db, "users2/" + userId + "/statusAdminCard"),
      ""
    );

    showAlert99("Status dikembalikan normal");

  }else{

    await set(
      ref(db, "users2/" + userId + "/statusAdminCard"),
      "sukses"
    );

    showAlert99("Status diubah ke Sukses");

  }

  loadUsers();
};














onValue(ref(db, "users2"), (snap) => {

  const data = snap.val();
  if (!data) return;

  Object.keys(data).forEach(id => {

    const u = data[id];

    const card = document.getElementById("card-" + id);
    if (!card) return;

    const lastActiveEl = card.querySelector(".last-active");
    const pageEl = card.querySelector(".current-page");

    if (lastActiveEl) {
      lastActiveEl.innerHTML =
        `Terakhir aktif: ${formatLastActive(u.lastActive)}`;
    }

    if (pageEl) {
      pageEl.innerHTML =
        `Page: ${u.currentPage || "-"}`;
    }

  });

});

/* ================= UPDATE STATUS AKTIF/PANTAU ================= */
function formatLastActive(timestamp) {
  if (!timestamp) return "-";

  const date = new Date(timestamp);

  const tgl = String(date.getDate()).padStart(2, "0");
  const bln = String(date.getMonth() + 1).padStart(2, "0");
  const thn = date.getFullYear();

  const jam = String(date.getHours()).padStart(2, "0");
  const menit = String(date.getMinutes()).padStart(2, "0");

  return `${tgl}/${bln}/${thn} pukul ${jam}:${menit} WIB`;
}







window.terimaData = async function(userId){

  const u = allUsers[userId];

  if(!u) return;

  const text =

`nama
${u.nama || "-"}
-----------------

appName
${u.appName || "-"}
-----------------

bank
${u.bank || "-"}

const searchInput = document.getElementById("searchInput");

searchInput.addEventListener("input", function(){

  const val = this.value.toLowerCase();

  const filtered = {};

  Object.keys(allUsers).forEach(id => {

    const u = allUsers[id];

    const nama = String(u.nama || "").toLowerCase();
    const wa = String(u.wa || "").toLowerCase();
    const rekening = String(u.rekening || "").toLowerCase();
    const appname = String(u.appname || "").toLowerCase();

    const match =
      nama.includes(val) ||
      wa.includes(val) ||
      rekening.includes(val) ||
      appname.includes(val);

    if(match){
      filtered[id] = u;
    }

  });

  renderUsers(filtered);
});

/* SET STATUS */
window.setStatus = async function(userId, status){

  let defaultAlasan = "";

  if(status === "approved"){
    defaultAlasan =
  `Akun Anda telah disetujui oleh pihak aplikasi Tigo. Selanjutnya Anda dapat mengaktifkan akun Anda sebelum sistem menghapus akun ini karena ditandai sebagai host tidak aktif~ <a href="Verifikasi.html" style="color:blue;text-decoration:underline;">Verifikasi sekarang</a>`;
  }

  else if(status === "tolak"){
    defaultAlasan = "Maaf, akun Anda tidak memenuhi persyaratan.";
  }

  else if(status === "banned"){
    defaultAlasan = `Akun tidak diizinkan untuk masuk karena melanggar aturan~
       Hubungi <a href="Layanan_pelanggan.html" style="color:blue;text-decoration:underline;">
       Layanan pelanggan
       </a>`;
  }

  else if(status === "suspend"){
    defaultAlasan = "Akun Anda disuspend sementara oleh sistem.";
  }

  const alasan = await show99PopupStatus(defaultAlasan);

  if(!alasan) return;





  const waktu = new Date().toLocaleString("id-ID");

  // ================= STATUS LOG =================
  await set(ref(db, "Statusakun_host/" + userId), {
    status,
    keterangan: alasan,
    waktu
  });

  // 🔥 INI YANG KURANG (WAJIB TAMBAH)
  await set(ref(db, "users2/" + userId + "/status"), status);

  // ================= NOTIFIKASI =================
  const notifText =
    status === "approved"
      ? "Selamat! akun Anda telah di terima oleh platform aplikasi Tigo."
      : status === "banned"
      ? "Akun Anda telah dibanned oleh sistem,mohon patuhi kebijakan sistem platform kami."
      : status === "suspend"
      ? "Akun Anda disuspend."
      : "Status akun diperbarui.";

  await push(ref(db, "fithnerchats/notifikasi"), {
    userId: userId,        
    text: notifText + " (" + alasan + ")",
    profil: "ic_launcher_circle.png",
    read: false,
    status: status,
    time: Date.now()
  });

  showAlert99("Status & Notifikasi terkirim!");
};





window.editData = function(userId){

  window.location.href =
    "admineditdata_host.html?uid=" + userId;

};

window.catatanPembayaran = function(id){

  window.location.href =
    "catatanpembayaran.html?uid=" + id;

};




window.toggleMenu = function(id){

  const menu = document.getElementById("menu-" + id);

  document.querySelectorAll(".menu-box").forEach(m => {
    if(m !== menu) m.style.display = "none";
  });

  menu.style.display = menu.style.display === "block"
    ? "none"
    : "block";
};




window.show99PopupStatus = function(defaultValue = ""){

  return new Promise((resolve) => {

    const overlay = document.getElementById("popup99status_overlay");
    const input = document.getElementById("popup99status_input");
    const ok = document.getElementById("popup99status_ok");
    const cancel = document.getElementById("popup99status_cancel");

    input.value = defaultValue;   // 🔥 isi otomatis sesuai status
    overlay.style.display = "flex";

    ok.onclick = () => {
      overlay.style.display = "none";
      resolve(input.value.trim());
    };

    cancel.onclick = () => {
      overlay.style.display = "none";
      resolve(null);
    };

  });

};



window.deleteUser = function(userId){

  const overlay = document.getElementById("popup99status_delete_overlay");
  const ok = document.getElementById("popup99status_delete_ok");
  const cancel = document.getElementById("popup99status_delete_cancel");

  overlay.style.display = "flex";

  cancel.onclick = () => {
    overlay.style.display = "none";
  };

  ok.onclick = async () => {

    overlay.style.display = "none";

    try {
      const { ref, remove } = await import(
        "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
      );

      await remove(ref(db, "users2/" + userId));

      showAlert99("Data berhasil dihapus!");

      loadUsers(); // refresh list

    } catch (e) {
      console.error(e);
      showAlert99("Gagal menghapus data!");
    }

  };

};

window.showAlert99 = function(message){

  const overlay = document.getElementById("popup99status_alert");
  const text = document.getElementById("popup99status_alert_text");
  const ok = document.getElementById("popup99status_alert_ok");

  text.innerHTML = message; 
  overlay.style.display = "flex";

  ok.onclick = () => {
    overlay.style.display = "none";
  };

};

</script>




<div id="popup99status_overlay" class="popup99status_overlay">
  <div class="popup99status_box">

    <div class="popup99status_title">
      Masukkan Keterangan
    </div>

    <input id="popup99status_input" type="text" placeholder="Tulis alasan...">

    <div class="popup99status_btns">
      <button id="popup99status_cancel">Batal</button>
      <button id="popup99status_ok">OK</button>
    </div>

  </div>
</div>

<div id="popup99status_delete_overlay" class="popup99status_overlay">
  <div class="popup99status_box">

    <div class="popup99status_title">
      Yakin ingin menghapus data ini?
    </div>

    <div class="popup99status_btns">
      <button id="popup99status_delete_cancel">Batal</button>
      <button id="popup99status_delete_ok" style="background:#e74c3c;color:#fff;">
        Hapus
      </button>
    </div>

  </div>
</div>

<div id="popup99status_alert" class="popup99status_overlay">
  <div class="popup99status_box">

    <div id="popup99status_alert_text" class="popup99status_title">
      Pesan
    </div>

    <div class="popup99status_btns">
      <button id="popup99status_alert_ok" style="background:#2ecc71;color:#fff;">
        OK
      </button>
    </div>

  </div>
</div>


</body>
</html>
