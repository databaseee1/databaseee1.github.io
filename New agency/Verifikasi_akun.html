<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<title>Verifikasi Akun</title>

<style>



* {
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  outline: none !important;
}

/* hilangkan highlight saat klik/focus */
button, a, div, span, img {
  outline: none !important;
}


img {

  -webkit-user-drag: none;
  user-select: none;
}



* {
  user-select: none;
  -webkit-user-select: none;
  -ms-user-select: none;
}



body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#ffffff;
  color:#000;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.box{
  text-align:center;
  padding:20px;
}

.icon{
  font-size:60px;
  margin-bottom:15px;
}

.title{
  font-size:20px;
  font-weight:700;
  margin-bottom:8px;
}

.desc{
  font-size:14px;
  color:#555;
  margin-bottom:20px;
}

.line{
  width:60px;
  height:2px;
  background:#000;
  margin:0 auto 20px auto;
  border-radius:10px;
}

button{
  padding:10px 18px;
  border:1px solid #000;
  background:#fff;
  color:#000;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

button:active{
  transform:scale(0.97);
}
</style>
</head>

<body>

<div class="box">


  <div class="title">Sedang Dalam Pengembangan</div>

  <div class="line"></div>

  <div class="desc">
    Menu Verifikasi Akun masih dalam tahap pengembangan.<br>
    Silakan kembali nanti.
  </div>

</div>



<script>

  

/* ================= (NO zoom) ================= */
document.addEventListener("contextmenu", e => e.preventDefault());
document.addEventListener("dragstart", e => e.preventDefault());
document.addEventListener("selectstart", e => e.preventDefault());

/* ❌ BLOCK ZOOM KEYBOARD (Ctrl + / - / 0) */
document.addEventListener("keydown", function (e) {
  if (
    (e.ctrlKey && e.key === "+") ||
    (e.ctrlKey && e.key === "-") ||
    (e.ctrlKey && e.key === "0") ||
    (e.ctrlKey && e.key === "=")
  ) {
    e.preventDefault();
  }
});

/* BLOCK PINCH ZOOM (mobile) */
document.addEventListener("gesturestart", function (e) {
  e.preventDefault();
});

document.addEventListener("gesturechange", function (e) {
  e.preventDefault();
});

document.addEventListener("gestureend", function (e) {
  e.preventDefault();
});
/* ================= (NO zoom) ================= */


</script>

</body>
</html>
