<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Foto Global</title>
<style>
body{font-family:Arial;background:#f5f5f5;padding:20px}
.box{background:#fff;padding:15px;border-radius:10px;margin-bottom:20px}
img{width:80px;height:80px;object-fit:cover;border-radius:10px}
button{padding:6px 10px;margin-top:5px}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.item{background:#fff;padding:10px;border-radius:10px}
</style>
</head>
<body>

<div class="box">
  <h3>Upload Foto Global</h3>
  <input type="file" id="fileInput" multiple accept="image/*">
  <button onclick="uploadFoto()">Upload</button>
</div>

<div class="box">
  <h3>List Foto</h3>
  <div id="list" class="grid"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, push, get, remove, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkkrmYKIh6hejmTWf3acvLVImIAMOMNKU",
  authDomain: "users-96dc5.firebaseapp.com",
  databaseURL: "https://users-96dc5-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "users-96dc5",
  storageBucket: "users-96dc5.firebasestorage.app",
  messagingSenderId: "483322415863",
  appId: "1:483322415863:web:1397a8f2e808e66ad9e1f2",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);





/* ================= CEK LOGIN ================= */

const adminData = JSON.parse(localStorage.getItem("adminLogin"));

if (!adminData || adminData.role !== "admin") {
  window.location.replace("Login_admin.html");
}











/* CLOUDINARY CONFIG */
const CLOUD_NAME = "dowoq4a0i";
const UPLOAD_PRESET = "upload_fotoglobal";

/* UPLOAD KE CLOUDINARY */
window.uploadFoto = async function () {
  const input = document.getElementById("fileInput");

  if (!input.files || input.files.length === 0) {
    alert("Pilih file dulu");
    return;
  }

  const files = Array.from(input.files);

  for (let file of files) {
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", "fotousershost");
    formData.append("folder", "fotousershost");

    try {
      const res = await fetch(
        "https://api.cloudinary.com/v1_1/dowoq4a0i/image/upload",
        {
          method: "POST",
          body: formData
        }
      );

      const data = await res.json();

      if (!data.secure_url) {
        console.log("Upload gagal:", data);
        continue;
      }

      await push(ref(db, "fotoglobal"), {
        url: data.secure_url,
        public_id: data.public_id || ""
      });

    } catch (err) {
      console.error("Error upload file:", err);
    }
  }

  alert("Upload semua foto selesai");
  loadList();

  // reset input
  input.value = "";
};

/* LOAD LIST */
async function loadList(){
  const snap = await get(ref(db,"fotoglobal"));

  if(!snap.exists()) return;

  const data = snap.val();
  const list = document.getElementById("list");
  list.innerHTML = "";

  Object.entries(data).forEach(([key,val])=>{
    list.innerHTML += `
      <div class="item">
        <img src="${val.url}">
        <br>
        <button onclick="hapus('${key}','${val.public_id}')">Hapus</button>
      </div>
    `;
  });
}

window.hapus = async function(key, public_id){

  // hapus firebase
  await remove(ref(db,"fotoglobal/"+key));

  // hapus cloudinary
  await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/delete_by_token`, {
    method:"POST",
    body: JSON.stringify({public_id})
  }).catch(()=>{});

  loadList();
};

loadList();
</script>

</body>
</html>
