/* ================= UPDATE STATUS AKTIF/PANTAU ================= */
function formatLastActive(timestamp) {
  if (!timestamp) return "-";

  const date = new Date(timestamp);

  const tgl = String(date.getDate()).padStart(2, "0");
  const bln = String(date.getMonth() + 1).padStart(2, "0");
  const thn = date.getFullYear();

  const jam = String(date.getHours()).padStart(2, "0");
  const menit = String(date.getMinutes()).padStart(2, "0");

  return `${tgl}/${bln}/${thn} pukul ${jam}:${menit} WIB`;
}

onValue(ref(db, "users2"), (snap) => {

  const data = snap.val();
  if (!data) return;

  let latestUser = null;

  Object.keys(data).forEach(id => {
    const u = data[id];

    if (!u.lastActive) return;

    if (!latestUser || u.lastActive > latestUser.lastActive) {
      latestUser = { id, ...u };
    }
  });

  const box = document.getElementById("liveActivityBox");

  if (!latestUser) {
    box.innerHTML = "Tidak ada aktivitas user";
    return;
  }

  

  box.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">

    <!-- LEFT: PROFILE + NAME -->
    <div style="display:flex;align-items:center;gap:8px;">
      <img src="${latestUser.profil || 'https://via.placeholder.com/30'}"
        style="width:30px;height:30px;border-radius:50%;object-fit:cover;">
      
      <div>
        <div style="font-size:13px;font-weight:600;">
          ${latestUser.nama}
        </div>
        <div style="font-size:11px;color:#555;">
          aktif ${formatLastActive(latestUser.lastActive)}
        </div>
      </div>
    </div>

    <!-- RIGHT: TIME + ARROW -->

      <div style="font-size:11px;color:#444;">
        
      </div>

      <i class="fa fa-chevron-right" id="openPantauBtn"
        style="cursor:pointer;"></i>
    </div>

  </div>
`;

});

document.addEventListener("click", (e) => {

    if (!box) return;

    if (box.style.display === "block") {

    } else {

    }
  }
});




function getStartOfWeek() {
  const now = new Date();
  const day = now.getDay();
  const diff = now.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(now.setDate(diff));
  monday.setHours(0,0,0,0);
  return monday.getTime();
}

onValue(ref(db, "users2"), (snap) => {

  const data = snap.val();
  if (!data) return;

  const weekStart = getStartOfWeek();
  const list = document.getElementById("pantauList");

  list.innerHTML = "";

  Object.keys(data).forEach(id => {
    const u = data[id];

    if (u.lastActive && u.lastActive >= weekStart) {

      const div = document.createElement("div");
      div.style = "display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid #eee;";

      div.innerHTML = `
        <img src="${u.profil || 'https://via.placeholder.com/30'}"
          style="width:28px;height:28px;border-radius:50%;">
        <div>
          <div style="font-weight:600;font-size:13px;">${u.nama}</div>
          <div style="font-size:11px;color:#666;">
            ${formatLastActive(u.lastActive)}
          </div>
        </div>
      `;

      list.appendChild(div);
    }
  });

});


/* ================= BADGE DEPOSIT ================= */

async function loadBadge() {
  try {
    const snap = await get(ref(db, "Deposithost"));

    let count = 0;

    snap.forEach((child) => {
      const data = child.val();

      if (data.read === false) {
        count++;
      }
    });

    const badge = document.getElementById("depositBadge");

    if (!badge) return;

    if (count > 0) {
      badge.innerText = count;
      badge.style.display = "flex";
    } else {
      badge.style.display = "none";
    }

  } catch (err) {
    console.error("Badge error:", err);
  }
}

function loadUsersBadgeRealtime() {

  const usersRef = ref(db, "users2");

  onValue(usersRef, (snap) => {

    snap.forEach((child) => {
      const data = child.val();

      if (data.read === false) {

    });

    const badge = document.getElementById("usersBadge");

    if (!badge) return;

    if (count > 0) {
      badge.innerText = count > 99 ? "99+" : count;
      badge.style.display = "flex";

    }

  });

}

async function markAllUsersAsRead() {
  const snap = await get(ref(db, "users2"));

  snap.forEach((child) => {
    const key = child.key;
    const data = child.val();

    if (data.read === false) {
      update(ref(db, "users2/" + key), {
        read: true
      });
    }
  });
}

function loadReferralBadge() {

  const refRef = ref(db, "referralHistory");

  onValue(refRef, (snap) => {

    let count = 0;

    snap.forEach((hostSnap) => {
      hostSnap.forEach((child) => {
        const data = child.val();

        if (data.readAdmin === false) {
          count++;
        }
      });
    });

    const badge = document.getElementById("referalBadge");

    if (!badge) return;

    if (count > 0) {
      badge.innerText = count > 99 ? "99+" : count;
      badge.style.display = "flex";
    } else {
      badge.style.display = "none";
    }

  });

}

loadReferralBadge();



window.openReferral = async function () {

  const snap = await get(ref(db, "referralHistory"));

  snap.forEach((hostSnap) => {
    const hostId = hostSnap.key;

    hostSnap.forEach((child) => {
      const key = child.key;
      const data = child.val();

      if (data.readAdmin === false) {
        update(ref(db, `referralHistory/${hostId}/${key}`), {
          readAdmin: true
        });
      }
    });

  });

  // langsung hilangkan badge
  document.getElementById("referalBadge").style.display = "none";

  // pindah halaman
  window.location.href = "admin_referal.html";
};




/* ================= BADGE HOST WD ================= */


onValue(ref(db, "fithnerchats/notifikasi"), (snap) => {

  let count = 0;

  snap.forEach(userSnap => {
    userSnap.forEach(typeSnap => {

      typeSnap.forEach(itemSnap => {
        const d = itemSnap.val();

        if (d.readAdmin === false) {
          count++;

});


window.openWithdraw = function () {

  location.href = "adminhost_withdraw.html";

  import("https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js")
    .then(({ getDatabase, ref, get, update }) => {

      const db = getDatabase();

      get(ref(db, "fithnerchats/notifikasi")).then((snap) => {

        snap.forEach(userSnap => {
          userSnap.forEach(typeSnap => {
            typeSnap.forEach(itemSnap => {

              const data = itemSnap.val();

              if (data.readAdmin === false) {
                update(itemSnap.ref, {
                  readAdmin: true
                });
              }

            });
          });
        });

      });

    });
};
